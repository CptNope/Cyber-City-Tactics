name: CI

# Every push and pull request: the build must be up to date, the headless tests (including the bot
# playthroughs) must pass, and the game must load and play in a real browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: CI checks the code and never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned to a commit)
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (pinned to a commit)
        with:
          node-version: 22

      # exact versions from package.json, and no install scripts from any package
      - name: Install dev tools
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build is up to date
        run: npm run check

      - name: Formatting
        run: npx prettier --check "src/**/*.{js,css}" "tests/**/*.js" "tools/**/*.mjs" sw.js

      - name: Headless tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser
