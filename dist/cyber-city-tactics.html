/* Cyber City Tactics · src/css/game.css — all styles for the page, menus and touch controls. */
/* Layout: one-screen arcade cabinet — canvas fills the stage, touch pad below (portrait) or over the stage (landscape). Single dark look by design. */
:root {
  --ink: #0c0a14;
  --panel: #17121f;
  --panel2: #1f1830;
  --line: #30283f;
  --text: #efe9ff;
  --muted: #a79dc2;
  --neon: #ff3d8b;
  --mana: #45d2ff;
  --gold: #ffc63d;
  --ok: #7dffb0;
  --karma: #b98cff;
  --font-display: 'Teko', Impact, 'Arial Narrow', sans-serif;
  --font-body: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
  --b: 58px;
  --b2: 48px;
  --s: 132px;
  color-scheme: dark;
}
body.size-s {
  --b: 50px;
  --b2: 42px;
  --s: 116px;
}
body.size-l {
  --b: 68px;
  --b2: 56px;
  --s: 152px;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
  overscroll-behavior: none;
}
body {
  -webkit-tap-highlight-color: transparent;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
/* The canvas fills the whole screen inside the notch-safe area; fit() in core/canvas.js sizes the view
   to match the screen's shape, and the touch controls float over it. */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
  box-sizing: border-box;
  position: relative;
}
#stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
#game {
  display: block;
  background: #000;
}
#pauseBtn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  opacity: 0.85;
  border: 1px solid var(--line);
  background: rgba(23, 18, 31, 0.7);
  color: var(--text);
  font: 600 15px var(--font-body);
  cursor: pointer;
  z-index: 4;
}
button:focus-visible {
  outline: 2px solid var(--mana);
  outline-offset: 2px;
}

#ov {
  position: fixed;
  inset: 0;

/* The wordmark (brand book: Name and wordmark): CYBER CITY with the pink/cyan chromatic split, TACTICS knocked
   out of a Neon Pink bar. The bar is the brand's signature shape. */
.card h1.wordmark {

/* First visit only: the sign powers on. CYBER CITY's split pulls into focus while the TACTICS bar
   stutters alight like a neon tube. Under a second, never blocks input, skipped for reduced motion. */
.wordmark.boot .wm-city {
  animation: wmFocus 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}

  0% {
    opacity: 0.12;

  10% {
    opacity: 1;
  }
  16% {
    opacity: 0.25;
  }
  28% {
    opacity: 1;

  33% {
    opacity: 0.5;

  42%,

    opacity: 1;

}

  body.touch {

    --b: min(68px, calc((100vw - 60px) * 0.2));

    --s: min(140px, calc((100vw - 60px) * 0.36));

/* ---------- Standalone page (GitHub Pages, installed app) ---------- */
body {

/* ---------- Update-ready bar (src/js/pwa.js) ---------- */
#updBar {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  gap: 8px;
  align-items: center;

  max-width: calc(100% - 24px);
}
#updBar button {
  font: 600 12px var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-radius: 6px;
  padding: 6px 10px;
  border: 1px solid var(--gold);
  background: var(--gold);
  color: var(--ink);
  cursor: pointer;
}
#updBar button[data-u='later'] {
  background: transparent;
  color: var(--muted);
  border-color: var(--line);
}

/* ---------- Controllers (src/js/core/input.js) ---------- */
/* A connected controller replaces the on-screen pad. */
body.gamepad #pad {
  display: none !important;
}
/* Focus ring for menu navigation with a controller: bold, gold, impossible to lose. */
body.pad-nav #ov :focus {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
  box-shadow: 0 0 0 6px rgba(255, 198, 61, 0.18);
}

/* ---------- Challenge seed box ---------- */
.seedin {
  font: 600 16px var(--font-body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--text);

  border-radius: 6px;
  padding: 8px 10px;

  max-width: 100%;

  user-select: text;
  -webkit-user-select: text;
}
.seedin:focus {
  outline: 2px solid var(--mana);
  outline-offset: 1px;
}

.netcode {

function pollPads() {
  if (!navigator.getGamepads) return;
  let list;
  try {
    list = [...navigator.getGamepads()].filter(Boolean);
  } catch (e) {
    return;
  }
  const now = performance.now();
  list.forEach((gp, n) => {
    if (n > 1) return;
    let who = G.coop && !netP2() ? (list.length >= 2 ? n : 1) : n === 0 ? 0 : -1;
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed),
      ax = gp.axes[0] || 0,
      ay = gp.axes[1] || 0;
    const st = {
      left: b(14) || ax < -0.45,
      right: b(15) || ax > 0.45,
      up: b(12) || ay < -0.45,
      down: b(13) || ay > 0.45,
      jump: b(0),
      kick: b(1),
      punch: b(2),
      spell: b(3),
      dodge: b(4),
      gun: b(5),
      item: b(6),
      swap: b(7),
      sheet: b(8),
      start: b(9),
      special: b(10) || b(11)
    };
    const prev = padPrev[gp.index] || {};
    const pressed = k => st[k] && !prev[k];
    if (Object.keys(st).some(pressed)) {
      userActed = true;
      padSeen(gp);
    }
    // Menus: navigate with the D-pad or stick (held directions repeat), A to pick, B to go back.
    if (!ACTIVE() && G.mode !== 'hack') {
      const dir = ['up', 'down', 'left', 'right'].find(d => st[d]);
      const nav = PAD.nav[gp.index] || (PAD.nav[gp.index] = { dir: null, next: 0 });
      if (!dir) nav.dir = null;
      else if (dir !== nav.dir) {
        nav.dir = dir;
        nav.next = now + 340;
        padMove(dir);
      } else if (now >= nav.next) {
        nav.next = now + 110;
        padMove(dir);
      }
      if (pressed('jump') || pressed('start')) padActivate();
      else if (pressed('kick')) padBack();
      else if (pressed('dodge')) padTabs(-1);
      else if (pressed('gun')) padTabs(1);
      else if (pressed('sheet') && G.mode === 'sheet') globalAct('sheet', who >= 0 ? who : 0);
      padPrev[gp.index] = st;
      return;
    }
    if (G.mode === 'hack') {
      if (pressed('punch') || pressed('jump')) hackPress();
      else if (pressed('spell')) useIce();
      else if (pressed('kick')) padBack();
      padPrev[gp.index] = st;
      return;
    }
    for (const k in st) {
      const on = st[k],
        was = !!prev[k];
      if (k === 'start') {
        if (on && !was) {
          A.unlock();
          if (!G.coop && n === 1) joinRunner2();
          else togglePause();
        }
        continue;
      }
      if (k === 'sheet') {
        if (on && !was && who >= 0) globalAct('sheet', who);
        continue;
      }
      if (who < 0) continue;
      if (on && !was) kp(who, k, true);
      else if (!on && was) kp(who, k, false);
    }
    padPrev[gp.index] = st;
  });
}

function applyArch(p, key) {
  const A0 = ARCH[key] || ARCH.runner;
  p.arch = ARCH[key] ? key : 'runner';
  p.attr = Object.assign({ hak: 1 }, A0.attr);
  p.cy = Object.assign({ arm: 0, wired: 0, plate: 0 }, A0.cy || {});
  if (A0.weapon) p.eq.weapon = mkItem('weapon', A0.weapon, 0);
  if (A0.gun) p.eq.gun = mkItem('gun', A0.gun, 0);
  if (A0.noGun) p.eq.gun = null;
  if (A0.spells) p.spells = A0.spells.slice();
  if (A0.ammo) p.ammo = A0.ammo;
  p.sk = null;
  p.spts = undefined;
  initSkills(p);
  p.coat = pendCoat(p.idx);
  p.trail = trailOpen(pendTrail(p.idx)) ? pendTrail(p.idx) : 'none';
  if (!coatOpen(p.coat)) p.coat = 'sig';
  applyCoat(p);
  refresh(p);
  p.hp = p.maxHp;
  p.mp = p.maxMp;
}

function mkItem(slot, base, rar, mod) {
  const b = BASES[slot][base] || Object.values(BASES[slot])[0],
    r = RAR[rar];
  if (mod === true) {
    const ms = Object.keys(AFFIX).filter(k => AFFIX[k].slots.includes(slot));
    mod = pick(ms);
  }
  const it = {
    uid: Math.random().toString(36).slice(2, 9),
    slot,
    base,
    rar,
    name: (rar ? r.n + ' ' : '') + (mod ? AFFIX[mod].n + ' ' : '') + b.name,
    bonus: Object.assign({}, b.bonus || {})
  };
  if (mod) it.mod = mod;
  if (b.dmg) it.dmg = Math.round(b.dmg * r.m);
  if (b.arm) it.arm = Math.round(b.arm * r.m);
  if (b.reach) it.reach = b.reach;
  if (b.fire) it.fire = b.fire;
  if (b.look) it.look = b.look;
  const ks = Object.keys(ATTRS);
  for (let i = 0; i < rar; i++) {
    const k = pick(ks);
    it.bonus[k] = (it.bonus[k] || 0) + 1;
  }
  it.price = Math.round(b.price * (1 + rar * 0.7) * (mod ? 1.3 : 1));
  return it;
}
/* Salvage and crafting at Ratchet's: scrap gear into parts, then spend parts to reroll an affix or raise rarity. */
const salvageParts = it => (it.leg ? 0 : 1 + it.rar * 2 + (it.mod ? 1 : 0));
const REROLL = { parts: 3, creds: 40 };
const upgradeCost = it => ({ parts: 4 * (it.rar + 1), creds: 80 * (it.rar + 1) });
const canUpgrade = it => !!it && !it.leg && it.rar < 2;
const canReroll = it => !!it && !it.leg;
function renameItem(it) {
  const b = BASES[it.slot][it.base];
  it.name = (it.rar ? RAR[it.rar].n + ' ' : '') + (it.mod ? AFFIX[it.mod].n + ' ' : '') + b.name;
  it.price = Math.round(b.price * (1 + it.rar * 0.7) * (it.mod ? 1.3 : 1));
}
function rerollItem(it) {
  if (!canReroll(it)) return false;
  const ms = Object.keys(AFFIX).filter(k => AFFIX[k].slots.includes(it.slot) && k !== it.mod);
  it.mod = pick(ms);
  renameItem(it);
  return true;
}
function upgradeItem(it) {
  if (!canUpgrade(it)) return false;
  const b = BASES[it.slot][it.base];
  it.rar++;
  if (b.dmg) it.dmg = Math.round(b.dmg * RAR[it.rar].m);
  if (b.arm) it.arm = Math.round(b.arm * RAR[it.rar].m);
  const k = pick(Object.keys(ATTRS));
  it.bonus[k] = (it.bonus[k] || 0) + 1;
  renameItem(it);
  return true;
}
function randItem(stage, boost) {
  const slot = pick(['weapon', 'gun', 'armor', 'weapon', 'gun']);
  const bases = Object.keys(BASES[slot]);
  const top = clamp(Math.floor(stage) + 1 + (boost ? 1 : 0), 0, bases.length - 1);
  const base = bases[ri(Math.max(0, top - 2), top)];
  const roll = Math.random() + stage * 0.12 + (boost ? 0.45 : 0);
  const rar = roll > 1.15 ? 2 : roll > 0.68 ? 1 : 0;
  return mkItem(slot, base, rar, Math.random() < [0, 0.4, 0.8][rar]);
}

function genBg(S, seed) {
  const r = srng(seed);
  const far = [],
    near = [];
  let x = -40;
  while (x < S.len * 0.25 + WMAX + 60) {
    const w = 24 + r() * 46,
      h = 50 + r() * 95;
    const wins = [];
    for (let wy = 8; wy < h - 6; wy += 9)
      for (let wx = 5; wx < w - 6; wx += 8) if (r() < 0.22) wins.push([wx, wy]);
    far.push({ x, w, h, wins });
    x += w + 2 + r() * 6;
  }
  x = -60;
  let si2 = 0;
  while (x < S.len * 0.55 + WMAX + 80) {
    const w = 56 + r() * 70,
      h = 70 + r() * 80;
    const wins = [];
    for (let wy = 10; wy < h - 8; wy += 12)
      for (let wx = 7; wx < w - 8; wx += 11) if (r() < 0.3) wins.push([wx, wy]);
    const b = { x, w, h, wins };
    if (S.signs.length && r() < 0.7) {
      const sg = S.signs[si2++ % S.signs.length];
      b.sign = { t: sg[0], c: sg[1], vert: r() < 0.35, dx: 6 + r() * (w - 50), dy: 12 + r() * (h * 0.4) };
    }
    near.push(b);
    x += w + 10 + r() * 30;
  }
  return { far, near };
}

/* ===== src/js/game/update.js ===== */
/* Cyber City Tactics · src/js/game/update.js
 * One simulation step: entities, projectiles, pickups, waves, the Den, the camera and district clears.
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */
/* ================= world update ================= */
function update() {
  G.t++;
  if (G.banner > 0) G.banner--;
  else if (G.banner < 0) G.banner++;
  if (G.goT > 0 && !G.waveLive) G.goT--;
  if (G.fade > 0 && !G.outro) G.fade = Math.max(0, G.fade - 0.035);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - 0.05);
  G.comboT++;
  if (G.comboT > (G.dun && G.dun.b.type === 'club' ? 220 : 110)) G.combo = 0;
  if (G.drive) return driveUpdate(); // driving missions run their own step (modes/drive.js)
  if (G.stealth) return stealthUpdate(); // and so do drone stealth jobs (modes/stealth.js)
  if (G.flight && !G.flight.roof) return flightUpdate(); // and flight jobs (modes/flight.js), until they land on a roof
  for (const p of PL) {
    if (p.parryT > 0) p.parryT--;
    if (p.chiT > 0) p.chiT--;
    if (!p.out) upRunner(p);
  }
  reviveTick();
  for (const e of G.ents) if (e.kind === 'ally') upAlly(e);
  if (G.mode !== 'play' && G.mode !== 'den') return;
  // melee slots per target
  for (const p of PL) {
    const mel = G.ents
      .filter(
        e => e.team === 1 && e.tgt === p && e.state !== 'dead' && !e.d.ranged && !e.d.fly && !e.d.passive
      )
      .sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x));
    mel.forEach((e, i) => (e.slot = i));
  }
  const slowSkip = G.slowFoes > 0 && G.t % 2 === 1;
  if (G.slowFoes > 0) G.slowFoes--;
  for (const e of G.ents) if (e.team === 1 && (!slowSkip || e.d.passive)) upEnemy(e);
  for (const z of G.zaps) {
    z.delay--;
    if (z.delay === 0) {
      const tg = z.tg;
      if (tg.state !== 'dead') {
        G.fx.push({
          k: 'zap',
          x: tg.x,
          y: tg.y,
          z: tg.z + 20,
          c: z.bul ? '#ffe28a' : '#b98cff',
          life: 10,
          max: 10,
          r: 0
        });
        sfx.zap();
        hurt(tg, z.dmg, tg.x >= z.src.x ? 1 : -1, {
          src: z.src,
          magic: !z.bul && !z.mel,
          bullet: !!z.bul,
          rico: !!z.bul,
          melee: !!z.mel,
          silk: !!z.mel,
          col: z.mel ? '#ff3d8b' : z.bul ? '#ffe28a' : '#b98cff',
          air: true,
          ax: z.src.x
        });
      }
    }
  }
  G.zaps = G.zaps.filter(z => z.delay > 0);
  while (LATER.length) LATER.shift()();
  for (const e of G.ents) {
    if (e.burnT > 0 && e.state !== 'dead') {
      e.burnT--;
      if (G.t % 8 === 0)
        G.parts.push({
          x: e.x + rand(-6, 6),
          y: e.y,
          z: rand(10, 40),
          vx: 0,
          vy: 0,
          vz: rand(0.4, 1),
          life: 14,
          c: Math.random() < 0.5 ? '#ff6a3d' : '#ffc63d',
          sz: 2
        });
      if (e.burnT % 30 === 0) {
        e.hp -= e.burnDmg;
        e.flash = 4;
        G.texts.push({ x: e.x, y: e.y, z: e.z + 48, s: '' + e.burnDmg, c: '#ff6a3d', life: 24, sm: true });
        if (e.hp <= 0) kill(e, 1, { src: active()[0] });
      }
    }
  }
  G.ents = G.ents.filter(e => !e.gone);
  for (const pr of G.projs) {
    pr.x += pr.vx * (pr.team === 1 && G.slowFoes > 0 ? 0.5 : 1);
    pr.life--;
    if (pr.k === 'prop') {
      pr.z += pr.vz;
      pr.vz -= 0.12;
      if (pr.z <= 0) {
        pr.z = 0;
        shatter(pr);
        pr.life = 0;
        continue;
      }
    }
    if (pr.k === 'nade') {
      pr.z += pr.vz;
      pr.vz -= 0.09;
      if (pr.z <= 0) {
        pr.z = 0;
        explode(pr, { gun: true });
        pr.life = 0;
        continue;
      }
    }
    if (pr.seek) {
      let best = null,
        bd = 1e9;
      for (const e of G.ents) {
        if (
          e.team === pr.team ||
          e.team === 2 ||
          e.state === 'dead' ||
          (e.d && e.d.passive) ||
          (e.x - pr.x) * Math.sign(pr.vx) < 0
        )
          continue;
        const d = Math.abs(e.x - pr.x);
        if (d < bd) {
          bd = d;
          best = e;
        }
      }
      if (best) pr.y += clamp(best.y - pr.y, -0.9, 0.9);
    }
    if (pr.k === 'hex') {
      const tg = alive()[0];
      if (tg) {
        let best = tg;
        for (const q of alive()) if (Math.abs(q.x - pr.x) < Math.abs(best.x - pr.x)) best = q;
        pr.y += clamp(best.y - pr.y, -0.25, 0.25);
      }
      if (G.t % 3 === 0)
        G.parts.push({ x: pr.x, y: pr.y, z: pr.z, vx: 0, vy: 0, vz: 0.3, life: 14, c: '#45d2ff', sz: 1.6 });
    }
    if (pr.k === 'fire' && G.t % 2 === 0)
      G.parts.push({
        x: pr.x - pr.vx,
        y: pr.y,
        z: pr.z + rand(-3, 3),
        vx: -pr.vx * 0.1,
        vy: 0,
        vz: rand(0.2, 0.8),
        life: 16,
        c: Math.random() < 0.5 ? '#ff6a3d' : '#ffc63d',
        sz: 2
      });
    if (pr.k === 'wave' && G.t % 2 === 0)
      G.parts.push({
        x: pr.x,
        y: pr.y + rand(-18, 18),
        z: 0,
        vx: 0,
        vy: 0,
        vz: rand(1, 2.5),
        life: 12,
        c: Math.random() < 0.5 ? '#ff6a3d' : '#8a7a9a',
        sz: 2
      });
    if (pr.k === 'bolt')
      G.parts.push({
        x: pr.x - pr.vx * 0.5,
        y: pr.y,
        z: pr.z,
        vx: 0,
        vy: 0,
        vz: 0,
        life: 8,
        c: '#b98cff',
        sz: 2
      });
    if (pr.x < G.camX - 30 || pr.x > G.camX + W + 30) pr.life = 0;
    if (pr.life <= 0) continue;
    for (const t of G.ents) {
      if (t.team === pr.team || t.state === 'dead' || t.state === 'down' || t.inv > 0 || t.out) continue;
      if (Math.abs(t.y - pr.y) > (pr.wide ? 24 : 9) || Math.abs(t.x - pr.x) > 11) continue;

        explode(pr, { gun: true });

      } else if (pr.k === 'wave') {
        hurt(t, pr.dmg, Math.sign(pr.vx), { kd: true, big: true, col: '#ff6a3d', ax: pr.x - pr.vx * 10 });
        continue;
      } else
        hurt(t, pr.dmg, Math.sign(pr.vx), {
          kb: 5,
          col: pr.k === 'hex' || pr.k === 'laser' ? '#45d2ff' : pr.k === 'bolt' ? '#b98cff' : '#ffe28a',
          kd: pr.k === 'hex' || !!pr.kd,
          src: pr.src,
          ax: pr.x - pr.vx * 10,
          bullet: pr.k === 'bullet',
          magic: pr.k === 'bolt',
          ap: pr.pierce > 0
        });

        const n = Math.round(pr.dmg * 0.5);
        pr.src.hp = Math.min(pr.src.maxHp, pr.src.hp + n);
        say(pr.src, '+' + n + ' HP', '#7dffb0', 60, 34, true);
      }

  }

    k => !k.got && (k.t < 1200 || k.k === 'gear' || k.k === 'chip' || k.k === 'icebrk' || k.k === 'shard')
  );

    for (const p of alive()) {
      if (G.ents.some(e => e.kind === 'vend' && e.state !== 'dead' && Math.abs(e.x - p.x) < 80))
        tip('vend', 'Smash vending machines for medkits, ammo and mana.');
      if (G.props.some(o => Math.abs(o.x - p.x) < 70 && o.x > G.camX))
        tip(
          'prop',
          'Stand next to a can, crate or drum and tap LIFT, then THROW.',
          'Stand next to a can, crate or drum and press J to lift it, then J again to throw.'

  else if (G.arena) arenaTick();

function collect(k, p) {

      PARTY.med++;
      say(p, '+1 MEDKIT', '#7dffb0');

      p.hp = Math.min(p.maxHp, p.hp + 25);
      say(p, '+25 HP', '#7dffb0');

  if (k.k === 'ammo') {

    p.ammo += n;

    say(p, '+' + n + ' AMMO', '#ffe28a');

  if (k.k === 'mana') {
    p.mp = Math.min(p.maxMp, p.mp + 30);

    say(p, k.item.name.toUpperCase(), RCOL[k.item.rar]);

function waves() {

  if (G.waveLive && foes === 0) {

    if (G.camX >= at - 1) {

        e.x += (i >> 1) * (i % 2 ? -18 : 18);

function denTick() {

    const n = nearNPC(p);
    if (n) G.denPrompt = n;
  }

function camera() {
  const S = curS(),
    a = alive();
  if (!a.length) return;
  const minX = Math.min(...a.map(p => p.x)),
    maxX = Math.max(...a.map(p => p.x));
  let target = Math.min((minX + maxX) / 2 - W * 0.42, minX - 14);
  if (G.den || (G.world && !G.dun)) {
    G.camX += (clamp(target, 0, Math.max(0, S.len - W)) - G.camX) * 0.12;
    return;
  }
  if (G.flight) {
    G.camX = G.flight.roof.x; // the roof is one screen
    return;
  }
  if (G.arena || G.training || G.dun) {
    G.camX = 0;
    return;
  }
  const next = S.waves[G.wave];
  let max = Math.max(0, S.len - W);
  if (G.lock != null) max = G.lock;
  else if (next) max = Math.min(max, waveAt(S, next));
  target = clamp(target, 0, max);
  if (G.lock != null) target = G.lock;
  if (target > G.camX) G.camX = Math.min(target, G.camX + 2.2);
  G.camX = Math.max(0, G.camX);
}

function stageClear() {
  const C = PARTY.contract,
    def = CONTRACTS[G.stage];
  if (G.coop) feat('coop');
  if (!G.stageLost) feat('ghost');
  if (mutN()) feat('mut1');
  if (modOn('brawl')) feat('knuckles');
  const deb = {
    stage: G.stage,
    title: C ? C.title : 'the job',
    done: !!(C && C.done),
    creds: 0,
    karma: 0,
    prize: null,
    levels: 0
  };
  if (deb.done) {
    deb.creds = def.creds;
    deb.karma = def.karma;
    if (modOn('pacifist') && !G.gunUsed) {
      deb.karma *= 2;
      deb.pacifist = true;
      feat('pacifist');
    }
    PARTY.creds += def.creds;
    if (def.prize) {
      deb.prize = randItem(3, true);
    }
  }
  PARTY.contract = null;
  const l0 = PL[0].lvl;
  if (deb.karma)
    for (const p of PL) {
      p.karma += deb.karma;
      while (p.karma >= karmaNext(p.lvl)) {
        p.karma -= karmaNext(p.lvl);
        p.lvl++;
        p.pts += 2;
        p.spts = (p.spts || 0) + 1;
      }
      refresh(p);
    }
  deb.levels = PL[0].lvl - l0;
  if (deb.prize) {
    const pz = deb.prize;
    pz.rar = 2;

    if (PARTY.bag.length < BAG_MAX) PARTY.bag.push(gotItem(pz));
  }
  G.debrief = deb;
  G.texts.push({ x: G.camX + W / 2, y: 150, z: 0, s: 'DISTRICT CLEAR', c: '#ffc63d', life: 90, big: true });
  G.outro = 90;
  G.afterOutro = () => {
    if (G.stage >= STAGES.length - 1) {
      feat('win');
      if (G.coop) feat('coopwin');
      if (G.diff === 2) feat('prime');
      if (mutN() >= 3) feat('mut3');
      logRun('Campaign', 'Won');
      store.del('cs_save3');
      musicPlay('title');
      setMode('win');
      return;
    }
    for (const p of PL) {
      p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.4));
      p.mp = p.maxMp;
    }
    G.stock = [
      randItem(G.stage + 1, false),
      randItem(G.stage + 1, false),
      randItem(G.stage + 1, true),
      randItem(G.stage, false),
      randItem(G.stage + 1, false)
    ];
    enterDen();
  };
}

// The cosmetic tick shared by every mode (driving missions run their own update but still need it): particles,
// effects, floating text, rain and the tip box
function tickFx() {
  for (const q of G.parts) {
    q.x += q.vx;
    q.y += q.vy;
    q.z += q.vz;
    q.vz -= 0.15;
    if (q.z < 0) {
      q.z = 0;
      q.vz *= -0.3;
      q.vx *= 0.6;
    }
    q.life--;
  }
  G.parts = G.parts.filter(q => q.life > 0);
  const cap = lowFx() ? 90 : 240; // a hard cap so a huge fight can't bog down a slow device
  if (G.parts.length > cap) G.parts.splice(0, G.parts.length - cap);
  for (const f of G.fx) f.life--;
  G.fx = G.fx.filter(f => f.life > 0);
  for (const tx of G.texts) {
    tx.z += 0.5;
    tx.life--;
  }
  G.texts = G.texts.filter(t => t.life > 0);
  const mxr = curS().matrix;
  for (const r of G.rain) {
    r.y += r.s * (mxr ? 0.5 : 1);
    r.x -= mxr ? 0 : 1.2;
    if (r.y > H) {
      r.y = -10;
      r.x = rand(0, W + 40);
    }
  }
  if (G.tip) {
    G.tip.life--;
    if (G.tip.life <= 0) G.tip = G.tipQ && G.tipQ.length ? G.tipQ.shift() : null;
  }
}

 *    Kagemori in scandal (one guard fewer per wave).
 *  voss (after the Arcology): Voss's backup core. Wipe it, and she can't pull herself back together in the
 *    host (no Voss.exe fight, more ICE instead), or keep it, and Pixel turns it into a back door (Black ICE
 *    starts weaker, but Voss.exe is waiting).
 * Together they pick one of four endings. Choices belong to the run (saved with it, cleared on a fresh run,
 * kept into New Game+ until made again).
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */
const CHOICES = {

    a: {
      wipe: {
        n: 'Wipe the core',
        d: "Voss can't pull herself together in the host: no Voss.exe, but more ICE in her place."

/* Cyber City Tactics · src/js/modes/jobs.js
 * What every job (driving, and the missions to come) shares: banking the take. A job is a standalone run with
 * its own wallet and bag, so when it ends the creds and any gear found can be sent to a save: the Sprawl's
 * stash, or the campaign's (Ratchet's locker in the Den). The host's device holds the saves, so online the
 * host banks for the team.
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */
const JOB_SAVES = [
  { id: 'world', key: 'cs_world', name: 'the Sprawl', where: 'your safehouse stash' },
  { id: 'camp', key: 'cs_save3', name: 'your campaign', where: "Ratchet's locker in the Den" }
];
// the take from the run that just ended: everything in the job's wallet and bag
function jobTake() {
  return { creds: Math.max(0, Math.round(PARTY.creds || 0)), items: (PARTY.bag || []).slice(), banked: null };
}
const jobSavesFound = () => JOB_SAVES.filter(s => store.load(s.key));
// add the take to a save; gear past the stash's 60 slots is sold to the fence at its fence price instead
function jobBank(take, id) {
  const S = JOB_SAVES.find(s => s.id === id),
    save = S && store.load(S.key);
  if (!save || !take || take.banked) return false;
  const party = (save.party = save.party || {});
  party.creds = (party.creds || 0) + take.creds;
  party.stash = party.stash || [];
  let sold = 0;
  for (const it of take.items) {
    if (party.stash.length < STASH_MAX) party.stash.push(Object.assign({}, it, { fresh: true }));
    else sold += sellPrice(it, 'fence');
  }
  party.creds += sold;
  store.set(S.key, save);
  take.banked = { id, name: S.name, where: S.where, sold };
  sfx.coin();
  return true;
}
function jobBankHtml(take) {
  if (!take) return '';
  const n = take.items.length,
    what = `¥${take.creds}${n ? ` and ${n} piece${n === 1 ? '' : 's'} of gear` : ''}`;
  if (!take.creds && !n) return '';
  if (take.banked)
    return `<p style="color:var(--ok)">Banked ${what} to ${esc(take.banked.name)}: ${esc(take.banked.where)}${take.banked.sold ? ` (the stash was full, so some gear was sold for ¥${take.banked.sold})` : ''}.</p>`;
  if (NET.role === 'guest' && NET.live)
    return `<p style="color:var(--muted)">Your partner banks the take on their device.</p>`;
  const saves = jobSavesFound();
  if (!saves.length)
    return `<p style="color:var(--muted)">The take: ${what}. Start a campaign or a Sprawl run and job pay can be banked there.</p>`;
  return `<p>The take: <b style="color:var(--gold)">${what}</b>. Send it to a save:</p>
    <div class="row">${saves.map((s, i) => `<button class="btn sm${i ? ' ghost' : ''}" data-a="jobbank:${s.id}">Bank to ${esc(s.name)}</button>`).join('')}</div>`;
}

  coats: [

    '#2a5a5a',
    '#6a3a2a',
    '#3a5a2a',
    '#2a3a6a',
    '#5a5a62',
    '#6a4a1a',
    '#4a2a44',
    '#1f2a3a',
    '#6a2a3a'

  pants: ['#22324a', '#2b2b2b', '#3a2a22', '#1f2f2a', '#2e2a3e', '#33303a'],
  neon: ['#ff3d8b', '#45d2ff', '#7dffb0', '#ffc63d', '#b98cff', '#ff6a3d'],
  hair: ['#1b1520', '#3a2418', '#6b4a2a', '#c9b08a', '#8a8a96', '#7a2a2a'],
  // metahumans and the dead keep their own skin, just lighter or darker

function cone(x, y, a, half, len, col, alpha) {
  ctx.fillStyle = col;
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + Math.cos(a - half) * len, y + Math.sin(a - half) * len);
  ctx.lineTo(x + Math.cos(a + half) * len, y + Math.sin(a + half) * len);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawStealthCones() {

    top = sfY(SF.ceil);

  ctx.beginPath();
  ctx.rect(0, top, W, SF.floor - top);
  ctx.clip();
  for (const c of S.cams) {
    const x = c.x - cx;
    if (x < -SF.camLen || x > W + SF.camLen) continue;
    const looped = c.offT > 0;
    if (!looped) cone(x, top + 6, camAngle(c), SF.camHalf, SF.camLen, alert ? '#ff3d4a' : '#ffc63d', 0.13);
    ctx.fillStyle = '#2a2436';
    ctx.fillRect(x - 6, top, 12, 6);
    ctx.fillStyle = looped
      ? (G.t >> 3) % 2
        ? '#45d2ff'
        : '#1a3a4a'
      : alert || (G.t >> 4) % 2
        ? '#ff3d4a'
        : '#3a1a1a';
    ctx.fillRect(x - 1.5, top + 6, 3, 3);
  }
  for (const e of G.ents) {
    if (!e.guard || e.state === 'down') continue;
    const x = e.x - cx;
    if (x < -SF.sightLen || x > W + SF.sightLen) continue;
    const len = SF.sightLen * (1 + G.salarm * 0.25),
      half = SF.sightHalf * (1 + G.salarm * 0.2);

      x + e.face * 6,
      sfY(SF.eye),
      e.face > 0 ? 0 : Math.PI,
      half,
      len,
      alert ? '#ff3d4a' : '#9fe9ff',
      0.09
    );
  }
  ctx.restore();
  if (S.ow) drawOverwatch(S);

  P.y = 225;

  e.x = 300;
  e.y = 222;
  e.face = -1;
  const o = spawnEnemy('orc', 1);

function attractStep() {
  G.t++;
  for (const r of G.rain) {
    r.y += r.s;
    r.x -= 1.2;
    if (r.y > H) {
      r.y = -10;
      r.x = rand(0, W + 40);
    }
  }
  const P = PL[0];
  for (const e of G.ents) {
    e.t++;
    if (e.team === 1) {
      e.walk += 0.4;
      if (e.state !== 'walk') e.state = 'walk';
    }
  }
  if (G.t % 120 === 0) setS(P, ['punch', 'kick', 'cast', 'shoot', 'roll'][(G.t / 120) % 5]);

}

        (PARTY.parts || 0) >= c.parts &&
        PARTY.creds >= c.creds &&
        (a === 'reroll' ? rerollItem(it) : upgradeItem(it))
      ) {
        PARTY.parts -= c.parts;
        PARTY.creds -= c.creds;
        refresh(p);
        bump('crafted');
        sfx.buy();
      }
      rerender();
      break;
    }
    case 'gmod': {
      const g = p.eq.gun,
        c = Math.round(GMODS[arg].price * buyMul());
      if (g && g.gmod !== arg && PARTY.creds >= c) {
        PARTY.creds -= c;
        g.gmod = arg;
        bump('gmods');
        sfx.buy();
      }
      rerender();
      break;
    }
    case 'cyber': {
      const l = p.cy[arg] || 0,
        c = Math.round(CYBER[arg].cost(l) * buyMul());
      if (l < cyMax(arg) && PARTY.creds >= c) {
        p.cy[arg] = l;
        if (CYBER[arg].rare) feat('rare');
        PARTY.creds -= c;
        p.cy[arg]++;
        refresh(p);
        sfx.buy();
      }
      rerender();
      break;
    }
    case 'tech': {
      const t = TECH[arg],
        c = t && Math.round(t.cost * buyMul());
      if (t && !hasTech(p, arg) && !(t.innate && t.innate(p)) && PARTY.creds >= c) {
        PARTY.creds -= c;
        p.tech = Object.assign({}, p.tech, { [arg]: 1 });
        refresh(p);
        bump('techs');
        sfx.buy();
        say(p, t.name.toUpperCase(), '#45d2ff', 70, 50);
      }
      rerender();
      break;
    }
    case 'fbuy': {
      const i = G.stock.findIndex(x => x.uid === arg);
      if (i >= 0 && PARTY.creds >= stockPrice(G.stock[i]) && PARTY.bag.length < BAG_MAX) {
        PARTY.creds -= stockPrice(G.stock[i]);
        PARTY.bag.push(gotItem(G.stock[i]));
        G.stock.splice(i, 1);
        sfx.loot();
      }
      rerender();
      break;
    }
    case 'hire': {
      const A = ALLIES[arg],
        ac = A ? Math.round(A.cost * buyMul()) : 0;
      if (A && PARTY.creds >= ac && !(PARTY.ally && PARTY.ally.type === arg)) {
        PARTY.creds -= ac;
        PARTY.ally = null;
        spawnAlly(arg);
        sfx.buy();
      }
      rerender();
      break;
    }
    case 'dismiss':
      PARTY.ally = null;
      G.ents = G.ents.filter(e => e.kind !== 'ally');
      rerender();
      break;
    case 'learn': {
      const s = SPELLS[arg];
      if (!p.spells.includes(arg) && p.D.a.mag >= s.req && PARTY.creds >= s.price) {
        PARTY.creds -= s.price;
        p.spells.push(arg);
        if (s.rare) feat('rare');
        sfx.level();
      }
      rerender();
      break;
    }
  }
  if (keep) {
    const c2 = ov.querySelector('.card');
    if (c2) c2.scrollTop = top;
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (G.mode === 'play' || G.mode === 'den')) togglePause();
});

/* ===== src/js/pwa.js ===== */
/* Cyber City Tactics · src/js/pwa.js
 * Everything that makes the game behave like an installed app:
 *  - registers the service worker (sw.js) and shows an "update ready" bar when a new version has downloaded
 *  - captures the browser's install prompt so Settings and the title screen can offer "Install app"
 *  - asks the browser to keep saves from being evicted (persistent storage)
 *  - save backups: export every save to a JSON file and import it on another device
 *  - app shortcuts: ?go=daily, ?go=arena, ?go=sprawl or ?go=codex open that screen on launch
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */

const PWA = {
  deferred: null, // the saved beforeinstallprompt event
  waiting: null, // a new service worker that has installed and is waiting to take over
  installed:
    matchMedia('(display-mode: standalone)').matches ||
    matchMedia('(display-mode: fullscreen)').matches ||
    navigator.standalone === true,
  // No service worker inside the claude.ai preview, and none on localhost unless ?sw=1 (so edits show up
  // instantly while developing). GitHub Pages and other https hosts always get it.
  canSW:
    typeof BUNDLED === 'undefined' &&
    'serviceWorker' in navigator &&
    !/claude\.ai|claudeusercontent/.test(location.hostname) &&
    (location.protocol === 'https:' ||
      (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]sw=1/.test(location.search)))
};
const isIOS = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ---------- install ---------- */
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  PWA.deferred = e;
  if (['title', 'settings'].includes(G.mode)) renderOv();
});
addEventListener('appinstalled', () => {
  PWA.deferred = null;
  PWA.installed = true;
  if (['title', 'settings'].includes(G.mode)) renderOv();
});
async function pwaInstall() {
  const e = PWA.deferred;
  if (!e) return;
  PWA.deferred = null;
  try {
    e.prompt();
    await e.userChoice;
  } catch (err) {}
  renderOv();
}
/** The install part of the Settings screen. */
function pwaSettingsRows(row) {
  let install;
  if (PWA.installed)
    install = row(
      'App',
      'Installed. It works offline and saves stay on this device.',
      '<span class="ds">✓ Installed</span>'
    );
  else if (PWA.deferred)
    install = row(
      'Install the app',
      'Full screen, its own icon, and it works offline',
      '<button class="btn sm" data-a="install">Install</button>'
    );
  else if (isIOS())
    install = row(
      'Install the app',
      'In Safari, tap Share, then “Add to Home Screen”.',
      '<span class="ds">Safari</span>'
    );
  else
    install = row(
      'Install the app',
      'Use your browser menu: “Install app” or “Add to Home screen”.',
      '<span class="ds">Browser menu</span>'
    );
  const imp = G.importData
    ? `<div class="job" style="border-color:var(--gold)"><b>Replace your saves with this backup?</b><span style="color:var(--muted);font-size:13px">Backup from ${esc(G.importData.date || 'an unknown date')} · ${Object.keys(G.importData.data).length} save slots. Everything on this device is replaced and the game restarts.</span>
      <div class="row"><button class="btn sm" data-a="importok">Replace and restart</button><button class="btn sm ghost" data-a="importno">Cancel</button></div></div>`
    : G.importErr
      ? `<p class="say"><b>Import failed</b>${esc(G.importErr)}</p>`
      : '';
  // The claude.ai preview can't download or pick files, so backups are only offered on the real site.
  if (/claude\.ai|claudeusercontent/.test(location.hostname)) return install;
  return (
    install +
    row(
      'Save backup',
      'Download every save (campaign, Sprawl, Arena scores, your legend) as a file, or load one from another device',
      '<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ghost" data-a="export">Export</button><button class="btn sm ghost" data-a="import">Import</button></span>'
    ) +
    imp +
    `<p class="ds" style="margin-top:8px">Version ${esc(typeof APP_VERSION !== 'undefined' ? APP_VERSION : 'dev')}${PWA.waiting ? ' · update ready' : ''}</p>`
  );
}

/* ---------- service worker and updates ---------- */
const updBar = document.getElementById('updBar');
function pwaRegister() {
  if (!PWA.canSW) return;
  navigator.serviceWorker
    .register('sw.js')
    .then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) PWA.waiting = reg.waiting;
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w)
          w.addEventListener('statechange', () => {
            // Only prompt when an older version is already in charge; the very first install needs no reload.
            if (w.state === 'installed' && navigator.serviceWorker.controller) PWA.waiting = w;
          });
      });
      const check = () => reg.update().catch(() => {});
      setInterval(check, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) check();
      });
    })
    .catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || !PWA.applying) return;
    reloading = true;
    location.reload();
  });
}
/** Save what can be saved, then let the waiting worker take over (which reloads the page). */
function pwaApplyUpdate() {
  try {
    saveLeg();
    if (G.world && G.wd) saveWorld();
  } catch (err) {}
  PWA.applying = true;
  if (PWA.waiting) PWA.waiting.postMessage({ type: 'SKIP_WAITING' });
  else location.reload();
}
// Show the update bar only between fights, never in the middle of one.
setInterval(() => {
  if (!updBar) return;
  const show = !!PWA.waiting && G.mode !== 'play' && G.mode !== 'den' && G.mode !== 'hack';
  if (updBar.hidden === show) updBar.hidden = !show;
}, 500);
if (updBar)
  updBar.addEventListener('click', e => {
    const a = e.target.closest('[data-u]');
    if (!a) return;
    if (a.dataset.u === 'go') pwaApplyUpdate();
    else {
      PWA.waiting = null;
      updBar.hidden = true;
    }
  });

/* ---------- storage ---------- */
// Ask once, after the player has done something, for storage the browser won't clear under pressure.
addEventListener(
  'pointerdown',
  () => {
    try {
      if (navigator.storage && navigator.storage.persist)
        navigator.storage.persisted().then(p => {
          if (!p) navigator.storage.persist();
        });
    } catch (err) {}
  },
  { once: true }
);

/* ---------- save backups ---------- */
const SAVE_PREFIX = 'cs_';
function pwaExport() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(SAVE_PREFIX)) data[k] = localStorage.getItem(k);
    }
  } catch (err) {}
  const date = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({ app: 'cyber-city-tactics', v: 1, date, data }, null, 1)], {
    type: 'application/json'
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cyber-city-tactics-save-${date}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1000);
}
function pwaImportPick() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    f.text().then(t => pwaImportText(t));
  };
  inp.click();
}
/** Validate a backup file's text; on success the Settings screen asks for confirmation. */
function pwaImportText(t) {
  G.importData = null;
  G.importErr = null;
  try {
    const o = JSON.parse(t);
    if (!o || o.app !== 'cyber-city-tactics' || !o.data || typeof o.data !== 'object')
      throw new Error('not a backup');
    const keys = Object.keys(o.data).filter(k => k.startsWith(SAVE_PREFIX) && typeof o.data[k] === 'string');
    if (!keys.length) throw new Error('empty');
    for (const k of keys) JSON.parse(o.data[k]); // every slot must be valid JSON
    G.importData = { date: o.date, data: Object.fromEntries(keys.map(k => [k, o.data[k]])) };
  } catch (err) {
    G.importErr = "That file isn't a Cyber City Tactics save backup.";
  }
  if (G.mode === 'settings') renderOv();
}
function pwaImportApply() {
  const d = G.importData;
  if (!d) return;
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(SAVE_PREFIX)) localStorage.removeItem(k);
    }
    for (const k in d.data) localStorage.setItem(k, d.data[k]);
  } catch (err) {}
  location.reload();
}

/* ---------- app shortcuts ---------- */
function pwaShortcut() {
  const qs = new URLSearchParams(location.search),
    sd = parseSeed(qs.get('seed'));
  if (sd) {
    // a shared challenge link: open the right start screen with the seed filled in
    G.seedPre = sd.code;
    setMode(sd.mode === 'arena' ? 'arenapick' : 'worldpick');
    try {
      history.replaceState(null, '', location.pathname);
    } catch (err) {}
    return;
  }
  const go = qs.get('go');
  const to = { daily: 'arenapick', arena: 'arenapick', sprawl: 'worldpick', codex: 'codex' }[go];
  if (!to) return;
  if (to === 'codex') G.cxTab = 'feats';
  setMode(to);
  try {
    history.replaceState(null, '', location.pathname);
  } catch (err) {}
}

/* ===== src/js/main.js ===== */
/* Cyber City Tactics · src/js/main.js
 * The fixed-timestep game loop and boot.
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */
/* ================= loop =================
 * Fixed timestep with interpolated rendering:
 *  - the game logic always steps at exactly 60 Hz (STEP), however fast or slow the screen refreshes, so
 *    speed, physics and timings are identical on a 30 Hz phone and a 144 Hz monitor;
 *  - frames between two logic steps draw positions blended between the last two steps (lerpRender), so
 *    motion stays smooth on 90/120/144 Hz screens instead of repeating frames;
 *  - after a stall (a background tab, a GC pause, a slow phone) at most MAX_STEPS steps catch up, and the
 *    rest of the backlog is dropped, so the game never fast-forwards or spirals;
 *  - an error in one frame is reported once and the loop keeps running.
 */
const STEP = 1000 / 60,
  MAX_STEPS = 8; // up to 133 ms of catch-up per frame: full speed down to about 8 fps
let last = performance.now(),
  acc = 0,
  tick = 0,
  loopErr = false;
function stepOnce() {
  tick++;
  snapPrev();
  let ran = true;
  // online co-op, friend's side: the host runs the game; this browser glides, draws and sends buttons
  if (netGuest()) {
    netGuestStep();
    for (const s of INP) for (const k in s.pressed) s.pressed[k] = false;
    return;
  }
  if (netHost()) netHostInput();
  NET.inUpd = true;
  if (G.mode === 'play' || G.mode === 'den') {
    if (G.stop > 0) {
      G.stop--;
      ran = false;
    } else if (G.slow > 0) {
      G.slow--;
      if (tick % 3 === 0) update();
      else ran = false;
    } else {
      update();
      if (tick % 4 === 0 && modOn('turbo') && G.mode === 'play') update();
    }
  } else if (G.mode === 'title') attractStep();
  else if (G.mode === 'hack') hackStep();
  NET.inUpd = false;
  if (NET.live) netHostTick();
  // keep presses made during hit-stop or slow-mo frames until a frame actually processes them
  if (ran) for (const s of INP) for (const k in s.pressed) s.pressed[k] = false;
}
function frame(now) {
  requestAnimationFrame(frame); // first, so one bad frame can never stop the game
  try {
    const dt = Math.max(0, now - last);
    last = now;
    perfSample(dt);
    acc += Math.min(dt, 250);
    pollPads();
    let n = 0;
    while (acc >= STEP && n < MAX_STEPS) {
      stepOnce();
      acc -= STEP;
      n++;
    }
    if (acc >= STEP) acc = acc % STEP; // drop the backlog instead of fast-forwarding
    lerpRender(acc / STEP);
    if (tick % 6 === 0) updateTouchUI();
  } catch (err) {
    if (!loopErr) {
      loopErr = true;
      console.error('Cyber City Tactics frame error', err);
    }
  }
}
// Coming back to the tab: start timing fresh so there's no catch-up burst.
document.addEventListener('visibilitychange', () => {
  last = performance.now();
  acc = 0;
});
applyPrefs();
fit();
attract();
setMode('title');
musicPlay('title');
netFromHash();
last = performance.now();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
setTimeout(fit, 300);
pwaRegister();
pwaShortcut();

})();
</script>
