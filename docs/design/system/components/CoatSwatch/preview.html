<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CoatSwatch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>html, body { margin: 0; background: var(--ink); }</style>
</head>
<body>
<div class="cct-preview">
<div class="row" style="gap:6px">
  <button class="swatch on" style="--c1:#1f4a52;--c2:#ff3d8b" aria-label="Signature coat"></button>
  <button class="swatch" style="--c1:#56626e;--c2:#9fe9ff" aria-label="Chrome coat"></button>
  <button class="swatch" style="--c1:#3a1240;--c2:#ff3d8b" aria-label="Neon Fang coat"></button>
  <button class="swatch" style="--c1:#5a1e12;--c2:#ff6a3d" aria-label="Ember coat"></button>
  <button class="swatch" disabled style="--c1:#5a4a1a;--c2:#ffc63d" aria-label="Prime Gold coat, locked">🔒</button>
</div>
</div>
</body>
</html>
