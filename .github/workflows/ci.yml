name: CI

# Every push and pull request: the build must be up to date, the headless tests (including the bot
# playthroughs) must pass, and the game must load and play in a real browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev tools
        run: npm install --no-audit --no-fund

      - name: Build is up to date
        run: npm run check

      - name: Formatting
        run: npx prettier --check "src/**/*.{js,css}" "tests/**/*.js" "tools/**/*.mjs" sw.js

      - name: Headless tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser
