<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chrome &amp; Sorcery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet — canvas fills the stage, touch pad below (portrait) or over the stage (landscape). Single dark look by design. */
:root{
  --ink:#0c0a14; --panel:#17121f; --panel2:#1f1830; --line:#30283f; --text:#efe9ff; --muted:#a79dc2;
  --neon:#ff3d8b; --mana:#45d2ff; --gold:#ffc63d; --ok:#7dffb0; --karma:#b98cff;
  --font-d:'Teko',Impact,'Arial Narrow',sans-serif;
  --font-b:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  --b:58px; --b2:48px; --s:132px;
  color-scheme:dark;
}
body.size-s{--b:50px;--b2:42px;--s:116px}
body.size-l{--b:68px;--b2:56px;--s:152px}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;background:var(--ink);color:var(--text);font-family:var(--font-b);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;position:relative}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#game{display:block;background:#000;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
#pauseBtn{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:8px;opacity:.85;border:1px solid var(--line);background:rgba(23,18,31,.7);color:var(--text);font:600 15px var(--font-b);cursor:pointer;z-index:4}
button:focus-visible{outline:2px solid var(--mana);outline-offset:2px}

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(12,10,20,.9);z-index:20;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}
#rotHint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:4;font:600 12px var(--font-b);letter-spacing:.04em;color:var(--text);background:rgba(23,18,31,.92);border:1px solid var(--neon);border-radius:20px;padding:8px 14px;white-space:nowrap;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:600 12px var(--font-b);letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;background:transparent;color:var(--muted);border:0;border-left:1px solid var(--line);cursor:pointer;min-height:38px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--neon);color:#16040c}
.setrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow>div{min-width:0}.setrow .ds{font-size:12.5px;color:var(--muted)}
@media (pointer:coarse){.btn{min-height:44px}.btn.sm{min-height:38px;padding:8px 12px}.tab{min-height:40px}}
.card{width:100%;max-width:640px;max-height:100%;overflow:auto;box-sizing:border-box;padding:16px 18px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;touch-action:pan-y;animation:cardIn .2s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card h1{font:600 clamp(48px,11vw,84px)/.82 var(--font-d);margin:0;letter-spacing:.01em;text-shadow:-3px 0 var(--neon),3px 0 var(--mana);text-wrap:balance}
.card h2{font:600 clamp(32px,7vw,48px)/.9 var(--font-d);margin:0;letter-spacing:.02em;text-wrap:balance}
.card h3{font:600 22px/1 var(--font-d);margin:4px 0 0;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
.card p{margin:0;line-height:1.5;color:var(--muted);max-width:62ch}
.say{border-left:2px solid var(--neon);padding:4px 0 4px 12px;color:var(--text)!important;font-size:15px}
.say b{color:var(--neon);font-weight:600;letter-spacing:.06em;font-size:12px;display:block;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 13px var(--font-b);letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:6px;border:1px solid var(--neon);background:var(--neon);color:#16040c;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.tab{font:600 12px var(--font-b);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--line);background:var(--panel2)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--muted)}
.keys b{color:var(--text);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.cols>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.item>div{min-width:0}
.item .nm{font-weight:600}
.item .ds{font-size:12.5px;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.r0{color:#e6e1f2}.r1{color:var(--mana)}.r2{color:var(--gold)}
.up{color:var(--ok)}.down{color:var(--neon)}
.wallet{font:600 26px var(--font-d);color:var(--gold);font-variant-numeric:tabular-nums}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.attr{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.attr .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.attr .v{font:600 30px/1 var(--font-d);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:space-between;gap:6px}
.attr .h{font-size:11.5px;color:var(--muted)}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.derived b{color:var(--text)}
.meter{height:6px;background:#2a2238;border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:var(--karma)}
.job{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.job .st{font-size:11px;letter-spacing:.14em;text-transform:uppercase}

#pad{display:none;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:6px 2px}
body.touch #pad{display:flex}
body.touch.lefty #pad{flex-direction:row-reverse}
#stick{width:calc(var(--s) * 1.25);height:calc(var(--s) * 1.12);flex:none;position:relative;touch-action:none}
#ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--line);background:rgba(23,18,31,.55);pointer-events:none}
#knob{position:absolute;left:29%;top:29%;width:42%;height:42%;border-radius:50%;background:var(--panel);border:2px solid var(--muted);pointer-events:none}
#btns{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
body.lefty #btns{align-items:flex-start}
.urow,.mrow,.brow{display:flex;gap:8px}
.tb{width:var(--b2);height:var(--b2);border-radius:50%;border:2px solid var(--neon);background:rgba(255,61,139,.14);color:var(--text);font:600 10.5px/1.05 var(--font-b);letter-spacing:.03em;touch-action:none;padding:0;flex:none}
.tb.big{width:var(--b);height:var(--b);font-size:11.5px}
.tb small{display:block;font-size:9.5px;opacity:.85;font-variant-numeric:tabular-nums}
.tb.on{background:rgba(255,61,139,.45)}
.tb.dim{opacity:.4}
.tb.gun{border-color:var(--gold);background:rgba(255,198,61,.12)}
.tb.spell{border-color:var(--mana);background:rgba(69,210,255,.12)}
.tb.move{border-color:var(--ok);background:rgba(125,255,176,.1)}
.urow .tb{width:auto;min-width:var(--b2);height:34px;border-radius:17px;padding:0 10px;border-color:var(--muted);background:rgba(167,157,194,.1)}
@media (orientation:landscape){
  body.touch #app{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);column-gap:10px}
  body.touch #pad{display:contents}
  body.touch #stick{grid-column:1;grid-row:1;align-self:end}
  body.touch #stage{grid-column:2;grid-row:1;min-width:0}
  body.touch #btns{grid-column:3;grid-row:1;align-self:end;padding-bottom:4px}
  body.touch.lefty #stick{grid-column:3}
  body.touch.lefty #btns{grid-column:1}
}
@media (orientation:landscape) and (max-height:460px){
  body.touch{--b:50px;--b2:42px;--s:110px}
  body.touch.size-s{--b:44px;--b2:38px;--s:96px}
  body.touch.size-l{--b:56px;--b2:46px;--s:124px}
  .urow .tb{height:30px}
}
@media (orientation:portrait){
  /* stick zone + 12px gap + three buttons must fit the phone width minus the 32px gutter */
  body.touch{--b:60px;--b2:50px;--s:min(128px,calc((100vw - 32px - 12px - 16px) * .38))}
  body.touch.size-s{--b:52px;--b2:44px;--s:min(112px,calc((100vw - 60px) * .36))}
  body.touch.size-l{--b:min(68px,calc((100vw - 60px) * .2));--b2:min(56px,calc((100vw - 60px) * .17));--s:min(140px,calc((100vw - 60px) * .36))}
  body.touch #stick{width:var(--s);height:calc(var(--s) * 1.15)}
  body.touch #stage{flex-direction:column;justify-content:flex-start;align-items:center;gap:10px;padding-top:4px}
  body.touch #rotHint{position:static;transform:none}
  body.touch #pad{padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
}
@media (orientation:portrait) and (max-width:360px){body.touch:not(.size-l){--b:52px;--b2:44px}}
</style>
<style>
/* Static-hosting reset (the artifact viewer normally provides this) */
body{margin:0}
#app{padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Chrome and Sorcery game screen"></canvas>
    <button id="pauseBtn" aria-label="Pause">II</button>
    <button id="rotHint" hidden>Turn your phone sideways for a bigger screen · ✕</button>
    <div id="ov"></div>
  </div>
  <div id="pad" aria-hidden="true">
    <div id="stick"><div id="ring"><div id="knob"></div></div></div>
    <div id="btns">
      <div class="urow"><button class="tb" data-act="item">MED</button><button class="tb" data-act="swap">SWAP</button><button class="tb" data-act="sheet">CHAR</button></div>
      <div class="mrow"><button class="tb gun" data-act="gun">GUN</button><button class="tb spell" data-act="spell">SPELL</button><button class="tb move" data-act="dodge">DODGE</button></div>
      <div class="brow"><button class="tb big" data-act="punch">PUNCH</button><button class="tb big" data-act="kick">KICK</button><button class="tb big move" data-act="jump">JUMP</button></div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=270,FY0=170,FY1=262;
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const ov=document.getElementById('ov');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch=()=>!!(document.body.classList.contains&&document.body.classList.contains('touch'));
let SCALE=1,VH=H,BAND=0;
// In portrait on touch devices the canvas grows taller than 16:9: the extra rows above the street become
// a sky band that holds a larger, easier-to-read HUD instead of empty page.
function fit(){
  const r=document.getElementById('stage').getBoundingClientRect();
  const portrait=isTouch()&&r.height>r.width*.8;
  const hint=document.getElementById('rotHint');const hintH=portrait&&hint&&!hint.hidden?56:portrait?10:0;
  VH=portrait?clamp(Math.round(W*(r.height-hintH)/r.width),H,400):H;BAND=VH-H;
  let w=r.width,h=w*VH/W; if(h>r.height){h=r.height;w=h*W/VH;}
  w=Math.max(120,Math.floor(w));h=Math.max(68,Math.floor(h));
  cvs.style.width=w+'px';cvs.style.height=h+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);SCALE=cvs.width/W;
}
addEventListener('resize',fit);

/* ================= utils ================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function srng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const prefs=Object.assign({sound:true,music:true,shake:true,haptics:true,tips:true,seen:{},size:'m',lefty:false,rotDismissed:false},store.get('cs_prefs')||{});
function applyPrefs(){const c=document.body.classList;if(!c.toggle)return;c.toggle('size-s',prefs.size==='s');c.toggle('size-l',prefs.size==='l');c.toggle('lefty',!!prefs.lefty);setTimeout(fit,30);}
function buzz(p){if(!prefs.haptics||!navigator.vibrate)return;try{navigator.vibrate(p);}catch(e){}}
let wakeLock=null;
async function wake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release();}}catch(e){}}
const canFull=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function goFull(){const el=document.documentElement,r=el&&(el.requestFullscreen||el.webkitRequestFullscreen);if(!r)return;
  try{Promise.resolve(r.call(el)).then(()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}setTimeout(fit,200);}).catch(()=>{});}catch(e){}}
function savePrefs(){store.set('cs_prefs',prefs);}

/* ================= audio ================= */
const A={ac:null,master:null,mus:null,
  unlock(){if(!this.ac){try{this.ac=new(window.AudioContext||window.webkitAudioContext)();this.master=this.ac.createGain();this.master.gain.value=1;this.master.connect(this.ac.destination);this.mus=this.ac.createGain();this.mus.gain.value=prefs.music?.55:0;this.mus.connect(this.ac.destination);}catch(e){}}if(this.ac&&this.ac.state==='suspended')this.ac.resume();},
  osc(dest,f,t,d,type,v,slide){const a=this.ac;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(dest);o.start(t);o.stop(t+d+.02);},
  nz(dest,t,d,v,cut,hp){const a=this.ac;const n=Math.max(1,Math.floor(a.sampleRate*d)),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type=hp?'highpass':'lowpass';f.frequency.value=cut||2400;g.gain.value=v;s.connect(f).connect(g).connect(dest);s.start(t);},
  tone(f,d,type,v,slide){if(!this.ac||!prefs.sound)return;this.osc(this.master,f,this.ac.currentTime,d,type,v||.06,slide);},
  noise(d,v,cut){if(!this.ac||!prefs.sound)return;this.nz(this.master,this.ac.currentTime,d,v||.12,cut);}
};
const sfx={
  hit(){A.noise(.07,.18,1800);A.tone(160,.08,'square',.05,-80)},
  heavy(){A.noise(.14,.25,900);A.tone(110,.15,'square',.07,-60)},
  whiff(){A.noise(.05,.05,4000)},
  shot(){A.noise(.13,.22,3200);A.tone(520,.07,'square',.04,-420)},
  click(){A.tone(1400,.03,'square',.03)},
  clank(){A.tone(1800,.06,'square',.04,-900);A.noise(.05,.08,5000)},
  spell(){A.tone(260,.35,'sawtooth',.05,700);A.tone(390,.35,'triangle',.04,900)},
  heal(){A.tone(523,.2,'triangle',.05);setTimeout(()=>A.tone(784,.3,'triangle',.05),120)},
  boom(){A.noise(.35,.3,700);A.tone(90,.3,'sawtooth',.06,-50)},
  coin(){A.tone(988,.06,'square',.04);setTimeout(()=>A.tone(1480,.1,'square',.04),55)},
  jump(){A.tone(300,.12,'triangle',.05,250)},
  roll(){A.noise(.12,.08,1200)},
  hurt(){A.tone(220,.18,'sawtooth',.06,-140)},
  zap(){A.tone(880,.12,'sawtooth',.035,-600)},
  grab(){A.tone(200,.06,'square',.05,80)},
  buy(){A.tone(660,.07,'square',.04);setTimeout(()=>A.tone(990,.12,'square',.04),70)},
  loot(){A.tone(740,.08,'triangle',.05);setTimeout(()=>A.tone(1110,.08,'triangle',.05),80);setTimeout(()=>A.tone(1480,.14,'triangle',.05),160)},
  level(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>A.tone(f,.18,'square',.05),i*90))},
  talk(){A.tone(700,.04,'triangle',.03);setTimeout(()=>A.tone(560,.05,'triangle',.03),50)}
};

/* ================= music ================= */
// Each song: bpm, root (MIDI), chord offsets per bar, 16-step patterns. Bass: r root, f fifth, o octave. Arp/lead: digits index the scale.
const MINOR=[0,2,3,5,7,8,10,12,14,15];
const SONGS={
  title:{bpm:96,root:45,prog:[0,-4,-2,-5],bass:'r...r...f...r.o.',arp:'0.2.4.2.0.2.4.7.',lead:'................................7...6...4.......5...4...2.......',kick:'x.......x.......',snare:'....s.......s...',hat:'..h...h...h...h.'},
  den:{bpm:84,root:50,prog:[0,5,3,-2],bass:'r.....r...f.....',arp:'2...4...7...4...',lead:'4.......2...0...........................2...4...5...4...2.......',kick:'x.........x.....',snare:'........s.......',hat:'h...h...h...h.h.'},
  d0:{bpm:132,root:40,prog:[0,0,-2,3],bass:'r.ro.rr.f.fo.r.r',arp:'0.4.7.4.0.4.7.9.',lead:'7.7.6.4.....4.6.7.....9.7.6.4...4.4.2.0.....2.4.0.....................',kick:'x...x...x...x..x',snare:'....s.......s.s.',hat:'hhhhhhhhhhhhhhhh'},
  d1:{bpm:138,root:43,prog:[0,3,5,-2],bass:'r.r.o.r.r.r.f.o.',arp:'0247024702470247',lead:'9...7...6...4...6...7...9...........7.6.4.2.4.......',kick:'x..x..x...x..x..',snare:'....s.......s...',hat:'h.hhh.hhh.hhh.hh'},

  d3:{bpm:144,root:45,prog:[0,-2,-4,-5],bass:'rrorrorrfforrfor',arp:'0.4.7.9.7.4.0.4.',lead:'7.9.7.6.4.......4.6.7.9.7.......9.9.9.7.6.4.2.4.......',kick:'x...x...x...x...',snare:'....s..s....s...',hat:'hhhhhhhhhhhhhhhh'},

function midi(n){return 440*Math.pow(2,(n-69)/12);}
function musicPlay(name){if(M.cur===name)return;M.cur=name;M.step=0;if(A.ac)M.next=A.ac.currentTime+.08;}
function musicTick(){
  const a=A.ac;if(!a||!M.cur||!prefs.music)return;
  const S=SONGS[M.cur];const spb=60/S.bpm/4;
  if(M.next<a.currentTime-.2)M.next=a.currentTime+.05;
  while(M.next<a.currentTime+.15){
    const st=M.step%16,bar=Math.floor(M.step/16)%S.prog.length,t=M.next,root=S.root+S.prog[bar],out=A.mus;
    const b=S.bass[st];if(b&&b!=='.')A.osc(out,midi(root-12+({r:0,f:7,o:12}[b]||0)),t,spb*1.7,'triangle',.11);
    const ar=S.arp[st];if(ar&&ar!=='.')A.osc(out,midi(root+12+MINOR[+ar]),t,spb*.8,'square',.022);
    const L=S.lead[M.step%S.lead.length];if(L&&L!=='.')A.osc(out,midi(root+24+MINOR[+L]),t,spb*2.2,'square',.03);
    if(S.kick[st]==='x')A.osc(out,140,t,.14,'sine',.35,-100);
    if(S.snare[st]==='s')A.nz(out,t,.12,.12,1800);
    if(S.hat[st]==='h')A.nz(out,t,.03,.04,7000,true);
    M.next+=spb;M.step++;
  }
}

function stickSet(dx,dy){const R=(ring.offsetWidth||120)*.32,m=Math.hypot(dx,dy);if(m>R){dx=dx/m*R;dy=dy/m*R;}knob.style.transform=`translate(${dx}px,${dy}px)`;const dz=R*.3,h=INP[0].held;

  ring.style.left=(cx-zr.left)+'px';ring.style.top=(cy-zr.top)+'px';sc={x:cx,y:cy};stickSet(e.clientX-sc.x,e.clientY-sc.y);});

// Gamepads (standard mapping). Solo: pad 1 is runner 1. Co-op: two pads map 1:1; one pad goes to runner 2 so runner 1 can stay on keyboard.
const padPrev={};
function pollPads(){
  if(!navigator.getGamepads)return;let list;try{list=[...navigator.getGamepads()].filter(Boolean);}catch(e){return;}
  list.forEach((gp,n)=>{
    if(n>1)return;
    let who=G.coop?(list.length>=2?n:1):(n===0?0:-1);
    const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),ax=gp.axes[0]||0,ay=gp.axes[1]||0;
    const st={left:b(14)||ax<-.45,right:b(15)||ax>.45,up:b(12)||ay<-.45,down:b(13)||ay>.45,jump:b(0),kick:b(1),punch:b(2),spell:b(3),dodge:b(4),gun:b(5),item:b(6),swap:b(7),sheet:b(8),start:b(9)};
    const prev=padPrev[gp.index]||{};
    for(const k in st){
      const on=st[k],was=!!prev[k];
      if(k==='start'){if(on&&!was){A.unlock();if(ACTIVE()&&!G.coop&&n===1)joinRunner2();else if(ACTIVE())togglePause();else{const f=ov.querySelector('.btn:not([disabled])');if(f)f.click();}}continue;}
      if(k==='sheet'){if(on&&!was&&who>=0)globalAct('sheet',who);continue;}
      if(who<0||!ACTIVE())continue;
      if(on&&!was)kp(who,k,true);else if(!on&&was)kp(who,k,false);
    }
    padPrev[gp.index]=st;
  });
}

function hurt(t,dmg,dir,o){
  o=o||{};
  if(t.state==='dead'||t.inv>0)return false;
  if(t.state==='down'&&!o.air)return false;
  if(t.team===0&&t.state==='roll'&&t.t<15)return false;
  // riot shield blocks frontal hits unless kicked, knocked down or exploded
  if(t.d&&t.d.shield&&!o.breaker&&!o.kd&&t.state!=='hurt'&&t.state!=='grabbed'&&o.ax!==undefined&&(o.ax-t.x)*t.face>0){
    dmg=Math.max(1,Math.round(dmg*.15));t.hp-=dmg;sfx.clank();fxSpark(t.x+t.face*10,t.y,t.z+28,'#9fb4d8',false);
    G.texts.push({x:t.x,y:t.y,z:t.z+50,s:'BLOCK',c:'#9fb4d8',life:26,sm:true});if(t.hp<=0)kill(t,dir);return true;}
  if(t.elite==='warded'){o.kd=false;if(o.magic)dmg*=.4;}
  if(t.elite==='armored'&&o.bullet)dmg*=.45;
  let crit=false;
  if(t.team===0)dmg=dmg*20/(20+t.D.armor);
  else if(o.src&&Math.random()<o.src.D.crit){dmg*=1.8;crit=true;}
  dmg=Math.max(1,Math.round(dmg));
  t.hp-=dmg;t.flash=8;if(t.state!=='grabbed')t.x+=dir*(o.kb||3);t.face=-dir;
  if(G.t-t.lastHit>50)t.hits=0;t.lastHit=G.t;t.hits++;
  const big=o.big||crit;
  burst(t.x,t.y,t.z+(t.d&&t.d.fly?0:28),o.col||'#fff3c4',big?12:6);
  fxSpark(t.x-dir*4,t.y,t.z+(t.d&&t.d.fly?0:30),o.col||'#fff3c4',big);
  G.texts.push({x:t.x+rand(-4,4),y:t.y,z:t.z+50,s:(crit?'CRIT ':'')+dmg,c:t.team===0?'#ff3d8b':crit?'#ffc63d':(o.col||'#efe9ff'),life:34,big:crit});
  G.stop=big?5:3;G.shake=Math.max(G.shake,o.big?6:crit?4:2);if(crit)G.flash=Math.max(G.flash,.12);
  if(t.team===0&&t.idx===0)buzz(big?60:30);else if(o.src&&o.src.idx===0&&big)buzz(12);
  (big?sfx.heavy:sfx.hit)();
  if(o.src){G.combo++;G.comboT=0;if(G.combo>G.bestCombo)G.bestCombo=G.combo;}
  if(t.team===0&&o.att&&o.att.elite==='vampiric'&&o.att.state!=='dead'){const v=o.att;v.hp=Math.min(v.maxHp,v.hp+Math.round(dmg*.6));G.texts.push({x:v.x,y:v.y,z:v.z+56,s:'+'+Math.round(dmg*.6),c:'#b98cff',life:28,sm:true});}
  if(t.d&&t.d.boss&&!t.enraged&&t.hp>0&&t.hp<t.maxHp*.5)enrage(t);
  if(t.team===0){if(t.holding)dropProp(t);if(t.grab)releaseGrab(t);}
  if(t.hp<=0){kill(t,dir,o);return true;}
  if(t.state==='grabbed'&&!o.kd)return true;
  if(t.state==='grabbed'){const g=PL.find(p=>p.grab===t);if(g)releaseGrab(g,true);}
  const boss=t.d&&t.d.boss;
  if(boss){if(o.kd&&Math.random()<.35){setS(t,'down');t.vz=2.2;t.vx=dir*1.6;t.hits=0;}return true;}
  if(t.d&&t.d.fly){t.x+=dir*6;return true;}
  if(o.kd||t.hits>=3){setS(t,'down');t.vz=2.8;t.vx=dir*2.2;t.hits=0;if(t.team===0)sfx.hurt();}
  else{setS(t,'hurt');if(t.team===0)sfx.hurt();
    else if(o.src&&G.combo>=4)tip('grab','Walk into a staggered enemy to grab it. PUNCH to knee, KICK to throw.','Walk into a staggered enemy to grab it. J to knee, K to throw them into the crowd.');}
  if(t.team===0)tip('dodge','Tap DODGE to roll through attacks untouched.','Press O or Left Shift to roll through attacks untouched.');
  return true;
}

function drop(k,x,y,extra){G.picks.push(Object.assign({k,x:clamp(x,G.camX+18,G.camX+W-18),y:clamp(y,FY0+4,FY1),t:0},extra||{}));}
function kill(t,dir){
  if(t.state==='grabbed'){const g=PL.find(p=>p.grab===t);if(g){g.grab=null;setS(g,'idle');}}
  setS(t,'dead');t.vz=3.2;t.vx=dir*2.6;t.hp=0;
  if(t.team===0){t.dead=true;return;}

  const em=t.elite?2:1;
  gainKarma(Math.round(d.karma*em*DIFF[G.diff].karma*(1+G.stage*.3+G.ng*.3)*(1+Math.min(G.combo,30)*.02)));
  if(G.arena){const pts=Math.round((d.karma||40)*em*10*(1+Math.min(G.combo,30)*.05)*(.8+G.diff*.2));G.score+=pts;G.texts.push({x:t.x,y:t.y,z:t.z+70,s:'+'+pts,c:'#ffc63d',life:36,sm:true});}
  contractTick(t.kind);
  const c=Math.round(ri(d.creds[0],d.creds[1])*em*(1+G.ng*.25)*(1+Math.min(G.combo,30)*.02));if(c>0)drop('cred',t.x,t.y,{v:c});
  if(t.elite){const it=randItem(G.stage+G.ng,true);if(it.rar<1){const b=it.base;Object.assign(it,mkItem(it.slot,b,1));}drop('gear',t.x-12,t.y+2,{item:it});}
  const C=PARTY.contract;
  if(t.kind==='sec'&&C&&C.key==='chip'&&!C.done)drop('chip',t.x-8,t.y-4);
  if(d.boss)drop('gear',t.x+14,t.y+2,{item:randItem(G.stage+G.ng,true)});
  else if(Math.random()<.08)drop('gear',t.x+12,t.y+2,{item:randItem(G.stage,false)});
  const r=Math.random();
  if(r<.11)drop('med',t.x+10,t.y+4);else if(r<.24)drop('ammo',t.x-10,t.y+4);else if(r<.34)drop('mana',t.x+6,t.y-4);
  if(d.spirit){burst(t.x,t.y,t.z,'#ffc63d',20);t.gone=true;}
  if(d.boss){G.shake=10;burst(t.x,t.y,30,'#ffc63d',30);G.fx.push({k:'ring',x:t.x,y:t.y,z:30,c:'#ffc63d',life:30,max:30,r:70});}
}
function inZ(att,t){const tz=t.d&&t.d.fly?t.z-12:t.z;return tz<=att.z+14&&tz>=att.z-30;}
function strike(att,reach,dmg,o){
  let hit=false;o=Object.assign({},o||{});if(att.team===0)o.src=att;o.ax=att.x;o.att=att;
  for(const t of G.ents){
    if(t.team===att.team||t.state==='dead'||t.out)continue;
    if(t.state==='down'&&!o.air)continue;
    const sc=(t.d&&t.d.scale)||1;const dx=(t.x-att.x)*att.face;
    if(dx<-6||dx>reach+6*sc)continue;
    if(Math.abs(t.y-att.y)>9*sc)continue;
    if(!inZ(att,t))continue;
    if(hurt(t,dmg,att.face,Object.assign({},o)))hit=true;
  }
  return hit;
}
function hitbox(t){const sc=(t.d&&t.d.scale)||1;if(t.d&&t.d.fly)return[t.z-10,t.z+12];return[t.z+2,t.z+46*sc];}
function burst(x,y,z,col,n){if(RM)n=Math.ceil(n/2);for(let i=0;i<n;i++)G.parts.push({x,y,z,vx:rand(-2,2),vy:rand(-.4,.4),vz:rand(.5,3),life:ri(14,26),c:col,sz:rand(1,2.4)});}

/* ================= props, grabs ================= */
function dropProp(p){const pr=p.holding;if(!pr)return;p.holding=null;pr.x=p.x+p.face*8;pr.y=p.y;pr.z=0;G.props.push(pr);}
function throwProp(p){const pr=p.holding;p.holding=null;const m=p.D.melee;
  G.projs.push({k:'prop',kind:pr.kind,team:0,src:p,x:p.x+p.face*10,y:p.y,z:p.z+40,vx:p.face*5.6,vz:.8,dmg:pr.kind==='drum'?24+m:16+m*1.1,life:120});sfx.whiff();}
function shatter(pr){
  const col={can:'#8a93a6',crate:'#a07a4a',drum:'#ff4a4a'}[pr.kind];burst(pr.x,pr.y,pr.z,col,12);
  if(pr.kind==='drum'){sfx.boom();G.shake=8;G.fx.push({k:'ring',x:pr.x,y:pr.y,z:pr.z,c:'#ff6a3d',life:20,max:20,r:44});burst(pr.x,pr.y,pr.z,'#ffc63d',16);
    for(const t of G.ents){if(t.team!==1||t.state==='dead')continue;if(Math.abs(t.x-pr.x)<44&&Math.abs(t.y-pr.y)<18)hurt(t,pr.dmg,t.x>=pr.x?1:-1,{kd:true,big:true,air:true,col:'#ff6a3d',src:pr.src,ax:pr.x});}}
  else sfx.heavy();
}
function releaseGrab(p,quiet){const e=p.grab;p.grab=null;p.knees=0;if(e&&e.state==='grabbed'){setS(e,'idle');e.inv=20;e.x+=e.face*-8;}if(p.state==='grab')setS(p,'idle');}
function tryGrab(p,dx){
  if(dx===0)return false;
  for(const e of G.ents){
    if(e.team!==1||e.d.boss||e.d.fly||e.state==='dead'||e.state==='down'||e.state==='grabbed')continue;
    if(e.state!=='hurt')continue;
    const rx=(e.x-p.x)*dx;if(rx<2||rx>16||Math.abs(e.y-p.y)>6)continue;
    p.grab=e;p.knees=0;p.face=dx;setS(p,'grab');setS(e,'grabbed');sfx.grab();return true;
  }
  return false;
}

/* ================= runners ================= */
function physics(e){
  if(e.d&&e.d.fly&&e.state!=='dead')return;
  if(e.z>0||e.vz!==0){e.vz-=.28;e.z+=e.vz;e.x+=e.vx;
    if(e.z<=0){e.z=0;e.vz=0;e.vx=0;
      if(e.thrown){const src=e.thrown;e.thrown=null;if(e.state!=='dead'){const dmg=8+src.D.melee*.7;e.state='down';e.hp-=Math.round(dmg);G.texts.push({x:e.x,y:e.y,z:40,s:''+Math.round(dmg),c:'#efe9ff',life:30});burst(e.x,e.y,4,'#a79dc2',10);sfx.heavy();G.shake=5;if(e.hp<=0){e.state='down';kill(e,Math.sign(e.vx)||1);}}}}}
}
function useItem(p){
  if(PARTY.med>0&&p.hp<p.maxHp){PARTY.med--;const n=Math.round(p.maxHp*.45);p.hp=Math.min(p.maxHp,p.hp+n);sfx.heal();burst(p.x,p.y,30,'#7dffb0',12);say(p,'+'+n+' HP','#7dffb0',60,40);}
  else{sfx.click();say(p,PARTY.med?'HP FULL':'NO MEDKITS','#a79dc2',60,40,true);}
}
function nearNPC(p){if(!G.den)return null;for(const n of NPCS)if(Math.abs(n.x-p.x)<24&&Math.abs(208-p.y)<26)return n;return null;}
function upRunner(p){
  const I=INP[p.idx]||INP[0],D=p.D;
  p.t++;if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;
  const wasAir=p.z>0;
  physics(p);
  if(p.mp<p.maxMp&&G.t%D.regen===0)p.mp++;
  if(p.state==='dead'){if(p.t>100)respawn(p);return;}
  if(p.state==='down'){if(p.t>50){setS(p,'idle');p.inv=60;}return;}
  if(p.state==='hurt'){if(p.t>15)setS(p,'idle');return;}
  if((p.state==='jump'||p.state==='jkick')&&wasAir&&p.z===0)setS(p,'idle');
  if(I.pressed.item)useItem(p);
  if(I.pressed.swap&&p.spells.length>1){p.spell=(p.spell+1)%p.spells.length;sfx.click();say(p,SPELLS[p.spells[p.spell]].name.toUpperCase(),'#45d2ff',60,40,true);}
  // grab
  if(p.state==='grab'){
    const e=p.grab;if(!e||e.state!=='grabbed'){releaseGrab(p);return;}
    e.x=p.x+p.face*12;e.y=p.y;e.face=-p.face;
    if(p.t>100){releaseGrab(p);return;}
    if(I.pressed.punch){p.knees++;p.kneeT=8;if(p.knees>=3){hurt(e,6+D.melee*.6,p.face,{kd:true,kb:8,src:p,ax:p.x});p.grab=null;setS(p,'idle');}else hurt(e,4+D.melee*.45,p.face,{src:p,ax:p.x});}
    else if(I.pressed.kick){let dir=(I.held.right?1:0)-(I.held.left?1:0)||p.face;p.grab=null;setS(p,'throw');
      setS(e,'down');e.vz=3.4;e.vx=dir*4.6;e.x=p.x+dir*8;e.z=8;e.thrown=p;e.thrownHit=[];sfx.heavy();}
    if(p.kneeT>0)p.kneeT--;
    return;
  }
  const busy={punch:13,upper:20,kick:20,shoot:13,cast:24,lift:10,throw:16,roll:22};
  if(busy[p.state]){
    const t=p.t,m=D.melee,R=D.reach;
    if(p.state==='punch'&&t===4&&!G.den){if(!strike(p,22+R,4+m*.65))sfx.whiff();}
    if(p.state==='upper'&&t===6&&!G.den){if(!strike(p,24+R,8+m*.9,{kd:true,kb:6}))sfx.whiff();}
    if(p.state==='kick'&&t===7&&!G.den){if(!strike(p,30+R*.6,6+m*.8,{kb:7,breaker:true}))sfx.whiff();}
    if(p.state==='shoot'){const g=p.eq.gun;if(g){if(g.fire==='burst'){if(t===2||t===6||t===10)fireBullet(p,D.gun,p.z+27);}else if(t===3)fireBullet(p,D.gun,p.z+27,g.fire==='spread');}}
    if(p.state==='cast'&&t===10)castSpell(p);
    if(p.state==='throw'&&t===4&&p.holding)throwProp(p);
    if(p.state==='roll'){p.x+=p.rdx*3.3;p.y+=p.rdy*1.8;}
    if(t>=busy[p.state])setS(p,'idle');
    p.y=clamp(p.y,FY0+6,FY1);clampX(p);
    return;
  }
  let dx=(I.held.right?1:0)-(I.held.left?1:0),dy=(I.held.down?1:0)-(I.held.up?1:0);
  const air=p.z>0||p.vz>0,spd=D.spd*(p.holding?.75:1);
  p.x+=dx*(air?spd+.15:spd);p.y+=dy*(air?.6:spd*.63);
  if(dx)p.face=dx;
  if(p.state==='jkick'&&!p.didHit){if(strike(p,26+D.reach*.5,7+D.melee*.9,{kd:true,air:true,kb:6}))p.didHit=true;}
  if(!air){
    if(p.holding){
      if(I.pressed.punch||I.pressed.gun){setS(p,'throw');}
      else if(I.pressed.kick){dropProp(p);}
      else{const mv=dx||dy;if(mv){if(p.state!=='walk')setS(p,'walk');p.walk+=spd/1.75;}else if(p.state!=='idle')setS(p,'idle');}
    }
    else if(I.pressed.dodge){p.rdx=dx||(dy?0:p.face);p.rdy=dy;if(p.rdx)p.face=p.rdx;setS(p,'roll');sfx.roll();}
    else if(I.pressed.jump){p.vz=4.7;setS(p,'jump');sfx.jump();}
    else if(I.pressed.punch){
      const npc=nearNPC(p);if(npc){openNPC(npc.id);return;}
      const prop=!G.den&&G.props.find(o=>Math.abs(o.x-p.x)<16&&Math.abs(o.y-p.y)<9);
      const foeNear=G.ents.some(e=>e.team===1&&e.state!=='dead'&&Math.abs(e.y-p.y)<10&&(e.x-p.x)*p.face>-4&&(e.x-p.x)*p.face<30);
      if(prop&&!foeNear){G.props.splice(G.props.indexOf(prop),1);p.holding=prop;setS(p,'lift');sfx.grab();}
      else{if(G.t-p.lastPunch<30)p.combo++;else p.combo=1;p.lastPunch=G.t;if(p.combo>=3){p.combo=0;setS(p,'upper');}else setS(p,'punch');}
    }
    else if(I.pressed.kick){setS(p,'kick');}
    else if(I.pressed.gun&&!G.den){if(!p.eq.gun){sfx.click();say(p,'NO GUN','#ffc63d',56,40,true);}else if(p.ammo>0){setS(p,'shoot');}else{sfx.click();say(p,'NO AMMO','#ffc63d',56,40,true);}}
    else if(I.pressed.spell&&!G.den){const sp=SPELLS[p.spells[p.spell]];if(p.mp>=sp.cost){p.mp-=sp.cost;setS(p,'cast');sfx.spell();}else{sfx.click();say(p,'NO MANA','#45d2ff',56,40,true);}}
    else{
      if(!G.den&&tryGrab(p,dx))return;
      const mv=dx||dy;if(mv){if(p.state!=='walk')setS(p,'walk');p.walk+=spd/1.75;}else if(p.state!=='idle')setS(p,'idle');
    }
  }else if(p.state==='jump'&&(I.pressed.punch||I.pressed.kick)){p.state='jkick';p.didHit=false;}
  p.y=clamp(p.y,FY0+6,FY1);clampX(p);
}
function clampX(p){if(G.den)p.x=clamp(p.x,G.camX+10,Math.min(DEN.len-10,G.camX+W-10));else p.x=clamp(p.x,G.camX+10,G.camX+W-10);}
function respawn(p){
  p.lives--;
  if(PARTY.contract&&PARTY.contract.key==='ghost'&&!PARTY.contract.done)PARTY.contract.failed=true;
  if(p.lives<0){p.lives=0;p.out=true;G.ents=G.ents.filter(e=>e!==p);
    if(!active().length){if(G.arena){arenaOver();return;}musicPlay(null);M.cur=null;setMode('over');}
    else say(active()[0],p.name+' IS OUT','#ff3d8b',80,90);
    return;}
  p.hp=p.maxHp;p.mp=Math.max(p.mp,Math.round(p.maxMp/2));setS(p,'idle');p.dead=false;p.inv=120;p.z=30;p.vz=0;p.vx=0;
  for(const e of G.ents)if(e.team===1&&e.state!=='dead'&&Math.abs(e.x-p.x)<70)hurt(e,4,e.x>p.x?1:-1,{kd:true,kb:16});
  say(p,'BACK IN','#45d2ff',70,60);

function fireBullet(src,dmg,z,spread){
  if(src.team===0){if(src.ammo<=0)return;src.ammo--;sfx.shot();}else sfx.zap();
  const base={team:src.team,src:src.team===0?src:null,z};

  else G.projs.push(Object.assign({k:'bullet',x:src.x+src.face*18,y:src.y,vx:src.face*6.2,dmg,life:90},base));

function castSpell(p){
  const id=p.spells[p.spell],pw=p.D.spell;
  if(id==='fire')G.projs.push({k:'fire',team:0,src:p,x:p.x+p.face*16,y:p.y,z:p.z+28,vx:p.face*3.8,dmg:14+pw,life:130,r:6});
  if(id==='bolt')G.projs.push({k:'bolt',team:0,src:p,x:p.x+p.face*16,y:p.y,z:p.z+28,vx:p.face*7,dmg:10+pw*1.25,life:80,r:4});
  if(id==='heal'){const n=Math.round(20+pw*1.6);for(const q of alive())if(q===p||Math.hypot(q.x-p.x,q.y-p.y)<60){q.hp=Math.min(q.maxHp,q.hp+n);burst(q.x,q.y,30,'#7dffb0',14);say(q,'+'+n+' HP','#7dffb0',64,44);}sfx.heal();G.fx.push({k:'ring',x:p.x,y:p.y,z:20,c:'#7dffb0',life:20,max:20,r:60});}
}

/* ================= enemies ================= */
function pickTarget(e){
  const a=alive();if(!a.length)return null;
  if(e.tgt&&a.includes(e.tgt)&&G.t%30!==0)return e.tgt;
  let best=null,bd=1e9;for(const p of a){const d=Math.abs(p.x-e.x)+Math.abs(p.y-e.y)*2;if(d<bd){bd=d;best=p;}}return best;
}
function upEnemy(e){
  e.t++;if(e.flash>0)e.flash--;
  if(e.thrown&&e.z>0){for(const o of G.ents){if(o===e||o.team!==1||o.state==='dead'||e.thrownHit.includes(o))continue;if(Math.abs(o.x-e.x)<16&&Math.abs(o.y-e.y)<10){e.thrownHit.push(o);hurt(o,10+e.thrown.D.melee*.6,Math.sign(e.vx)||1,{kd:true,big:true,src:e.thrown,ax:e.x});}}}
  physics(e);
  if(e.state==='grabbed')return;
  if(e.state==='dead'){if(e.d.fly&&e.z<=0)e.z=0;if(e.t>70)e.gone=true;return;}
  if(e.state==='down'){if(e.t>58&&e.z===0){setS(e,'idle');e.inv=24;}return;}
  if(e.state==='hurt'){if(e.t>14)setS(e,'idle');return;}
  if(e.inv>0)e.inv--;
  const d=e.d,cd=d.cool*(e.coolMul||1);
  e.tgt=pickTarget(e);const p=e.tgt;
  if(d.fly){e.hover+=.08;e.z=(d.spirit?18:24)+Math.sin(e.hover)*3;}
  if(e.state==='windup'){
    if(e.t===16&&!strike(e,d.reach,e.dmg,{kd:d.boss,kb:d.boss?8:4,big:d.boss}))A.noise(.04,.04,3000);
    if(e.t>=28){setS(e,'idle');e.cool=cd*rand(.7,1.3);}return;
  }
  if(e.state==='slam'){
    if(e.t===24){for(const s of[-1,1])G.projs.push({k:'wave',team:1,x:e.x+s*16,y:e.y,z:3,vx:s*3.2,dmg:e.dmg,life:110,wide:true});sfx.boom();G.shake=9;burst(e.x,e.y,2,'#8a7a9a',16);}
    if(e.t>=40){setS(e,'idle');e.cool=cd*rand(.8,1.2);}return;
  }
  if(e.state==='aim'){
    if(e.t===22){
      if(d.ranged==='bullet')fireBullet(e,e.dmg,e.z+(d.fly?0:27));
      else{const n=d.ranged==='hex3'?(e.enraged?5:3):1;for(let i=0;i<n;i++)G.projs.push({k:'hex',team:1,x:e.x+e.face*16,y:e.y+(n>1?(i-(n-1)/2)*13:0),z:e.z+30,vx:e.face*2.4,dmg:e.dmg,life:170,r:5});sfx.zap();}
    }
    if(e.t>=34){setS(e,'idle');e.cool=cd*rand(.7,1.3);}return;
  }
  if(e.state==='charge'){
    e.x+=e.face*d.charge;e.walk+=2;
    if(!e.didHit&&strike(e,22,e.dmg+4,{kd:true,kb:10,big:true}))e.didHit=true;
    if(e.t>48||e.x<G.camX-30||e.x>G.camX+W+30){e.x=clamp(e.x,G.camX-10,G.camX+W+10);
      if(e.enraged&&(e.chain||0)<2&&p){e.chain=(e.chain||0)+1;e.face=p.x>=e.x?1:-1;e.y+=clamp(p.y-e.y,-12,12);setS(e,'charge');sfx.heavy();}
      else{e.chain=0;setS(e,'idle');e.cool=cd;}}
    if(G.t%3===0)burst(e.x-e.face*10,e.y,4,'#8a7a9a',1);return;
  }
  if(e.state==='lunge'){
    if(!e.didHit&&e.z>0&&strike(e,18,e.dmg+2,{kd:d.boss,kb:6}))e.didHit=true;
    if(e.z===0&&e.t>4){setS(e,'idle');e.cool=cd*rand(.8,1.2);}return;
  }
  if(e.state==='summon'){if(e.t===24){for(const s of[-1,1]){const g=spawnEnemy(e.enraged&&s>0?'spirit':'ghoul',s);g.inv=20;}G.texts.push({x:e.x,y:e.y,z:80,s:'RISE',c:'#ff4a4a',life:50});sfx.spell();}if(e.t>=40)setS(e,'idle');return;}
  if(e.state==='blink'&&p){if(e.t===20){e.x=clamp(p.x+(Math.random()<.5?-1:1)*rand(110,150),G.camX+20,G.camX+W-20);e.y=clamp(p.y+rand(-12,12),FY0+8,FY1);burst(e.x,e.y,30,'#ffc63d',12);}if(e.t>=34)setS(e,'idle');return;}
  e.cool--;
  if(!p){if(e.state!=='idle')setS(e,'idle');return;}
  const dx=p.x-e.x,dy=p.y-e.y,adx=Math.abs(dx),ady=Math.abs(dy);
  e.face=dx>=0?1:-1;
  if(d.spirit){
    const s=d.spd*e.spdMul;e.x+=clamp(dx,-s,s);e.y+=clamp(dy,-s*.7,s*.7);e.y=clamp(e.y,FY0+6,FY1);
    if(adx<18&&ady<9&&e.cool<=0){hurt(p,e.dmg,e.face,{col:'#ff6a3d',ax:e.x,att:e});e.cool=cd;burst(e.x,e.y,e.z,'#ff6a3d',8);}
    return;
  }
  if(d.summon){e.sumT--;if(e.sumT<=0&&G.ents.filter(x=>x.kind==='ghoul'&&x.state!=='dead').length<3){e.sumT=ri(e.enraged?260:360,e.enraged?340:480);setS(e,'summon');return;}}
  if(e.enraged&&(e.kind==='troll'||e.kind==='saint')&&e.cool<=0&&ady<40&&adx<200&&Math.random()<.02){setS(e,'slam');sfx.spell();return;}
  let tx,ty=p.y;
  if(d.ranged){
    if(d.teleport&&e.cool<=0&&adx<(e.enraged?90:60)&&Math.random()<(e.enraged?.08:.04)){setS(e,'blink');e.cool=cd;sfx.spell();return;}
    if(adx<d.reach+4&&ady<8&&e.cool<=0&&!d.fly){setS(e,'windup');return;}
    if(ady<7&&adx<230&&adx>50&&e.cool<=0){setS(e,'aim');return;}
    tx=clamp(p.x-Math.sign(dx||1)*d.range,G.camX+24,G.camX+W-24);
  }else{
    if(d.charge&&e.cool<=0&&ady<8&&adx>80&&adx<220&&Math.random()<.03){setS(e,'charge');sfx.heavy();return;}
    if(d.lunge&&e.cool<=0&&ady<8&&adx>30&&adx<90&&Math.random()<.05){setS(e,'lunge');e.vz=3;e.vx=e.face*Math.min(4,adx/16);sfx.whiff();return;}
    if(adx<d.reach+2&&ady<7&&e.cool<=0){setS(e,'windup');return;}
    const near=(e.slot||0)<2||d.boss;
    tx=p.x-Math.sign(dx||1)*(near?d.reach-4:70+(e.slot||0)*14);if(!near)tx=clamp(tx,G.camX+16,G.camX+W-16);
    ty=near?p.y:p.y+e.yoff*4;
  }
  const s=d.spd*e.spdMul;let mx=clamp(tx-e.x,-s,s),my=clamp(ty-e.y,-s*.7,s*.7);
  if(Math.abs(tx-e.x)<1.2)mx=0;if(Math.abs(ty-e.y)<1)my=0;
  e.x+=mx;e.y+=my;e.y=clamp(e.y,FY0+6,FY1);
  if(mx||my){if(e.state!=='walk')setS(e,'walk');e.walk+=1;}else if(e.state!=='idle')setS(e,'idle');
}

/* ================= world update ================= */
function update(){
  G.t++;
  if(G.banner>0)G.banner--;else if(G.banner<0)G.banner++;
  if(G.goT>0&&!G.waveLive)G.goT--;
  if(G.fade>0&&!G.outro)G.fade=Math.max(0,G.fade-.035);
  if(G.flash>0)G.flash=Math.max(0,G.flash-.05);
  G.comboT++;if(G.comboT>110)G.combo=0;
  for(const p of PL)if(!p.out)upRunner(p);
  if(G.mode!=='play'&&G.mode!=='den')return;
  // melee slots per target
  for(const p of PL){const mel=G.ents.filter(e=>e.team===1&&e.tgt===p&&e.state!=='dead'&&!e.d.ranged&&!e.d.fly).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));mel.forEach((e,i)=>e.slot=i);}
  for(const e of G.ents)if(e.team===1)upEnemy(e);
  G.ents=G.ents.filter(e=>!e.gone);
  for(const pr of G.projs){
    pr.x+=pr.vx;pr.life--;
    if(pr.k==='prop'){pr.z+=pr.vz;pr.vz-=.12;if(pr.z<=0){pr.z=0;shatter(pr);pr.life=0;continue;}}
    if(pr.k==='hex'){const tg=alive()[0];if(tg){let best=tg;for(const q of alive())if(Math.abs(q.x-pr.x)<Math.abs(best.x-pr.x))best=q;pr.y+=clamp(best.y-pr.y,-.25,.25);}if(G.t%3===0)G.parts.push({x:pr.x,y:pr.y,z:pr.z,vx:0,vy:0,vz:.3,life:14,c:'#45d2ff',sz:1.6});}
    if(pr.k==='fire'&&G.t%2===0)G.parts.push({x:pr.x-pr.vx,y:pr.y,z:pr.z+rand(-3,3),vx:-pr.vx*.1,vy:0,vz:rand(.2,.8),life:16,c:Math.random()<.5?'#ff6a3d':'#ffc63d',sz:2});
    if(pr.k==='wave'&&G.t%2===0)G.parts.push({x:pr.x,y:pr.y+rand(-18,18),z:0,vx:0,vy:0,vz:rand(1,2.5),life:12,c:Math.random()<.5?'#ff6a3d':'#8a7a9a',sz:2});
    if(pr.k==='bolt')G.parts.push({x:pr.x-pr.vx*.5,y:pr.y,z:pr.z,vx:0,vy:0,vz:0,life:8,c:'#b98cff',sz:2});
    if(pr.x<G.camX-30||pr.x>G.camX+W+30)pr.life=0;
    if(pr.life<=0)continue;
    for(const t of G.ents){
      if(t.team===pr.team||t.state==='dead'||t.state==='down'||t.inv>0||t.out)continue;
      if(Math.abs(t.y-pr.y)>(pr.wide?24:9)||Math.abs(t.x-pr.x)>11)continue;
      const hb=hitbox(t);if(pr.z<hb[0]||pr.z>hb[1])continue;
      if(pr.k==='wave'){if(t.team!==0)continue;}
      if(pr.k==='bullet'&&t.d&&t.d.noBullet){if(!pr.warned){pr.warned=true;G.texts.push({x:t.x,y:t.y,z:t.z+30,s:'IMMUNE',c:'#ffc63d',life:24,sm:true});}continue;}
      if(pr.k==='fire')explode(pr);
      else if(pr.k==='prop'){hurt(t,pr.dmg,Math.sign(pr.vx),{kd:true,big:true,src:pr.src,ax:pr.x-pr.vx*10});shatter(pr);}
      else if(pr.k==='wave'){hurt(t,pr.dmg,Math.sign(pr.vx),{kd:true,big:true,col:'#ff6a3d',ax:pr.x-pr.vx*10});continue;}
      else hurt(t,pr.dmg,Math.sign(pr.vx),{kb:5,col:pr.k==='hex'?'#45d2ff':pr.k==='bolt'?'#b98cff':'#ffe28a',kd:pr.k==='hex',src:pr.src,ax:pr.x-pr.vx*10,bullet:pr.k==='bullet',magic:pr.k==='bolt'});
      pr.life=0;break;
    }
  }
  G.projs=G.projs.filter(p=>p.life>0);
  for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.z+=q.vz;q.vz-=.15;if(q.z<0){q.z=0;q.vz*=-.3;q.vx*=.6;}q.life--;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const f of G.fx)f.life--;G.fx=G.fx.filter(f=>f.life>0);
  for(const tx of G.texts){tx.z+=.5;tx.life--;}
  G.texts=G.texts.filter(t=>t.life>0);
  for(const k of G.picks){k.t++;for(const p of alive())if(!k.got&&p.z<12&&Math.abs(k.x-p.x)<13&&Math.abs(k.y-p.y)<10)collect(k,p);}
  G.picks=G.picks.filter(k=>!k.got&&(k.t<1200||k.k==='gear'||k.k==='chip'));
  for(const r of G.rain){r.y+=r.s;r.x-=1.2;if(r.y>H){r.y=-10;r.x=rand(0,W+40);}}
  if(G.tip){G.tip.life--;if(G.tip.life<=0)G.tip=G.tipQ&&G.tipQ.length?G.tipQ.shift():null;}
  if(G.t%30===0&&!G.den){for(const p of alive()){
    if(G.props.some(o=>Math.abs(o.x-p.x)<70&&o.x>G.camX))tip('prop','Stand next to a can, crate or drum and tap LIFT, then THROW.','Stand next to a can, crate or drum and press J to lift it, then J again to throw.');
    if(p.hp<p.maxHp*.35&&PARTY.med>0)tip('med','Low on health. Tap MED to use a medkit.','Low on health. Press H to use a medkit.');}}
  if(G.den)denTick();else if(G.arena)arenaTick();else waves();
  camera();
  if(G.shake>0)G.shake*=.85;if(G.shake<.3)G.shake=0;
  if(G.outro>0){G.outro--;if(G.outro<30)G.fade=Math.min(1,G.fade+.04);if(G.outro===0&&G.afterOutro){const f=G.afterOutro;G.afterOutro=null;f();}}
}
function collect(k,p){
  if(k.k==='cred'){PARTY.creds+=k.v;sfx.coin();say(p,'+¥'+k.v,'#ffc63d');}
  if(k.k==='med'){if(PARTY.med>=5&&p.hp>=p.maxHp)return;if(PARTY.med<5){PARTY.med++;say(p,'+1 MEDKIT','#7dffb0');}else{p.hp=Math.min(p.maxHp,p.hp+25);say(p,'+25 HP','#7dffb0');}sfx.buy();}
  if(k.k==='ammo'){p.ammo+=8;sfx.buy();say(p,'+8 AMMO','#ffe28a');}
  if(k.k==='mana'){p.mp=Math.min(p.maxMp,p.mp+30);sfx.buy();say(p,'+30 MANA','#45d2ff');}
  if(k.k==='chip'){contractTick('chip');sfx.loot();say(p,'DATA CHIP','#7dffb0');}
  if(k.k==='gear'){if(PARTY.bag.length>=12){if(k.t%60===1)say(p,'BAG FULL','#a79dc2');return;}PARTY.bag.push(k.item);sfx.loot();say(p,k.item.name.toUpperCase(),['#efe9ff','#45d2ff','#ffc63d'][k.item.rar]);}
  k.got=true;
}
function waves(){
  const S=STAGES[G.stage];if(G.outro)return;
  const foes=G.ents.filter(e=>e.team===1&&e.state!=='dead').length;
  if(G.waveLive&&foes===0){G.waveLive=false;G.lock=null;G.wave++;if(G.wave>=S.waves.length){G.exitOpen=true;musicPlay('d'+G.stage);}G.goT=150;}
  if(!G.waveLive&&G.wave<S.waves.length){
    const w=S.waves[G.wave];
    if(G.camX>=w.at-1){G.camX=w.at;G.lock=w.at;G.waveLive=true;
      w.spawn.forEach((k,i)=>{const e=spawnEnemy(k,i%2?-1:1);e.x+=(i>>1)*(i%2?-18:18);if(DEF[k].boss){e.x=G.camX+W-40;e.y=(FY0+FY1)/2;e.inv=40;}});
      if(w.boss){G.banner=-120;musicPlay('boss');if(PARTY.contract&&PARTY.contract.key==='ghost'&&!PARTY.contract.failed)contractTick('ghost');}
    }
  }
  if(G.exitOpen&&alive().some(p=>p.x>S.len-24))stageClear();
}
function denTick(){
  G.denPrompt=null;for(const p of alive()){const n=nearNPC(p);if(n)G.denPrompt=n;}
  if(alive().some(p=>p.x>DEN.len-24)){for(const p of PL)p.x=Math.min(p.x,DEN.len-60);briefing(G.stage+1,true);}
}
function camera(){
  const S=curS(),a=alive();if(!a.length)return;
  const minX=Math.min(...a.map(p=>p.x)),maxX=Math.max(...a.map(p=>p.x));
  let target=Math.min((minX+maxX)/2-W*.42,minX-14);
  if(G.den){G.camX+=(clamp(target,0,S.len-W)-G.camX)*.12;return;}
  if(G.arena){G.camX=0;return;}
  const next=S.waves[G.wave];let max=S.len-W;
  if(G.lock!=null)max=G.lock;else if(next)max=Math.min(max,next.at);
  target=clamp(target,0,max);if(G.lock!=null)target=G.lock;
  if(target>G.camX)G.camX=Math.min(target,G.camX+2.2);
  G.camX=Math.max(0,G.camX);
}
function explode(pr){
  sfx.boom();G.shake=7;burst(pr.x,pr.y,pr.z,'#ff6a3d',18);burst(pr.x,pr.y,pr.z,'#ffc63d',10);G.fx.push({k:'ring',x:pr.x,y:pr.y,z:pr.z,c:'#ff6a3d',life:18,max:18,r:40});
  for(const t of G.ents){if(t.team!==1||t.state==='dead')continue;
    if(Math.abs(t.x-pr.x)<36&&Math.abs(t.y-pr.y)<16)hurt(t,pr.dmg,t.x>=pr.x?1:-1,{kd:true,kb:8,big:true,col:'#ff6a3d',air:true,src:pr.src,ax:pr.x,magic:true});}
}
function stageClear(){
  const C=PARTY.contract,def=CONTRACTS[G.stage];
  const deb={stage:G.stage,title:C?C.title:'the job',done:!!(C&&C.done),creds:0,karma:0,prize:null,levels:0};
  if(deb.done){deb.creds=def.creds;deb.karma=def.karma;PARTY.creds+=def.creds;if(def.prize){deb.prize=randItem(3,true);}}
  PARTY.contract=null;
  const l0=PL[0].lvl;if(deb.karma)for(const p of PL){p.karma+=deb.karma;while(p.karma>=karmaNext(p.lvl)){p.karma-=karmaNext(p.lvl);p.lvl++;p.pts+=2;}refresh(p);}
  deb.levels=PL[0].lvl-l0;
  if(deb.prize){const pz=deb.prize;pz.rar=2;pz.name='Prototype '+BASES[pz.slot][pz.base].name;if(PARTY.bag.length<12)PARTY.bag.push(pz);}
  G.debrief=deb;
  G.texts.push({x:G.camX+W/2,y:150,z:0,s:'DISTRICT CLEAR',c:'#ffc63d',life:90,big:true});
  G.outro=90;
  G.afterOutro=()=>{
    if(G.stage>=STAGES.length-1){store.del('cs_save3');musicPlay('title');setMode('win');return;}
    for(const p of PL){p.hp=Math.min(p.maxHp,p.hp+Math.round(p.maxHp*.4));p.mp=p.maxMp;}
    G.stock=[randItem(G.stage+1,false),randItem(G.stage+1,false),randItem(G.stage+1,true),randItem(G.stage,false),randItem(G.stage+1,false)];
    enterDen();
  };
}

/* ================= drawing ================= */
function fillPoly(pts,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fill();}
function limb(a,b,c,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();}
function joint(a,c,bend){const mx=(a[0]+c[0])/2,my=(a[1]+c[1])/2;const dx=c[0]-a[0],dy=c[1]-a[1];const L=Math.hypot(dx,dy)||1;return[mx-dy/L*bend,my+dx/L*bend];}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.33)';ctx.beginPath();ctx.ellipse(x,y,w,w*.3,0,0,7);ctx.fill();}
function drawDrone(e){
  const sx=e.x-G.camX,sy=e.y-e.z;shadow(sx,e.y,10);
  ctx.save();ctx.translate(sx,sy);ctx.scale(e.face,1);
  if(e.state==='dead')ctx.rotate(e.t*.2);
  const blink=e.flash>0&&e.flash%2;
  ctx.strokeStyle='#5d6680';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-12,-6);ctx.lineTo(12,-6);ctx.stroke();
  const rw=8+Math.sin(G.t*1.3)*6;ctx.strokeStyle='rgba(200,220,255,.55)';ctx.beginPath();ctx.moveTo(-12-rw/2,-8);ctx.lineTo(-12+rw/2,-8);ctx.moveTo(12-rw/2,-8);ctx.lineTo(12+rw/2,-8);ctx.stroke();
  fillPoly([-10,-4,10,-4,13,2,6,7,-8,7,-11,2],blink?'#ffffff':'#39405a');
  fillPoly([-10,-4,10,-4,8,-1,-8,-1],'#5d6680');
  ctx.fillStyle=e.state==='aim'&&e.t%6<3?'#ffffff':'#ff3d4a';ctx.beginPath();ctx.arc(7,2,2.2,0,7);ctx.fill();
  ctx.fillStyle='#22263a';ctx.fillRect(2,6,9,2);
  ctx.restore();
}
function drawSpirit(e){
  const sx=e.x-G.camX,sy=e.y-e.z;ctx.fillStyle='rgba(255,106,61,.18)';ctx.beginPath();ctx.ellipse(sx,e.y,12,3.5,0,0,7);ctx.fill();
  const fl=e.flash>0&&e.flash%2,a=e.state==='dead'?Math.max(0,1-e.t/20):1;ctx.globalAlpha=a;
  for(let i=0;i<5;i++){const ph=G.t*.25+i*1.3,r=9-i*1.4,ox=Math.sin(ph)*2,oy=-i*4-Math.abs(Math.cos(ph))*2;
    ctx.fillStyle=fl?'#fff':['#ff3d1a','#ff6a3d','#ff9a3d','#ffc63d','#fff1b0'][i];ctx.beginPath();ctx.arc(sx+ox,sy+oy,Math.max(1.5,r),0,7);ctx.fill();}
  ctx.fillStyle='#2a0a04';ctx.fillRect(sx-4+e.face*2,sy-8,2,2.4);ctx.fillRect(sx+1+e.face*2,sy-8,2,2.4);
  ctx.globalAlpha=1;

      if(arg==='ammo'){const c=30*(G.coop?2:1);if(PARTY.creds>=c){PARTY.creds-=c;for(const q of PL)q.ammo+=16;sfx.buy();}}rerender();break;
    case 'cyber':{const l=p.cy[arg],c=CYBER[arg].cost(l);if(l<3&&PARTY.creds>=c){PARTY.creds-=c;p.cy[arg]++;refresh(p);sfx.buy();}rerender();break;}
    case 'fbuy':{const i=G.stock.findIndex(x=>x.uid===arg);if(i>=0&&PARTY.creds>=G.stock[i].price&&PARTY.bag.length<12){PARTY.creds-=G.stock[i].price;PARTY.bag.push(G.stock[i]);G.stock.splice(i,1);sfx.loot();}rerender();break;}
    case 'learn':{const s=SPELLS[arg];if(!p.spells.includes(arg)&&p.D.a.mag>=s.req&&PARTY.creds>=s.price){PARTY.creds-=s.price;p.spells.push(arg);sfx.level();}rerender();break;}
  }
  if(keep){const c2=ov.querySelector('.card');if(c2)c2.scrollTop=top;}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.mode==='play'||G.mode==='den'))togglePause();});

/* ================= loop ================= */
let last=performance.now(),acc=0,tick=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  pollPads();
  while(acc>=1000/60){
    tick++;
    let ran=true;
    if(G.mode==='play'||G.mode==='den'){
      if(G.stop>0){G.stop--;ran=false;}
      else if(G.slow>0){G.slow--;if(tick%3===0)update();else ran=false;}
      else update();
    }
    else if(G.mode==='title')attractStep();
    // keep presses made during hit-stop or slow-mo frames until a frame actually processes them
    if(ran)for(const s of INP)for(const k in s.pressed)s.pressed[k]=false;
    acc-=1000/60;
  }
  render();if(tick%6===0)updateTouchUI();requestAnimationFrame(frame);
}
applyPrefs();fit();attract();setMode('title');musicPlay('title');requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
setTimeout(fit,300);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
})();
</script>
