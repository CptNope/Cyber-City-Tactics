<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyber City Tactics</title>
<meta name="description" content="A vector brawler RPG for one or two players: a five-district campaign, an open-world Sprawl, Arena waves, skill trees, legendaries and secrets. Plays offline.">
<meta name="theme-color" content="#0c0a14">
<meta name="color-scheme" content="dark">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyber City">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>
/* Cyber City Tactics · src/css/game.css — all styles for the page, menus and touch controls. */
/* Layout: one-screen arcade cabinet — canvas fills the stage, touch pad below (portrait) or over the stage (landscape). Single dark look by design. */
:root {
  --ink: #0c0a14;
  --panel: #17121f;
  --panel2: #1f1830;
  --line: #30283f;
  --text: #efe9ff;
  --muted: #a79dc2;
  --neon: #ff3d8b;
  --mana: #45d2ff;
  --gold: #ffc63d;
  --ok: #7dffb0;
  --karma: #b98cff;
  --font-display: 'Teko', Impact, 'Arial Narrow', sans-serif;
  --font-body: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
  --b: 58px;
  --b2: 48px;
  --s: 132px;
  color-scheme: dark;
}
body.size-s {
  --b: 50px;
  --b2: 42px;
  --s: 116px;
}
body.size-l {
  --b: 68px;
  --b2: 56px;
  --s: 152px;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
  overscroll-behavior: none;
}
body {
  -webkit-tap-highlight-color: transparent;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
/* The canvas fills the whole screen inside the notch-safe area; fit() in core/canvas.js sizes the view
   to match the screen's shape, and the touch controls float over it. */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
  box-sizing: border-box;
  position: relative;
}
#stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
#game {
  display: block;
  background: #000;
}
#pauseBtn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  opacity: 0.85;
  border: 1px solid var(--line);
  background: rgba(23, 18, 31, 0.7);
  color: var(--text);
  font: 600 15px var(--font-body);
  cursor: pointer;
  z-index: 4;
}
button:focus-visible {
  outline: 2px solid var(--mana);
  outline-offset: 2px;
}

#ov {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(12, 10, 20, 0.9);
  z-index: 20;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
  box-sizing: border-box;
}
#rotHint {
  position: absolute;
  left: 50%;
  bottom: calc(var(--padH, 0px) + 8px);
  transform: translateX(-50%);
  z-index: 4;
  font: 600 12px var(--font-body);
  letter-spacing: 0.04em;
  color: var(--text);
  background: rgba(23, 18, 31, 0.92);
  border: 1px solid var(--neon);
  border-radius: 20px;
  padding: 8px 14px;
  white-space: nowrap;
  max-width: calc(100% - 16px);
  overflow: hidden;
  text-overflow: ellipsis;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.seg button {
  font: 600 12px var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 9px 12px;
  background: transparent;
  color: var(--muted);
  border: 0;
  border-left: 1px solid var(--line);
  cursor: pointer;
  min-height: 38px;
}
.seg button:first-child {
  border-left: 0;
}
.seg button[aria-pressed='true'] {
  background: var(--neon);
  color: #16040c;
}
.setrow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.setrow > div {
  min-width: 0;
}
.setrow .ds {
  font-size: 12.5px;
  color: var(--muted);
}
@media (pointer: coarse) {
  .btn {
    min-height: 44px;
  }
  .btn.sm {
    min-height: 38px;
    padding: 8px 12px;
  }
  .tab {
    min-height: 40px;
  }
}
.card {
  width: 100%;
  max-width: 640px;
  max-height: 100%;
  overflow: auto;
  box-sizing: border-box;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  animation: cardIn 0.2s ease-out;
}
@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
  }
}
.card h1 {
  font: 600 clamp(48px, 11vw, 84px)/0.82 var(--font-display);
  margin: 0;
  letter-spacing: 0.01em;
  text-shadow:
    -3px 0 var(--neon),
    3px 0 var(--mana);
  text-wrap: balance;
}
/* The wordmark (brand book: Name and wordmark): CYBER CITY with the pink/cyan chromatic split, TACTICS knocked
   out of a Neon Pink bar. The bar is the brand's signature shape. */
.card h1.wordmark {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.07em;
  text-transform: uppercase;
  text-shadow: none;
}
.wordmark .wm-city {
  text-shadow:
    -3px 0 var(--neon),
    3px 0 var(--mana);
}
/* First visit only: the sign powers on. CYBER CITY's split pulls into focus while the TACTICS bar
   stutters alight like a neon tube. Under a second, never blocks input, skipped for reduced motion. */
.wordmark.boot .wm-city {
  animation: wmFocus 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.wordmark.boot .wm-bar {
  animation: wmTube 0.9s steps(1, end) both;
}
@keyframes wmFocus {
  from {
    opacity: 0.4;
    text-shadow:
      -12px 0 var(--neon),
      12px 0 var(--mana);
  }
}
@keyframes wmTube {
  0% {
    opacity: 0.12;
  }
  10% {
    opacity: 1;
  }
  16% {
    opacity: 0.25;
  }
  28% {
    opacity: 1;
  }
  33% {
    opacity: 0.5;
  }
  42%,
  100% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  .wordmark.boot .wm-city,
  .wordmark.boot .wm-bar {
    animation: none;
  }
}
.wordmark .wm-bar {
  background: var(--neon);
  color: var(--ink);
  font-size: 0.56em;
  line-height: 1;
  padding: 0.08em 0.24em 0;
  letter-spacing: 0.14em;
}
.card h2 {
  font: 600 clamp(32px, 7vw, 48px)/0.9 var(--font-display);
  margin: 0;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.card h3 {
  font: 600 22px/1 var(--font-display);
  margin: 4px 0 0;
  letter-spacing: 0.04em;
  color: var(--muted);
  text-transform: uppercase;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.card p {
  margin: 0;
  line-height: 1.5;
  color: var(--muted);
  max-width: 62ch;
}
.say {
  border-left: 2px solid var(--neon);
  padding: 4px 0 4px 12px;
  color: var(--text) !important;
  font-size: 15px;
}
.say b {
  color: var(--neon);
  font-weight: 600;
  letter-spacing: 0.06em;
  font-size: 12px;
  display: block;
  text-transform: uppercase;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  font: 600 13px var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 10px 16px;
  border-radius: 6px;
  border: 1px solid var(--neon);
  background: var(--neon);
  color: #16040c;
  cursor: pointer;
}
.btn.ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--line);
}
.btn.sm {
  padding: 6px 10px;
  font-size: 11.5px;
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
.tab {
  font: 600 12px var(--font-body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.tab[aria-selected='true'] {
  color: var(--text);
  border-color: var(--line);
  background: var(--panel2);
}
.tab .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  margin-left: 6px;
  vertical-align: middle;
}
.keys {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 14px;
  font-size: 13px;
  color: var(--muted);
}
.keys b {
  color: var(--text);
  font-weight: 600;
}
.cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}
.cols > div {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}
.item > div {
  min-width: 0;
}
.item .nm {
  font-weight: 600;
}
.item .ds {
  font-size: 12.5px;
  color: var(--muted);
}
.item .acts {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.r0 {
  color: #e6e1f2;
}
.r1 {
  color: var(--mana);
}
.r2 {
  color: var(--gold);
}
.up {
  color: var(--ok);
}
.down {
  color: var(--neon);
}
.wallet {
  font: 600 26px var(--font-display);
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.attrs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
}
.attr {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.attr .k {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.attr .v {
  font: 600 30px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.attr .h {
  font-size: 11.5px;
  color: var(--muted);
}
.derived {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 4px 14px;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.derived b {
  color: var(--text);
}
.meter {
  height: 6px;
  background: #2a2238;
  border-radius: 3px;
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  background: var(--karma);
}
.job {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sharebox {
  user-select: text;
  -webkit-user-select: text;
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text);
  background: var(--panel);
  overflow-wrap: anywhere;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
}
.stats div {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel);
}
.stats b {
  display: block;
  font: 600 26px/1 var(--font-display);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stats span {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.trk {
  position: relative;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #0b0812;
  overflow: hidden;
  transition: box-shadow 0.1s;
}
.trk .zone {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(125, 255, 176, 0.28);
  border-left: 2px solid var(--ok);
  border-right: 2px solid var(--ok);
}
.trk .cur {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 3px;
  margin-left: -1.5px;
  background: var(--neon);
  box-shadow: 0 0 8px var(--neon);
}
.trk[data-f='ok'] {
  box-shadow: 0 0 0 2px var(--ok);
}
.trk[data-f='bad'] {
  box-shadow: 0 0 0 2px var(--neon);
}
.btn.big {
  padding: 16px 34px;
  font-size: 16px;
  min-width: 150px;
}
.sk-tree {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 6px;
}
.sk-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}
.sk-link {
  height: 14px;
  width: 2px;
  margin: 0 auto;
  background: linear-gradient(var(--tc), transparent);
  opacity: 0.6;
}
.sk {
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition:
    transform 0.15s,
    border-color 0.15s,
    box-shadow 0.2s;
}
.sk .sk-n {
  font: 600 15px var(--font-display);
  letter-spacing: 0.02em;
}
.sk .sk-d {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.35;
}
.sk .sk-l {
  font-size: 11.5px;
  color: var(--neon);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.sk.own {
  border-color: var(--tc);
  box-shadow:
    inset 0 0 0 1px var(--tc),
    0 0 14px -6px var(--tc);
}
.sk.own .sk-n {
  color: var(--tc);
}
.sk.can {
  border-color: var(--gold);
  animation: skp 1.6s ease-in-out infinite;
}
.sk.can:hover {
  transform: translateY(-2px);
}
.sk.lock {
  opacity: 0.5;
  cursor: default;
}
.sk.pop {
  animation: skpop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1);
}
@keyframes skp {
  50% {
    box-shadow: 0 0 0 3px rgba(255, 198, 61, 0.18);
  }
}
@keyframes skpop {
  0% {
    transform: scale(0.92);
  }
  60% {
    transform: scale(1.04);
  }
  100% {
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .sk.can,
  .sk.pop {
    animation: none;
  }
}
.r3 {
  color: #ff8a3d;
}
.swatch {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: linear-gradient(135deg, var(--c1) 55%, var(--c2) 55%);
  cursor: pointer;
  font-size: 11px;
  padding: 0;
  color: #fff;
}
.swatch.on {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.swatch:disabled {
  opacity: 0.35;
  cursor: default;
}
@media (pointer: coarse) {
  .swatch {
    width: 32px;
    height: 32px;
  }
}
.job .st {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

#pad {
  display: none;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  position: absolute;
  z-index: 5;
  left: env(safe-area-inset-left, 0px);
  right: env(safe-area-inset-right, 0px);
  bottom: env(safe-area-inset-bottom, 0px);
  padding: 6px 12px 8px;
  pointer-events: none;
}
#pad > * {
  pointer-events: auto;
}
body.touch #pad {
  display: flex;
}
body.touch.lefty #pad {
  flex-direction: row-reverse;
}
#stick {
  width: calc(var(--s) * 1.25);
  height: calc(var(--s) * 1.12);
  flex: none;
  position: relative;
  touch-action: none;
}
#ring {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  border: 2px solid var(--line);
  background: rgba(23, 18, 31, 0.55);
  pointer-events: none;
}
#knob {
  position: absolute;
  left: 29%;
  top: 29%;
  width: 42%;
  height: 42%;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--muted);
  pointer-events: none;
}
#btns {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
}
body.lefty #btns {
  align-items: flex-start;
}
.urow,
.mrow,
.brow {
  display: flex;
  gap: 8px;
}
.tb {
  width: var(--b2);
  height: var(--b2);
  border-radius: 50%;
  border: 2px solid var(--neon);
  background: rgba(255, 61, 139, 0.14);
  color: var(--text);
  font: 600 10.5px/1.05 var(--font-body);
  letter-spacing: 0.03em;
  touch-action: none;
  padding: 0;
  flex: none;
}
.tb.big {
  width: var(--b);
  height: var(--b);
  font-size: 11.5px;
}
.tb small {
  display: block;
  font-size: 9.5px;
  opacity: 0.85;
  font-variant-numeric: tabular-nums;
}
.tb.on {
  background: rgba(255, 61, 139, 0.45);
}
.tb.dim {
  opacity: 0.4;
}
.urow .tb.spec {
  border-color: var(--gold);
  color: var(--gold);
  min-width: 64px;
}
.urow .tb.spec.ready {
  background: rgba(255, 198, 61, 0.35);
  color: var(--text);
  box-shadow: 0 0 12px rgba(255, 198, 61, 0.5);
}
.tb.gun {
  border-color: var(--gold);
  background: rgba(255, 198, 61, 0.12);
}
.tb.spell {
  border-color: var(--mana);
  background: rgba(69, 210, 255, 0.12);
}
.tb.move {
  border-color: var(--ok);
  background: rgba(125, 255, 176, 0.1);
}
.urow .tb {
  width: auto;
  min-width: var(--b2);
  height: 34px;
  border-radius: 17px;
  padding: 0 10px;
  border-color: var(--muted);
  background: rgba(167, 157, 194, 0.1);
}
@media (orientation: landscape) and (max-height: 460px) {
  body.touch {
    --b: 50px;
    --b2: 42px;
    --s: 110px;
  }
  body.touch.size-s {
    --b: 44px;
    --b2: 38px;
    --s: 96px;
  }
  body.touch.size-l {
    --b: 56px;
    --b2: 46px;
    --s: 124px;
  }
  .urow .tb {
    height: 30px;
  }
}
@media (orientation: portrait) {
  /* stick zone + 12px gap + three buttons must fit the phone width minus the 32px gutter */
  body.touch {
    --b: 60px;
    --b2: 50px;
    --s: min(128px, calc((100vw - 32px - 12px - 16px) * 0.38));
  }

const PAD_BACK = ['hackquit', 'importno', 'setdone', 'close', 'leave', 'resume', 'back2title'];
function padBack() {
  if (G.mode === 'hack') {
    G.hack = null;
    setMode('play');
    return;
  }
  for (const a of PAD_BACK) {
    const b = ov.querySelector(`[data-a="${a}"]:not([disabled])`);
    if (b) {

      b.click();

    }

function padTabs(step) {
  const groups = [...ov.querySelectorAll('.tabs')];
  if (!groups.length) return;
  const g = groups.find(x => x.contains(document.activeElement)) || groups[groups.length - 1];
  const tabs = [...g.querySelectorAll('.tab')];
  const i = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');

function pollPads() {
  if (!navigator.getGamepads) return;
  let list;
  try {
    list = [...navigator.getGamepads()].filter(Boolean);
  } catch (e) {
    return;
  }
  const now = performance.now();
  list.forEach((gp, n) => {
    if (n > 1) return;
    let who = G.coop ? (list.length >= 2 ? n : 1) : n === 0 ? 0 : -1;
    const b = i => !!(gp.buttons[i] && gp.buttons[i].pressed),
      ax = gp.axes[0] || 0,
      ay = gp.axes[1] || 0;
    const st = {
      left: b(14) || ax < -0.45,
      right: b(15) || ax > 0.45,
      up: b(12) || ay < -0.45,
      down: b(13) || ay > 0.45,
      jump: b(0),
      kick: b(1),
      punch: b(2),
      spell: b(3),
      dodge: b(4),
      gun: b(5),
      item: b(6),
      swap: b(7),
      sheet: b(8),
      start: b(9),
      special: b(10) || b(11)
    };
    const prev = padPrev[gp.index] || {};
    const pressed = k => st[k] && !prev[k];
    if (Object.keys(st).some(pressed)) {
      userActed = true;
      padSeen(gp);
    }
    // Menus: navigate with the D-pad or stick (held directions repeat), A to pick, B to go back.
    if (!ACTIVE() && G.mode !== 'hack') {
      const dir = ['up', 'down', 'left', 'right'].find(d => st[d]);
      const nav = PAD.nav[gp.index] || (PAD.nav[gp.index] = { dir: null, next: 0 });
      if (!dir) nav.dir = null;
      else if (dir !== nav.dir) {
        nav.dir = dir;
        nav.next = now + 340;
        padMove(dir);
      } else if (now >= nav.next) {
        nav.next = now + 110;
        padMove(dir);
      }
      if (pressed('jump') || pressed('start')) padActivate();
      else if (pressed('kick')) padBack();
      else if (pressed('dodge')) padTabs(-1);
      else if (pressed('gun')) padTabs(1);
      else if (pressed('sheet') && G.mode === 'sheet') globalAct('sheet', who >= 0 ? who : 0);
      padPrev[gp.index] = st;
      return;
    }
    if (G.mode === 'hack') {
      if (pressed('punch') || pressed('jump')) hackPress();
      else if (pressed('spell')) useIce();
      else if (pressed('kick')) padBack();
      padPrev[gp.index] = st;
      return;
    }
    for (const k in st) {
      const on = st[k],
        was = !!prev[k];
      if (k === 'start') {
        if (on && !was) {
          A.unlock();
          if (!G.coop && n === 1) joinRunner2();
          else togglePause();
        }
        continue;
      }
      if (k === 'sheet') {
        if (on && !was && who >= 0) globalAct('sheet', who);
        continue;
      }
      if (who < 0) continue;
      if (on && !was) kp(who, k, true);
      else if (!on && was) kp(who, k, false);
    }
    padPrev[gp.index] = st;
  });
}

function applyArch(p, key) {
  const A0 = ARCH[key] || ARCH.runner;
  p.arch = ARCH[key] ? key : 'runner';
  p.attr = Object.assign({ hak: 1 }, A0.attr);
  p.cy = Object.assign({ arm: 0, wired: 0, plate: 0 }, A0.cy || {});
  if (A0.weapon) p.eq.weapon = mkItem('weapon', A0.weapon, 0);
  if (A0.gun) p.eq.gun = mkItem('gun', A0.gun, 0);
  if (A0.noGun) p.eq.gun = null;
  if (A0.spells) p.spells = A0.spells.slice();
  if (A0.ammo) p.ammo = A0.ammo;
  p.sk = null;
  p.spts = undefined;
  initSkills(p);
  p.coat = pendCoat(p.idx);
  p.trail = trailOpen(pendTrail(p.idx)) ? pendTrail(p.idx) : 'none';
  if (!coatOpen(p.coat)) p.coat = 'sig';
  applyCoat(p);
  refresh(p);
  p.hp = p.maxHp;
  p.mp = p.maxMp;
}

function mkItem(slot, base, rar, mod) {
  const b = BASES[slot][base] || Object.values(BASES[slot])[0],
    r = RAR[rar];
  if (mod === true) {
    const ms = Object.keys(AFFIX).filter(k => AFFIX[k].slots.includes(slot));
    mod = pick(ms);
  }
  const it = {
    uid: Math.random().toString(36).slice(2, 9),
    slot,
    base,
    rar,
    name: (rar ? r.n + ' ' : '') + (mod ? AFFIX[mod].n + ' ' : '') + b.name,
    bonus: Object.assign({}, b.bonus || {})
  };
  if (mod) it.mod = mod;
  if (b.dmg) it.dmg = Math.round(b.dmg * r.m);
  if (b.arm) it.arm = Math.round(b.arm * r.m);
  if (b.reach) it.reach = b.reach;
  if (b.fire) it.fire = b.fire;
  if (b.look) it.look = b.look;
  const ks = Object.keys(ATTRS);
  for (let i = 0; i < rar; i++) {
    const k = pick(ks);
    it.bonus[k] = (it.bonus[k] || 0) + 1;
  }
  it.price = Math.round(b.price * (1 + rar * 0.7) * (mod ? 1.3 : 1));
  return it;
}
/* Salvage and crafting at Ratchet's: scrap gear into parts, then spend parts to reroll an affix or raise rarity. */
const salvageParts = it => (it.leg ? 0 : 1 + it.rar * 2 + (it.mod ? 1 : 0));
const REROLL = { parts: 3, creds: 40 };
const upgradeCost = it => ({ parts: 4 * (it.rar + 1), creds: 80 * (it.rar + 1) });
const canUpgrade = it => !!it && !it.leg && it.rar < 2;
const canReroll = it => !!it && !it.leg;
function renameItem(it) {
  const b = BASES[it.slot][it.base];
  it.name = (it.rar ? RAR[it.rar].n + ' ' : '') + (it.mod ? AFFIX[it.mod].n + ' ' : '') + b.name;
  it.price = Math.round(b.price * (1 + it.rar * 0.7) * (it.mod ? 1.3 : 1));
}
function rerollItem(it) {
  if (!canReroll(it)) return false;
  const ms = Object.keys(AFFIX).filter(k => AFFIX[k].slots.includes(it.slot) && k !== it.mod);
  it.mod = pick(ms);
  renameItem(it);
  return true;
}
function upgradeItem(it) {
  if (!canUpgrade(it)) return false;
  const b = BASES[it.slot][it.base];
  it.rar++;
  if (b.dmg) it.dmg = Math.round(b.dmg * RAR[it.rar].m);
  if (b.arm) it.arm = Math.round(b.arm * RAR[it.rar].m);
  const k = pick(Object.keys(ATTRS));
  it.bonus[k] = (it.bonus[k] || 0) + 1;
  renameItem(it);
  return true;
}
function randItem(stage, boost) {
  const slot = pick(['weapon', 'gun', 'armor', 'weapon', 'gun']);
  const bases = Object.keys(BASES[slot]);
  const top = clamp(Math.floor(stage) + 1 + (boost ? 1 : 0), 0, bases.length - 1);
  const base = bases[ri(Math.max(0, top - 2), top)];
  const roll = Math.random() + stage * 0.12 + (boost ? 0.45 : 0);
  const rar = roll > 1.15 ? 2 : roll > 0.68 ? 1 : 0;
  return mkItem(slot, base, rar, Math.random() < [0, 0.4, 0.8][rar]);
}

/* ================= world update ================= */
function update() {
  G.t++;
  if (G.banner > 0) G.banner--;
  else if (G.banner < 0) G.banner++;
  if (G.goT > 0 && !G.waveLive) G.goT--;
  if (G.fade > 0 && !G.outro) G.fade = Math.max(0, G.fade - 0.035);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - 0.05);
  G.comboT++;

  for (const p of PL) {
    if (p.parryT > 0) p.parryT--;
    if (p.chiT > 0) p.chiT--;
    if (!p.out) upRunner(p);
  }
  reviveTick();
  for (const e of G.ents) if (e.kind === 'ally') upAlly(e);
  if (G.mode !== 'play' && G.mode !== 'den') return;
  // melee slots per target
  for (const p of PL) {
    const mel = G.ents
      .filter(
        e => e.team === 1 && e.tgt === p && e.state !== 'dead' && !e.d.ranged && !e.d.fly && !e.d.passive
      )
      .sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x));
    mel.forEach((e, i) => (e.slot = i));
  }
  const slowSkip = G.slowFoes > 0 && G.t % 2 === 1;
  if (G.slowFoes > 0) G.slowFoes--;
  for (const e of G.ents) if (e.team === 1 && (!slowSkip || e.d.passive)) upEnemy(e);
  for (const z of G.zaps) {
    z.delay--;

      const tg = z.tg;
      if (tg.state !== 'dead') {
        G.fx.push({
          k: 'zap',
          x: tg.x,
          y: tg.y,
          z: tg.z + 20,
          c: z.bul ? '#ffe28a' : '#b98cff',
          life: 10,
          max: 10,
          r: 0
        });
        sfx.zap();
        hurt(tg, z.dmg, tg.x >= z.src.x ? 1 : -1, {
          src: z.src,
          magic: !z.bul && !z.mel,
          bullet: !!z.bul,
          rico: !!z.bul,
          melee: !!z.mel,
          silk: !!z.mel,
          col: z.mel ? '#ff3d8b' : z.bul ? '#ffe28a' : '#b98cff',
          air: true,
          ax: z.src.x

    }
  }
  G.zaps = G.zaps.filter(z => z.delay > 0);

    if (e.burnT > 0 && e.state !== 'dead') {
      e.burnT--;

        G.parts.push({
          x: e.x + rand(-6, 6),
          y: e.y,
          z: rand(10, 40),
          vx: 0,
          vy: 0,
          vz: rand(0.4, 1),
          life: 14,
          c: Math.random() < 0.5 ? '#ff6a3d' : '#ffc63d',
          sz: 2
        });
      if (e.burnT % 30 === 0) {
        e.hp -= e.burnDmg;
        e.flash = 4;
        G.texts.push({ x: e.x, y: e.y, z: e.z + 48, s: '' + e.burnDmg, c: '#ff6a3d', life: 24, sm: true });
        if (e.hp <= 0) kill(e, 1, { src: active()[0] });
      }
    }
  }
  G.ents = G.ents.filter(e => !e.gone);
  for (const pr of G.projs) {
    pr.x += pr.vx * (pr.team === 1 && G.slowFoes > 0 ? 0.5 : 1);
    pr.life--;
    if (pr.k === 'prop') {
      pr.z += pr.vz;
      pr.vz -= 0.12;
      if (pr.z <= 0) {
        pr.z = 0;
        shatter(pr);
        pr.life = 0;
        continue;
      }
    }
    if (pr.k === 'nade') {
      pr.z += pr.vz;
      pr.vz -= 0.09;
      if (pr.z <= 0) {
        pr.z = 0;
        explode(pr, { gun: true });
        pr.life = 0;
        continue;
      }
    }
    if (pr.seek) {
      let best = null,
        bd = 1e9;
      for (const e of G.ents) {
        if (
          e.team === pr.team ||
          e.team === 2 ||
          e.state === 'dead' ||
          (e.d && e.d.passive) ||
          (e.x - pr.x) * Math.sign(pr.vx) < 0

          continue;
        const d = Math.abs(e.x - pr.x);
        if (d < bd) {
          bd = d;
          best = e;
        }
      }
      if (best) pr.y += clamp(best.y - pr.y, -0.9, 0.9);
    }
    if (pr.k === 'hex') {
      const tg = alive()[0];
      if (tg) {
        let best = tg;
        for (const q of alive()) if (Math.abs(q.x - pr.x) < Math.abs(best.x - pr.x)) best = q;
        pr.y += clamp(best.y - pr.y, -0.25, 0.25);
      }
      if (G.t % 3 === 0)
        G.parts.push({ x: pr.x, y: pr.y, z: pr.z, vx: 0, vy: 0, vz: 0.3, life: 14, c: '#45d2ff', sz: 1.6 });
    }
    if (pr.k === 'fire' && G.t % 2 === 0)
      G.parts.push({
        x: pr.x - pr.vx,
        y: pr.y,
        z: pr.z + rand(-3, 3),
        vx: -pr.vx * 0.1,
        vy: 0,
        vz: rand(0.2, 0.8),
        life: 16,
        c: Math.random() < 0.5 ? '#ff6a3d' : '#ffc63d',
        sz: 2
      });
    if (pr.k === 'wave' && G.t % 2 === 0)
      G.parts.push({
        x: pr.x,
        y: pr.y + rand(-18, 18),
        z: 0,
        vx: 0,
        vy: 0,
        vz: rand(1, 2.5),
        life: 12,
        c: Math.random() < 0.5 ? '#ff6a3d' : '#8a7a9a',
        sz: 2
      });
    if (pr.k === 'bolt')
      G.parts.push({
        x: pr.x - pr.vx * 0.5,
        y: pr.y,
        z: pr.z,
        vx: 0,
        vy: 0,
        vz: 0,
        life: 8,
        c: '#b98cff',
        sz: 2
      });
    if (pr.x < G.camX - 30 || pr.x > G.camX + W + 30) pr.life = 0;
    if (pr.life <= 0) continue;
    for (const t of G.ents) {
      if (t.team === pr.team || t.state === 'dead' || t.state === 'down' || t.inv > 0 || t.out) continue;
      if (Math.abs(t.y - pr.y) > (pr.wide ? 24 : 9) || Math.abs(t.x - pr.x) > 11) continue;
      const hb = hitbox(t);
      if (pr.z < hb[0] || pr.z > hb[1]) continue;
      if (pr.k === 'wave') {
        if (t.team !== 0) continue;
      }
      if (pr.k === 'bullet' && t.d && t.d.noBullet) {
        if (!pr.warned) {
          pr.warned = true;
          G.texts.push({ x: t.x, y: t.y, z: t.z + 30, s: 'IMMUNE', c: '#ffc63d', life: 24, sm: true });
        }
        continue;
      }
      if (pr.hit && pr.hit.includes(t)) continue;
      if (pr.k === 'fire') explode(pr);
      else if (pr.k === 'nade') {
        explode(pr, { gun: true });
      } else if (pr.k === 'prop') {
        hurt(t, pr.dmg, Math.sign(pr.vx), { kd: true, big: true, src: pr.src, ax: pr.x - pr.vx * 10 });
        shatter(pr);
      } else if (pr.k === 'wave') {
        hurt(t, pr.dmg, Math.sign(pr.vx), { kd: true, big: true, col: '#ff6a3d', ax: pr.x - pr.vx * 10 });
        continue;
      } else
        hurt(t, pr.dmg, Math.sign(pr.vx), {
          kb: 5,
          col: pr.k === 'hex' || pr.k === 'laser' ? '#45d2ff' : pr.k === 'bolt' ? '#b98cff' : '#ffe28a',
          kd: pr.k === 'hex' || !!pr.kd,
          src: pr.src,
          ax: pr.x - pr.vx * 10,
          bullet: pr.k === 'bullet',
          magic: pr.k === 'bolt',
          ap: pr.pierce > 0
        });
      if (pr.drain && pr.src && pr.src.state !== 'dead') {
        const n = Math.round(pr.dmg * 0.5);
        pr.src.hp = Math.min(pr.src.maxHp, pr.src.hp + n);
        say(pr.src, '+' + n + ' HP', '#7dffb0', 60, 34, true);
      }
      if (pr.pierce > 0 && pr.k === 'bullet') {
        pr.pierce--;
        pr.hit.push(t);
        continue;
      }
      pr.life = 0;
      break;
    }
  }
  G.projs = G.projs.filter(p => p.life > 0);
  for (const q of G.parts) {
    q.x += q.vx;
    q.y += q.vy;
    q.z += q.vz;
    q.vz -= 0.15;
    if (q.z < 0) {
      q.z = 0;
      q.vz *= -0.3;
      q.vx *= 0.6;
    }
    q.life--;
  }
  G.parts = G.parts.filter(q => q.life > 0);
  const cap = lowFx() ? 90 : 240; // a hard cap so a huge fight can't bog down a slow device
  if (G.parts.length > cap) G.parts.splice(0, G.parts.length - cap);
  for (const f of G.fx) f.life--;
  G.fx = G.fx.filter(f => f.life > 0);
  for (const tx of G.texts) {
    tx.z += 0.5;
    tx.life--;
  }
  G.texts = G.texts.filter(t => t.life > 0);
  for (const k of G.picks) {
    k.t++;
    for (const p of alive())
      if (!k.got && p.z < 12 && Math.abs(k.x - p.x) < 13 && Math.abs(k.y - p.y) < 10) collect(k, p);
  }
  G.picks = G.picks.filter(
    k => !k.got && (k.t < 1200 || k.k === 'gear' || k.k === 'chip' || k.k === 'icebrk' || k.k === 'shard')
  );
  const mxr = curS().matrix;
  for (const r of G.rain) {
    r.y += r.s * (mxr ? 0.5 : 1);
    r.x -= mxr ? 0 : 1.2;
    if (r.y > H) {
      r.y = -10;
      r.x = rand(0, W + 40);
    }
  }
  if (G.tip) {
    G.tip.life--;
    if (G.tip.life <= 0) G.tip = G.tipQ && G.tipQ.length ? G.tipQ.shift() : null;
  }
  if (G.t % 30 === 0 && !G.den) {
    for (const p of alive()) {
      if (G.ents.some(e => e.kind === 'vend' && e.state !== 'dead' && Math.abs(e.x - p.x) < 80))
        tip('vend', 'Smash vending machines for medkits, ammo and mana.');
      if (G.props.some(o => Math.abs(o.x - p.x) < 70 && o.x > G.camX))
        tip(
          'prop',
          'Stand next to a can, crate or drum and tap LIFT, then THROW.',
          'Stand next to a can, crate or drum and press J to lift it, then J again to throw.'
        );
      if (p.hp < p.maxHp * 0.35 && PARTY.med > 0)
        tip('med', 'Low on health. Tap MED to use a medkit.', 'Low on health. Press H to use a medkit.');
    }
  }
  if (G.world) worldTick();
  else if (G.den) denTick();
  else if (G.arena) arenaTick();
  else if (G.training) trainTick();
  else waves();
  camera();
  if (G.shake > 0) G.shake *= 0.85;
  if (G.shake < 0.3) G.shake = 0;
  if (G.outro > 0) {
    G.outro--;
    if (G.outro < 30) G.fade = Math.min(1, G.fade + 0.04);
    if (G.outro === 0 && G.afterOutro) {
      const f = G.afterOutro;
      G.afterOutro = null;
      f();
    }
  }
}
function collect(k, p) {
  if (k.k === 'cred') {
    PARTY.creds += k.v;
    sfx.coin();
    say(p, '+¥' + k.v, '#ffc63d');
  }
  if (k.k === 'med') {
    if (PARTY.med >= 5 && p.hp >= p.maxHp) return;
    if (PARTY.med < 5) {
      PARTY.med++;
      say(p, '+1 MEDKIT', '#7dffb0');
    } else {
      p.hp = Math.min(p.maxHp, p.hp + 25);
      say(p, '+25 HP', '#7dffb0');
    }
    sfx.buy();
  }
  if (k.k === 'ammo') {
    const n = gmodOf(p) === 'mag' ? 12 : 8;
    p.ammo += n;
    sfx.buy();
    say(p, '+' + n + ' AMMO', '#ffe28a');
  }
  if (k.k === 'mana') {
    p.mp = Math.min(p.maxMp, p.mp + 30);
    sfx.buy();
    say(p, '+30 MANA', '#45d2ff');
  }
  if (k.k === 'chip') {
    contractTick('chip');
    sfx.loot();
    say(p, 'DATA CHIP', '#7dffb0');
  }
  if (k.k === 'icebrk') {
    PARTY.ice = (PARTY.ice || 0) + 1;
    sfx.loot();
    say(p, '+1 ICEBREAKER', '#45d2ff');
  }
  if (k.k === 'gear') {
    if (PARTY.bag.length >= BAG_MAX) {
      if (k.t % 60 === 1) say(p, 'BAG FULL', '#a79dc2');
      return;
    }
    PARTY.bag.push(gotItem(k.item));
    sfx.loot();
    say(p, k.item.name.toUpperCase(), RCOL[k.item.rar]);
    gotLegend(k.item);
  }
  if (k.k === 'shard') {
    gotShard(p);
  }
  k.got = true;
}
const waveAt = (S, w) => Math.min(w.at, Math.max(0, S.len - W));
function waves() {
  const S = STAGES[G.stage];
  if (G.outro) return;
  const foes = G.ents.filter(e => e.team === 1 && e.state !== 'dead' && !e.d.passive).length;
  if (G.waveLive && foes === 0) {
    G.waveLive = false;
    G.lock = null;
    G.wave++;
    musicPlay('d' + G.stage);
    if (G.wave >= S.waves.length) G.exitOpen = true;
    G.goT = 150;
  }
  if (!G.waveLive && G.wave < S.waves.length) {
    const w = S.waves[G.wave],
      at = waveAt(S, w); // on a wide screen the camera stops short of the last trigger, so meet it there
    if (G.camX >= at - 1) {
      G.camX = at;
      G.lock = at;
      G.waveLive = true;
      w.spawn.forEach((k0, i) => {
        const re = k0.endsWith('!'),
          k = re ? k0.slice(0, -1) : k0;
        const e = spawnEnemy(k, i % 2 ? -1 : 1);
        e.x += (i >> 1) * (i % 2 ? -18 : 18);
        if (DEF[k].boss) {
          e.x = G.camX + W - 40;
          e.y = (FY0 + FY1) / 2;
          e.inv = 40;
        }
        if (re) rematch(e);
      });
      if (w.boss) {
        G.banner = -120;
        musicPlay('boss');
        if (PARTY.contract && PARTY.contract.key === 'ghost' && !PARTY.contract.failed) contractTick('ghost');
      }
    }
  }
  if (G.exitOpen && alive().some(p => p.x > S.len - 24)) stageClear();
}
function denTick() {
  G.denPrompt = null;
  for (const p of alive()) {
    const n = nearNPC(p);
    if (n) G.denPrompt = n;
  }
  if (alive().some(p => p.x > DEN.len - 24)) {
    for (const p of PL) p.x = Math.min(p.x, DEN.len - 60);
    briefing(G.stage + 1, true);
  }
}
function camera() {
  const S = curS(),
    a = alive();
  if (!a.length) return;
  const minX = Math.min(...a.map(p => p.x)),
    maxX = Math.max(...a.map(p => p.x));
  let target = Math.min((minX + maxX) / 2 - W * 0.42, minX - 14);
  if (G.den || (G.world && !G.dun)) {
    G.camX += (clamp(target, 0, Math.max(0, S.len - W)) - G.camX) * 0.12;
    return;
  }
  if (G.arena || G.training || G.dun) {
    G.camX = 0;
    return;
  }
  const next = S.waves[G.wave];
  let max = Math.max(0, S.len - W);
  if (G.lock != null) max = G.lock;
  else if (next) max = Math.min(max, waveAt(S, next));
  target = clamp(target, 0, max);
  if (G.lock != null) target = G.lock;
  if (target > G.camX) G.camX = Math.min(target, G.camX + 2.2);
  G.camX = Math.max(0, G.camX);
}

function stageClear() {
  const C = PARTY.contract,
    def = CONTRACTS[G.stage];
  if (G.coop) feat('coop');
  if (!G.stageLost) feat('ghost');
  if (mutN()) feat('mut1');
  if (modOn('brawl')) feat('knuckles');
  const deb = {
    stage: G.stage,
    title: C ? C.title : 'the job',
    done: !!(C && C.done),
    creds: 0,
    karma: 0,
    prize: null,
    levels: 0
  };
  if (deb.done) {
    deb.creds = def.creds;
    deb.karma = def.karma;
    if (modOn('pacifist') && !G.gunUsed) {
      deb.karma *= 2;
      deb.pacifist = true;
      feat('pacifist');
    }
    PARTY.creds += def.creds;
    if (def.prize) {
      deb.prize = randItem(3, true);
    }
  }
  PARTY.contract = null;
  const l0 = PL[0].lvl;
  if (deb.karma)
    for (const p of PL) {
      p.karma += deb.karma;
      while (p.karma >= karmaNext(p.lvl)) {
        p.karma -= karmaNext(p.lvl);
        p.lvl++;
        p.pts += 2;
        p.spts = (p.spts || 0) + 1;
      }
      refresh(p);
    }
  deb.levels = PL[0].lvl - l0;
  if (deb.prize) {
    const pz = deb.prize;
    pz.rar = 2;
    pz.name = 'Prototype ' + BASES[pz.slot][pz.base].name;
    if (PARTY.bag.length < BAG_MAX) PARTY.bag.push(gotItem(pz));
  }
  G.debrief = deb;
  G.texts.push({ x: G.camX + W / 2, y: 150, z: 0, s: 'DISTRICT CLEAR', c: '#ffc63d', life: 90, big: true });
  G.outro = 90;
  G.afterOutro = () => {
    if (G.stage >= STAGES.length - 1) {
      feat('win');
      if (G.coop) feat('coopwin');
      if (G.diff === 2) feat('prime');
      if (mutN() >= 3) feat('mut3');
      logRun('Campaign', 'Won');
      store.del('cs_save3');
      musicPlay('title');
      setMode('win');
      return;
    }
    for (const p of PL) {
      p.hp = Math.min(p.maxHp, p.hp + Math.round(p.maxHp * 0.4));
      p.mp = p.maxMp;
    }
    G.stock = [
      randItem(G.stage + 1, false),
      randItem(G.stage + 1, false),
      randItem(G.stage + 1, true),
      randItem(G.stage, false),
      randItem(G.stage + 1, false)
    ];
    enterDen();
  };
}

// Elites, readable at a glance. Each modifier has its own look, not just a coloured halo:

        const d = Math.abs(tr[i] - e.x);

// The half of the rune ring behind the body (back) or in front of it

// In front of the figure: rune ring front half, ward ripples, ricochet sparks, the vampiric drain stream,
// berserk steam
function drawEliteFront(e) {

    sx = e.x - G.camX,
    sy = e.y - e.z,
    sc = (e.d && e.d.scale) || 1,
    lite = lowFx();
  if (e.elite === 'warded') {
    drawRunes(e, sx, sy, sc, c, false);
    const w = G.t - (e.wardT === undefined ? -99 : e.wardT);

      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else if (e.elite === 'armored') {
    const w = G.t - (e.pingT === undefined ? -99 : e.pingT);
    if (w >= 0 && w < 8) {
      const k = 1 - w / 8,
        y = sy - 28 * sc;

      ctx.globalAlpha = k;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = -0.6 - i * 0.7;

        ctx.lineTo(sx + Math.cos(a) * (6 + w * 1.5), y + Math.sin(a) * (6 + w * 1.5));
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    const w = G.t - (e.drainT === undefined ? -99 : e.drainT);

      // motes flowing from the runner it just bit back into its chest
      const k = w / 24,

        y0 = e.drainY - 26,
        x1 = sx,
        y1 = sy - 26 * sc;

        const t = Math.min(1, k * 1.6 - i * 0.08);

    const k = (G.t % 40) / 20;

function attractStep() {
  G.t++;
  for (const r of G.rain) {
    r.y += r.s;
    r.x -= 1.2;
    if (r.y > H) {
      r.y = -10;
      r.x = rand(0, W + 40);
    }
  }
  const P = PL[0];
  for (const e of G.ents) {
    e.t++;

      e.walk += 0.4;
      if (e.state !== 'walk') e.state = 'walk';
    }

// Street shops: a back-alley clinic (rare cyberware) or a talisman shop (rare spells)
// Selling, at any counter. Ratchet is a fence and pays the full rate (and can scrap gear for parts); the clinics
// and talisman shops will take gear off your hands too, for three quarters of that. Grouped by slot,
// best first, each line showing how it compares with what the runner on this tab has equipped.
// lock toggle shown on every bag line; a locked item keeps its name marked so it's obvious in long lists
const lockName = it => (it.lock ? '🔒 ' : '') + esc(it.name) + newTag(it);
const lockBtn = it =>
  `<button class="btn sm ghost" data-a="lock:${it.uid}" aria-pressed="${!!it.lock}" aria-label="${it.lock ? 'Unlock' : 'Lock'} ${esc(it.name)}">${it.lock ? 'Unlock' : 'Lock'}</button>`;

const sellPrice = (it, kind) => Math.max(1, Math.round(it.price * storeRate(kind)));
function sellHtml(kind) {
  const p = PL[G.sheetIdx] || PL[0],
    fence = kind === 'fence',
    bag = PARTY.bag,
    pct = Math.round(storeRate(kind) * 100);
  if (!bag.length) return `<h3>Sell</h3><p>Nothing in the bag to sell.</p>`;
  const commons = bag.filter(it => it.rar === 0 && !it.lock),

    case 'day1':

      break;

      keep = false;
      break;
    case 'week1':

          () => done(true),

/* ===== src/js/pwa.js ===== */
/* Cyber City Tactics · src/js/pwa.js
 * Everything that makes the game behave like an installed app:
 *  - registers the service worker (sw.js) and shows an "update ready" bar when a new version has downloaded
 *  - captures the browser's install prompt so Settings and the title screen can offer "Install app"
 *  - asks the browser to keep saves from being evicted (persistent storage)
 *  - save backups: export every save to a JSON file and import it on another device
 *  - app shortcuts: ?go=daily, ?go=arena, ?go=sprawl or ?go=codex open that screen on launch
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */

const PWA = {
  deferred: null, // the saved beforeinstallprompt event
  waiting: null, // a new service worker that has installed and is waiting to take over
  installed:
    matchMedia('(display-mode: standalone)').matches ||
    matchMedia('(display-mode: fullscreen)').matches ||
    navigator.standalone === true,
  // No service worker inside the claude.ai preview, and none on localhost unless ?sw=1 (so edits show up
  // instantly while developing). GitHub Pages and other https hosts always get it.
  canSW:
    typeof BUNDLED === 'undefined' &&
    'serviceWorker' in navigator &&
    !/claude\.ai|claudeusercontent/.test(location.hostname) &&
    (location.protocol === 'https:' ||
      (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]sw=1/.test(location.search)))
};
const isIOS = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ---------- install ---------- */
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  PWA.deferred = e;
  if (['title', 'settings'].includes(G.mode)) renderOv();
});
addEventListener('appinstalled', () => {
  PWA.deferred = null;
  PWA.installed = true;
  if (['title', 'settings'].includes(G.mode)) renderOv();
});
async function pwaInstall() {
  const e = PWA.deferred;
  if (!e) return;
  PWA.deferred = null;
  try {
    e.prompt();
    await e.userChoice;
  } catch (err) {}
  renderOv();
}
/** The install part of the Settings screen. */
function pwaSettingsRows(row) {
  let install;
  if (PWA.installed)
    install = row(
      'App',
      'Installed. It works offline and saves stay on this device.',
      '<span class="ds">✓ Installed</span>'
    );
  else if (PWA.deferred)
    install = row(
      'Install the app',
      'Full screen, its own icon, and it works offline',
      '<button class="btn sm" data-a="install">Install</button>'
    );
  else if (isIOS())
    install = row(
      'Install the app',
      'In Safari, tap Share, then “Add to Home Screen”.',
      '<span class="ds">Safari</span>'
    );
  else
    install = row(
      'Install the app',
      'Use your browser menu: “Install app” or “Add to Home screen”.',
      '<span class="ds">Browser menu</span>'
    );
  const imp = G.importData
    ? `<div class="job" style="border-color:var(--gold)"><b>Replace your saves with this backup?</b><span style="color:var(--muted);font-size:13px">Backup from ${esc(G.importData.date || 'an unknown date')} · ${Object.keys(G.importData.data).length} save slots. Everything on this device is replaced and the game restarts.</span>
      <div class="row"><button class="btn sm" data-a="importok">Replace and restart</button><button class="btn sm ghost" data-a="importno">Cancel</button></div></div>`
    : G.importErr
      ? `<p class="say"><b>Import failed</b>${esc(G.importErr)}</p>`
      : '';
  // The claude.ai preview can't download or pick files, so backups are only offered on the real site.
  if (/claude\.ai|claudeusercontent/.test(location.hostname)) return install;
  return (
    install +
    row(
      'Save backup',
      'Download every save (campaign, Sprawl, Arena scores, your legend) as a file, or load one from another device',
      '<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ghost" data-a="export">Export</button><button class="btn sm ghost" data-a="import">Import</button></span>'
    ) +
    imp +
    `<p class="ds" style="margin-top:8px">Version ${esc(typeof APP_VERSION !== 'undefined' ? APP_VERSION : 'dev')}${PWA.waiting ? ' · update ready' : ''}</p>`
  );
}

/* ---------- service worker and updates ---------- */
const updBar = document.getElementById('updBar');
function pwaRegister() {
  if (!PWA.canSW) return;
  navigator.serviceWorker
    .register('sw.js')
    .then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) PWA.waiting = reg.waiting;
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w)
          w.addEventListener('statechange', () => {
            // Only prompt when an older version is already in charge; the very first install needs no reload.
            if (w.state === 'installed' && navigator.serviceWorker.controller) PWA.waiting = w;
          });
      });
      const check = () => reg.update().catch(() => {});
      setInterval(check, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) check();
      });
    })
    .catch(() => {});

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || !PWA.applying) return;
    reloading = true;
    location.reload();
  });
}
/** Save what can be saved, then let the waiting worker take over (which reloads the page). */
function pwaApplyUpdate() {
  try {
    saveLeg();
    if (G.world && G.wd) saveWorld();
  } catch (err) {}
  PWA.applying = true;
  if (PWA.waiting) PWA.waiting.postMessage({ type: 'SKIP_WAITING' });
  else location.reload();
}
// Show the update bar only between fights, never in the middle of one.
setInterval(() => {
  if (!updBar) return;
  const show = !!PWA.waiting && G.mode !== 'play' && G.mode !== 'den' && G.mode !== 'hack';
  if (updBar.hidden === show) updBar.hidden = !show;
}, 500);
if (updBar)
  updBar.addEventListener('click', e => {
    const a = e.target.closest('[data-u]');
    if (!a) return;
    if (a.dataset.u === 'go') pwaApplyUpdate();
    else {
      PWA.waiting = null;
      updBar.hidden = true;
    }
  });

/* ---------- storage ---------- */
// Ask once, after the player has done something, for storage the browser won't clear under pressure.
addEventListener(
  'pointerdown',
  () => {
    try {
      if (navigator.storage && navigator.storage.persist)
        navigator.storage.persisted().then(p => {
          if (!p) navigator.storage.persist();

  { once: true }
);

  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(SAVE_PREFIX)) data[k] = localStorage.getItem(k);
    }
  } catch (err) {}
  const date = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({ app: 'cyber-city-tactics', v: 1, date, data }, null, 1)], {
    type: 'application/json'
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cyber-city-tactics-save-${date}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1000);
}
function pwaImportPick() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    f.text().then(t => pwaImportText(t));
  };
  inp.click();
}
/** Validate a backup file's text; on success the Settings screen asks for confirmation. */
function pwaImportText(t) {
  G.importData = null;
  G.importErr = null;
  try {
    const o = JSON.parse(t);
    if (!o || o.app !== 'cyber-city-tactics' || !o.data || typeof o.data !== 'object')
      throw new Error('not a backup');
    const keys = Object.keys(o.data).filter(k => k.startsWith(SAVE_PREFIX) && typeof o.data[k] === 'string');
    if (!keys.length) throw new Error('empty');
    for (const k of keys) JSON.parse(o.data[k]); // every slot must be valid JSON
    G.importData = { date: o.date, data: Object.fromEntries(keys.map(k => [k, o.data[k]])) };
  } catch (err) {
    G.importErr = "That file isn't a Cyber City Tactics save backup.";
  }
  if (G.mode === 'settings') renderOv();
}
function pwaImportApply() {
  const d = G.importData;
  if (!d) return;
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(SAVE_PREFIX)) localStorage.removeItem(k);
    }
    for (const k in d.data) localStorage.setItem(k, d.data[k]);
  } catch (err) {}
  location.reload();
}

/* ---------- app shortcuts ---------- */
function pwaShortcut() {
  const qs = new URLSearchParams(location.search),
    sd = parseSeed(qs.get('seed'));
  if (sd) {
    // a shared challenge link: open the right start screen with the seed filled in
    G.seedPre = sd.code;
    setMode(sd.mode === 'arena' ? 'arenapick' : 'worldpick');
    try {
      history.replaceState(null, '', location.pathname);
    } catch (err) {}
    return;
  }
  const go = qs.get('go');
  const to = { daily: 'arenapick', arena: 'arenapick', sprawl: 'worldpick', codex: 'codex' }[go];
  if (!to) return;
  if (to === 'codex') G.cxTab = 'feats';
  setMode(to);
  try {
    history.replaceState(null, '', location.pathname);
  } catch (err) {}
}

/* ===== src/js/main.js ===== */
/* Cyber City Tactics · src/js/main.js
 * The fixed-timestep game loop and boot.
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */
/* ================= loop =================
 * Fixed timestep with interpolated rendering:
 *  - the game logic always steps at exactly 60 Hz (STEP), however fast or slow the screen refreshes, so
 *    speed, physics and timings are identical on a 30 Hz phone and a 144 Hz monitor;
 *  - frames between two logic steps draw positions blended between the last two steps (lerpRender), so
 *    motion stays smooth on 90/120/144 Hz screens instead of repeating frames;
 *  - after a stall (a background tab, a GC pause, a slow phone) at most MAX_STEPS steps catch up, and the
 *    rest of the backlog is dropped, so the game never fast-forwards or spirals;
 *  - an error in one frame is reported once and the loop keeps running.
 */
const STEP = 1000 / 60,
  MAX_STEPS = 8; // up to 133 ms of catch-up per frame: full speed down to about 8 fps
let last = performance.now(),
  acc = 0,
  tick = 0,
  loopErr = false;
function stepOnce() {
  tick++;
  snapPrev();
  let ran = true;
  if (G.mode === 'play' || G.mode === 'den') {
    if (G.stop > 0) {
      G.stop--;
      ran = false;
    } else if (G.slow > 0) {
      G.slow--;
      if (tick % 3 === 0) update();
      else ran = false;
    } else {
      update();
      if (tick % 4 === 0 && modOn('turbo') && G.mode === 'play') update();
    }
  } else if (G.mode === 'title') attractStep();
  else if (G.mode === 'hack') hackStep();
  // keep presses made during hit-stop or slow-mo frames until a frame actually processes them
  if (ran) for (const s of INP) for (const k in s.pressed) s.pressed[k] = false;
}
function frame(now) {
  requestAnimationFrame(frame); // first, so one bad frame can never stop the game
  try {
    const dt = Math.max(0, now - last);
    last = now;
    perfSample(dt);
    acc += Math.min(dt, 250);
    pollPads();
    let n = 0;
    while (acc >= STEP && n < MAX_STEPS) {
      stepOnce();
      acc -= STEP;
      n++;
    }
    if (acc >= STEP) acc = acc % STEP; // drop the backlog instead of fast-forwarding
    lerpRender(acc / STEP);
    if (tick % 6 === 0) updateTouchUI();
  } catch (err) {
    if (!loopErr) {
      loopErr = true;
      console.error('Cyber City Tactics frame error', err);
    }
  }
}
// Coming back to the tab: start timing fresh so there's no catch-up burst.
document.addEventListener('visibilitychange', () => {
  last = performance.now();
  acc = 0;
});
applyPrefs();
fit();
attract();
setMode('title');
musicPlay('title');
last = performance.now();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
setTimeout(fit, 300);
pwaRegister();
pwaShortcut();

})();
</script>
