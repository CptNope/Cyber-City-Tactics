<title>Chrome &amp; Sorcery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>
/* Layout: one-screen arcade cabinet — canvas fills the stage, touch pad below (portrait) or over the stage (landscape). Single dark look by design. */
:root{
  --ink:#0c0a14; --panel:#17121f; --line:#30283f; --text:#efe9ff; --muted:#a79dc2;
  --neon:#ff3d8b; --mana:#45d2ff; --gold:#ffc63d;
  --font-d:'Teko',Impact,'Arial Narrow',sans-serif;
  --font-b:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--font-b);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;position:relative}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#game{display:block;background:#000;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
#pauseBtn{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:rgba(23,18,31,.7);color:var(--text);font:600 15px var(--font-b);cursor:pointer}
#pauseBtn:focus-visible,.btn:focus-visible{outline:2px solid var(--mana);outline-offset:2px}

#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(12,10,20,.86);z-index:5}
.card{width:100%;max-width:540px;max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.card h1{font:600 clamp(48px,11vw,84px)/.82 var(--font-d);margin:0;letter-spacing:.01em;color:var(--text);text-shadow:-3px 0 var(--neon),3px 0 var(--mana);text-wrap:balance}
.card h2{font:600 clamp(34px,7vw,52px)/.9 var(--font-d);margin:0;letter-spacing:.02em;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
.card p{margin:0;line-height:1.5;color:var(--muted);max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 14px var(--font-b);letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border-radius:6px;border:1px solid var(--neon);background:var(--neon);color:#16040c;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--muted)}
.keys b{color:var(--text);font-weight:600}
.shop{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.item .nm{font-weight:600;color:var(--text)}
.item .ds{font-size:12.5px;color:var(--muted)}
.item .btn{padding:8px 12px;min-width:84px;font-variant-numeric:tabular-nums}
.wallet{font:600 28px var(--font-d);color:var(--gold);font-variant-numeric:tabular-nums}

#pad{display:none;justify-content:space-between;align-items:center;gap:12px;padding-block:10px 6px}
body.touch #pad{display:flex}
#stick{width:132px;height:132px;flex:none;border-radius:50%;border:2px solid var(--line);background:rgba(23,18,31,.6);position:relative;touch-action:none}
#knob{width:56px;height:56px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);position:absolute;left:36px;top:36px;pointer-events:none}
#btns{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:10px}
.tb{border-radius:50%;border:2px solid var(--neon);background:rgba(255,61,139,.14);color:var(--text);font:600 11.5px var(--font-b);letter-spacing:.04em;touch-action:none;padding:0}
.tb.on{background:rgba(255,61,139,.45)}
.tb.gun{border-color:var(--gold);background:rgba(255,198,61,.12)}
.tb.spell{border-color:var(--mana);background:rgba(69,210,255,.12)}
.tb.jump{border-color:var(--muted);background:rgba(167,157,194,.12)}
@media (orientation:landscape){
  body.touch #pad{position:absolute;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));pointer-events:none;opacity:.85}
  body.touch #pad>*{pointer-events:auto}
}
@media (max-width:380px){#btns{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px)}#stick{width:116px;height:116px}#knob{left:28px;top:28px}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Chrome and Sorcery game screen"></canvas>
    <button id="pauseBtn" aria-label="Pause">II</button>
    <div id="ov"></div>
  </div>
  <div id="pad" aria-hidden="true">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button class="tb gun" data-act="gun">GUN</button>
      <button class="tb spell" data-act="spell">SPELL</button>
      <button class="tb jump" data-act="jump">JUMP</button>
      <button class="tb" data-act="punch">PUNCH</button>
      <button class="tb" data-act="kick">KICK</button>
      <button class="tb jump" data-act="pause">||</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=270,FY0=170,FY1=262;
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const ov=document.getElementById('ov');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let SCALE=1;

function fit(){
  const r=document.getElementById('stage').getBoundingClientRect();
  let w=r.width,h=w*H/W; if(h>r.height){h=r.height;w=h*W/H;}
  w=Math.max(120,Math.floor(w));h=Math.max(68,Math.floor(h));
  cvs.style.width=w+'px';cvs.style.height=h+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);SCALE=cvs.width/W;
}
addEventListener('resize',fit);

/* ---------- utils ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function srng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- audio ---------- */
let muted=false;
const A={ac:null,
  unlock(){if(!this.ac){try{this.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ac&&this.ac.state==='suspended')this.ac.resume();},
  tone(f,d,type,v,slide){const a=this.ac;if(!a||muted)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);},
  noise(d,v,cut){const a=this.ac;if(!a||muted)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut||2400;g.gain.value=v||.12;s.connect(f).connect(g).connect(a.destination);s.start(t);}
};
const sfx={
  hit(){A.noise(.07,.18,1800);A.tone(160,.08,'square',.05,-80)},
  heavy(){A.noise(.14,.25,900);A.tone(110,.15,'square',.07,-60)},
  whiff(){A.noise(.05,.05,4000)},
  shot(){A.noise(.13,.22,3200);A.tone(520,.07,'square',.04,-420)},
  click(){A.tone(1400,.03,'square',.03)},
  spell(){A.tone(260,.35,'sawtooth',.05,700);A.tone(390,.35,'triangle',.04,900)},
  boom(){A.noise(.35,.3,700);A.tone(90,.3,'sawtooth',.06,-50)},
  coin(){A.tone(988,.06,'square',.04);setTimeout(()=>A.tone(1480,.1,'square',.04),55)},
  jump(){A.tone(300,.12,'triangle',.05,250)},
  hurt(){A.tone(220,.18,'sawtooth',.06,-140)},
  zap(){A.tone(880,.12,'sawtooth',.035,-600)},
  buy(){A.tone(660,.07,'square',.04);setTimeout(()=>A.tone(990,.12,'square',.04),70)}
};

/* ---------- input ---------- */
const held={},pressed={};
const KEY={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  KeyJ:'punch',KeyZ:'punch',KeyK:'kick',KeyX:'kick',Space:'jump',KeyL:'jump',KeyC:'jump',KeyU:'gun',KeyV:'gun',KeyI:'spell',KeyB:'spell',Escape:'pause',KeyP:'pause'};
function press(a){if(!held[a])pressed[a]=true;held[a]=true;A.unlock();if(a==='pause')togglePause();}
function release(a){held[a]=false;}
addEventListener('keydown',e=>{const a=KEY[e.code];if(!a)return;if(G.mode!=='play'&&a!=='pause')return;e.preventDefault();if(e.repeat)return;press(a);});
addEventListener('keyup',e=>{const a=KEY[e.code];if(a)release(a);});
addEventListener('blur',()=>{for(const k in held)held[k]=false;});

function enableTouch(){document.body.classList.add('touch');fit();}
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
addEventListener('touchstart',enableTouch,{once:true,passive:true});

const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null,sc={x:0,y:0};
function stickSet(dx,dy){const R=40,m=Math.hypot(dx,dy);if(m>R){dx=dx/m*R;dy=dy/m*R;}knob.style.transform=`translate(${dx}px,${dy}px)`;const dz=11;
  const L=dx<-dz,Rr=dx>dz,U=dy<-dz,D=dy>dz;held.left=L;held.right=Rr;held.up=U;held.down=D;}
stick.addEventListener('pointerdown',e=>{e.preventDefault();A.unlock();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);const r=stick.getBoundingClientRect();sc={x:r.left+r.width/2,y:r.top+r.height/2};stickSet(e.clientX-sc.x,e.clientY-sc.y);});
stick.addEventListener('pointermove',e=>{if(e.pointerId!==stickId)return;stickSet(e.clientX-sc.x,e.clientY-sc.y);});
const stickEnd=e=>{if(e.pointerId!==stickId)return;stickId=null;stickSet(0,0);};
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
document.querySelectorAll('.tb').forEach(b=>{const a=b.dataset.act;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');press(a);});
  const up=()=>{b.classList.remove('on');release(a);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.getElementById('pauseBtn').addEventListener('click',()=>togglePause());

/* ---------- content ---------- */
const PAL={
  player:{skin:'#e0b08f',coat:'#1f4a52',coat2:'#163a40',pants:'#262033',hair:'#191420',acc:'#ff3d8b',boot:'#0e0b14',cyber:'#9fe9ff'},
};
const DEF={
  ganger:{name:'Ganger',hp:28,spd:.85,dmg:5,reach:22,cool:72,scale:1,creds:[6,14],style:'mohawk',pal:{skin:'#c98a6b',coat:'#3d2f52',coat2:'#2c2240',pants:'#22324a',hair:'#ff3d8b',acc:'#ffc63d',boot:'#141018'}},
  orc:{name:'Orc bruiser',hp:56,spd:.7,dmg:9,reach:24,cool:86,scale:1.15,creds:[12,22],style:'tusks',pal:{skin:'#7d9a5a',coat:'#5a3030',coat2:'#432222',pants:'#2b2b2b',hair:'#141414',acc:'#ece4c6',boot:'#141010'}},
  sec:{name:'Corp security',hp:34,spd:.8,dmg:8,reach:22,cool:115,scale:1,ranged:'bullet',range:135,creds:[14,24],style:'helmet',pal:{skin:'#d6a37f',coat:'#2b4a7a',coat2:'#1f3860',pants:'#1c2a44',hair:'#a9dcff',acc:'#a9dcff',boot:'#10141e'}},
  shaman:{name:'Street shaman',hp:30,spd:.75,dmg:10,reach:20,cool:150,scale:1,ranged:'hex',range:150,creds:[16,26],style:'feathers',pal:{skin:'#b58b6e',coat:'#5b2f7a',coat2:'#46225f',pants:'#3a1f4f',hair:'#ece4c6',acc:'#45d2ff',boot:'#1a1020'}},
  drone:{name:'Drone',hp:18,spd:1.1,dmg:6,reach:0,cool:125,scale:1,ranged:'bullet',range:120,fly:true,creds:[10,18]},
  troll:{name:'Gutter King',hp:210,spd:.75,dmg:14,reach:30,cool:80,scale:1.45,boss:true,charge:3.2,creds:[90,120],style:'horns',pal:{skin:'#8a7ea6',coat:'#5a3a2a',coat2:'#432a1e',pants:'#2a2420',hair:'#ece4c6',acc:'#ff6a3d',boot:'#16110e'}},
  blade:{name:'Razor Mei',hp:190,spd:1.15,dmg:12,reach:26,cool:55,scale:1.08,boss:true,charge:4.4,creds:[110,140],style:'blade',pal:{skin:'#e3b896',coat:'#2a2a33',coat2:'#1c1c24',pants:'#15151b',hair:'#f2f2f7',acc:'#ff3d8b',boot:'#0b0b10'}},
  archmage:{name:'Director Voss',hp:260,spd:.8,dmg:12,reach:24,cool:100,scale:1.12,boss:true,ranged:'hex3',range:160,teleport:true,creds:[0,0],style:'mage',pal:{skin:'#d9c2b0',coat:'#e9e4f2',coat2:'#bdb4d0',pants:'#2b2540',hair:'#4a3d6b',acc:'#ffc63d',boot:'#1a1426'}}
};
const STAGES=[
  {name:'Rustline Barrens',sub:'Gang turf under the dead monorail',len:1500,sky:['#1d1033','#4a1a3a'],moon:'#ff9f6b',far:'#241838',near:'#2f2140',win:'#ffb36b',wall:'#1d1626',ground:['#2a2134','#17121f'],line:'#3a2d48',rain:true,
    signs:[['NOODLE','#ff3d8b'],['PAWN','#ffc63d'],['24H','#45d2ff'],['SOYCAF','#ff6a3d'],['TALISMAN','#b98cff']],
    waves:[{at:110,spawn:['ganger','ganger']},{at:400,spawn:['ganger','orc','ganger']},{at:700,spawn:['shaman','ganger','ganger']},{at:960,spawn:['orc','ganger','orc','ganger']},{at:1020,boss:true,spawn:['troll','ganger']}]},
  {name:'Neon Market',sub:'Black clinics and street docs, three levels deep',len:1700,sky:['#071a2a','#123a4a'],moon:'#9ff0ff',far:'#0e2434',near:'#15303f',win:'#6cf2ff',wall:'#0f1c26',ground:['#152733','#0b141b'],line:'#203a48',rain:true,
    signs:[['CYBERDOC','#45d2ff'],['RAMEN','#ff3d8b'],['CHIPS','#ffc63d'],['MOJO','#b98cff'],['GUNS','#ff6a3d']],
    waves:[{at:120,spawn:['ganger','sec']},{at:420,spawn:['drone','ganger','orc']},{at:740,spawn:['sec','sec','ganger']},{at:1000,spawn:['shaman','orc','drone']},{at:1220,boss:true,spawn:['blade','drone']}]},
  {name:'Kagemori Arcology',sub:'Top floor. The Director is waiting.',len:1700,sky:['#120e1c','#2a2440'],moon:'#ffc63d',far:'#1b1730',near:'#262040',win:'#ffe2a0',wall:'#1a1626',ground:['#2a2536','#14111d'],line:'#3a3350',rain:false,
    signs:[['KAGEMORI','#ffc63d'],['SECURE','#45d2ff'],['LAB 7','#ff3d8b'],['AUTHORIZED','#ffc63d']],
    waves:[{at:120,spawn:['sec','sec','drone']},{at:430,spawn:['shaman','sec','orc']},{at:760,spawn:['drone','drone','sec','orc']},{at:1040,spawn:['shaman','shaman','sec']},{at:1220,boss:true,spawn:['archmage','sec']}]}
];

const SHOP=[
  {id:'med',name:'Trauma patch',desc:'Restore 50 HP.',cost:()=>30,can:p=>p.hp<p.maxHp,buy:p=>{p.hp=Math.min(p.maxHp,p.hp+50)}},
  {id:'ammo',name:'Ammo clip',desc:'+12 rounds for the heavy pistol.',cost:()=>25,can:()=>true,buy:p=>{p.ammo+=12}},
  {id:'mana',name:'Mana vial',desc:'Refill your mana.',cost:()=>25,can:p=>p.mp<p.maxMp,buy:p=>{p.mp=p.maxMp}},
  {id:'arm',name:'Cyberarm tune-up',desc:'+3 punch and kick damage.',cost:p=>90+p.arm*60,can:p=>p.arm<3,buy:p=>{p.arm++},lvl:p=>p.arm},
  {id:'focus',name:'Power focus',desc:'Fireball hits harder and costs 3 less mana.',cost:p=>110+p.focus*70,can:p=>p.focus<3,buy:p=>{p.focus++},lvl:p=>p.focus},
  {id:'plate',name:'Dermal plating',desc:'+20 max HP.',cost:p=>100+p.plate*60,can:p=>p.plate<3,buy:p=>{p.plate++;p.maxHp+=20;p.hp+=20},lvl:p=>p.plate}
];

/* ---------- state ---------- */
const G={mode:'title',prev:null,stage:0,camX:0,lock:null,wave:0,waveLive:false,ents:[],projs:[],parts:[],texts:[],picks:[],shake:0,stop:0,t:0,banner:0,goT:0,exitOpen:false,bg:null,rain:[]};
let P=null;

function newPlayer(){return{kind:'player',team:0,pal:PAL.player,x:60,y:220,z:0,vx:0,vz:0,face:1,state:'idle',t:0,walk:0,inv:0,flash:0,
  hp:100,maxHp:100,mp:60,maxMp:60,ammo:12,creds:0,lives:3,arm:0,focus:0,plate:0,combo:0,lastPunch:-99,hits:0,lastHit:0,dead:false};}
function playerSave(){return{stage:G.stage,hp:P.hp,maxHp:P.maxHp,mp:P.mp,ammo:P.ammo,creds:P.creds,lives:P.lives,arm:P.arm,focus:P.focus,plate:P.plate};}

function genBg(si){
  const S=STAGES[si],r=srng(1000+si*77);const far=[],near=[];
  let x=-40;while(x<S.len*.25+W+60){const w=24+r()*46,h=50+r()*95;const wins=[];for(let wy=8;wy<h-6;wy+=9)for(let wx=5;wx<w-6;wx+=8)if(r()<.22)wins.push([wx,wy]);far.push({x,w,h,wins});x+=w+2+r()*6;}
  x=-60;let si2=0;while(x<S.len*.55+W+80){const w=56+r()*70,h=70+r()*80;const wins=[];for(let wy=10;wy<h-8;wy+=12)for(let wx=7;wx<w-8;wx+=11)if(r()<.3)wins.push([wx,wy]);
    const b={x,w,h,wins};if(r()<.7){const sg=S.signs[si2++%S.signs.length];b.sign={t:sg[0],c:sg[1],vert:r()<.35,dx:6+r()*(w-50),dy:12+r()*(h*.4)};}near.push(b);x+=w+10+r()*30;}
  return{far,near};
}

function startStage(si,fresh){
  G.stage=si;G.camX=0;G.lock=null;G.wave=0;G.waveLive=false;G.ents=[];G.projs=[];G.parts=[];G.texts=[];G.picks=[];G.exitOpen=false;G.banner=150;G.goT=0;
  G.bg=genBg(si);
  P.x=50;P.y=222;P.z=0;P.vz=0;P.vx=0;P.state='idle';P.t=0;P.inv=60;P.dead=false;P.face=1;
  if(fresh){P.hp=P.maxHp;P.mp=P.maxMp;}
  G.ents.push(P);
  G.rain=[];if(STAGES[si].rain&&!RM)for(let i=0;i<70;i++)G.rain.push({x:rand(0,W),y:rand(0,H),s:rand(5,8)});
  store.set('cs_save',playerSave());
  setMode('play');
}

function spawnEnemy(kind,side){
  const d=DEF[kind],diff=1+G.stage*.18;
  const x=side<0?G.camX-24:G.camX+W+24;
  const e={kind,d,team:1,pal:d.pal,x,y:rand(FY0+8,FY1-6),z:d.fly?24:0,vx:0,vz:0,face:side<0?1:-1,state:'idle',t:0,walk:0,inv:0,flash:0,
    hp:Math.round(d.hp*diff),maxHp:Math.round(d.hp*diff),cool:rand(20,d.cool),hits:0,lastHit:0,yoff:rand(-5,5),hover:rand(0,6)};
  G.ents.push(e);return e;
}

/* ---------- combat ---------- */
function setS(e,s){e.state=s;e.t=0;e.didHit=false;}
function alive(e){return e.state!=='dead';}
function hurt(t,dmg,dir,o){
  o=o||{};
  if(t.state==='dead'||t.inv>0)return false;
  if(t.state==='down'&&!o.air)return false;
  t.hp-=dmg;t.flash=8;t.x+=dir*(o.kb||3);t.face=-dir;
  if(G.t-t.lastHit>50)t.hits=0;t.lastHit=G.t;t.hits++;
  burst(t.x,t.y,t.z+(t.d&&t.d.fly?0:28),o.col||'#fff3c4',o.big?14:7);
  G.texts.push({x:t.x,y:t.y,z:t.z+48,s:o.big?'KRAK!':dmg>=12?'WHAM!':'POW',c:o.col||(t.team?'#ffc63d':'#ff3d8b'),life:34});
  G.stop=o.big?6:3;G.shake=Math.max(G.shake,o.big?6:2);
  (o.big?sfx.heavy:sfx.hit)();
  if(t.hp<=0){kill(t,dir);return true;}
  const boss=t.d&&t.d.boss;
  if(boss){ if(o.kd&&Math.random()<.35){setS(t,'down');t.vz=2.2;t.vx=dir*1.6;t.hits=0;} return true;}
  if(t.d&&t.d.fly){t.x+=dir*6;return true;}
  if(o.kd||t.hits>=3){setS(t,'down');t.vz=2.8;t.vx=dir*2.2;t.hits=0;if(t===P)sfx.hurt();}
  else{setS(t,'hurt');if(t===P)sfx.hurt();}
  return true;
}
function kill(t,dir){
  setS(t,'dead');t.vz=3.2;t.vx=dir*2.6;t.hp=0;
  if(t===P){P.dead=true;return;}
  const d=t.d;
  G.texts.push({x:t.x,y:t.y,z:t.z+60,s:d.boss?'FLATLINED':'DOWN',c:'#efe9ff',life:50});
  const c=ri(d.creds[0],d.creds[1]);
  if(c>0)G.picks.push({k:'cred',v:c,x:t.x,y:clamp(t.y,FY0+4,FY1),t:0});
  const r=Math.random();
  if(r<.14)G.picks.push({k:'med',x:t.x+10,y:clamp(t.y+4,FY0+4,FY1),t:0});
  else if(r<.26)G.picks.push({k:'ammo',x:t.x-10,y:clamp(t.y+4,FY0+4,FY1),t:0});
  else if(r<.36)G.picks.push({k:'mana',x:t.x+6,y:clamp(t.y-4,FY0+4,FY1),t:0});
  if(d.boss){G.shake=10;burst(t.x,t.y,30,'#ffc63d',30);}
}
function inZ(att,t){const tz=t.d&&t.d.fly?t.z-12:t.z;return tz<=att.z+14&&tz>=att.z-30;}
function strike(att,reach,dmg,o){
  let hit=false;
  for(const t of G.ents){
    if(t.team===att.team||t.state==='dead')continue;
    if(t.state==='down'&&!(o&&o.air))continue;
    const sc=(t.d&&t.d.scale)||1;const dx=(t.x-att.x)*att.face;
    if(dx<-6||dx>reach+6*sc)continue;
    if(Math.abs(t.y-att.y)>9*sc)continue;
    if(!inZ(att,t))continue;
    if(hurt(t,dmg,att.face,o))hit=true;
    if(o&&o.single)break;
  }
  return hit;
}
function hitbox(t){const sc=(t.d&&t.d.scale)||1;if(t.d&&t.d.fly)return[t.z-10,t.z+12];return[t.z+2,t.z+46*sc];}

/* ---------- particles ---------- */
function burst(x,y,z,col,n){if(RM)n=Math.ceil(n/2);for(let i=0;i<n;i++)G.parts.push({x,y,z,vx:rand(-2,2),vy:rand(-.4,.4),vz:rand(.5,3),life:ri(14,26),c:col,sz:rand(1,2.4)});}

/* ---------- player ---------- */
function physics(e){
  const fly=e.d&&e.d.fly&&e.state!=='dead';
  if(fly)return;
  if(e.z>0||e.vz!==0){e.vz-=.28;e.z+=e.vz;e.x+=e.vx;if(e.z<=0){e.z=0;e.vz=0;e.vx=0;}}
}
function upPlayer(){
  const p=P;p.t++;if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;
  const wasAir=p.z>0;
  physics(p);
  if(p.mp<p.maxMp&&G.t%40===0)p.mp++;
  if(p.state==='dead'){if(p.t>100)respawn();return;}
  if(p.state==='down'){if(p.t>50){setS(p,'idle');p.inv=60;}return;}
  if(p.state==='hurt'){if(p.t>15)setS(p,'idle');return;}
  if((p.state==='jump'||p.state==='jkick')&&wasAir&&p.z===0){setS(p,'idle');}
  const busy={punch:13,upper:20,kick:20,shoot:13,cast:24};
  if(busy[p.state]){
    const t=p.t,dmgB=p.arm*3;
    if(p.state==='punch'&&t===4){if(!strike(p,22,6+dmgB,{}))sfx.whiff();}
    if(p.state==='upper'&&t===6){if(!strike(p,24,11+dmgB,{kd:true,kb:6}))sfx.whiff();}
    if(p.state==='kick'&&t===7){if(!strike(p,30,9+dmgB,{kb:7}))sfx.whiff();}
    if(p.state==='shoot'&&t===3)fireBullet(p,1,16,p.z+27);
    if(p.state==='cast'&&t===10)fireBall(p);
    if(t>=busy[p.state])setS(p,'idle');
    return;
  }
  // free movement
  let dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0);
  const air=p.z>0||p.vz>0;
  p.x+=dx*(air?1.9:1.75);p.y+=dy*(air?.6:1.1);
  if(dx)p.face=dx;
  if(p.state==='jkick'&&!p.didHit){if(strike(p,26,10+p.arm*3,{kd:true,air:true,kb:6}))p.didHit=true;}
  if(!air){
    if(pressed.jump){p.vz=4.7;setS(p,'jump');sfx.jump();}
    else if(pressed.punch){if(G.t-p.lastPunch<30)p.combo++;else p.combo=1;p.lastPunch=G.t;if(p.combo>=3){p.combo=0;setS(p,'upper');}else setS(p,'punch');}
    else if(pressed.kick){setS(p,'kick');}
    else if(pressed.gun){if(p.ammo>0){setS(p,'shoot');}else{sfx.click();G.texts.push({x:p.x,y:p.y,z:56,s:'NO AMMO',c:'#ffc63d',life:40});}}
    else if(pressed.spell){const cost=20-p.focus*3;if(p.mp>=cost){p.mp-=cost;setS(p,'cast');sfx.spell();}else{sfx.click();G.texts.push({x:p.x,y:p.y,z:56,s:'NO MANA',c:'#45d2ff',life:40});}}
    else{const mv=dx||dy;if(mv){if(p.state!=='walk')setS(p,'walk');p.walk+=1;}else if(p.state!=='idle')setS(p,'idle');}
  }else if(p.state==='jump'&&(pressed.punch||pressed.kick)){p.state='jkick';p.didHit=false;}
  p.y=clamp(p.y,FY0+6,FY1);p.x=clamp(p.x,G.camX+10,G.camX+W-10);
}
function respawn(){
  P.lives--;
  if(P.lives<0){P.lives=0;setMode('over');return;}
  P.hp=P.maxHp;P.mp=Math.max(P.mp,30);setS(P,'idle');P.dead=false;P.inv=120;P.z=30;P.vz=0;P.vx=0;
  for(const e of G.ents)if(e.team&&e.state!=='dead'&&Math.abs(e.x-P.x)<70)hurt(e,4,e.x>P.x?1:-1,{kd:true,kb:16});
  G.texts.push({x:P.x,y:P.y,z:70,s:'BACK IN',c:'#45d2ff',life:60});
}
function fireBullet(src,team,dmg,z){
  G.projs.push({k:'bullet',team:src.team,x:src.x+src.face*18,y:src.y,z,vx:src.face*6.2,vy:0,dmg,life:90});
  if(src===P){P.ammo--;sfx.shot();}else sfx.zap();
  burst(src.x+src.face*20,src.y,z,'#ffe28a',4);
}
function fireBall(p){
  G.projs.push({k:'fire',team:0,x:p.x+p.face*16,y:p.y,z:p.z+28,vx:p.face*3.8,vy:0,dmg:20+p.focus*7,life:130,r:6});
}

/* ---------- enemies ---------- */
function upEnemy(e,slot){
  e.t++;if(e.flash>0)e.flash--;
  physics(e);
  if(e.state==='dead'){if(e.d.fly&&e.z<=0){e.z=0;}if(e.t>70)e.gone=true;return;}
  if(e.state==='down'){if(e.t>58){setS(e,'idle');e.inv=24;}return;}
  if(e.state==='hurt'){if(e.t>14)setS(e,'idle');return;}
  if(e.inv>0)e.inv--;
  const d=e.d,p=P;
  if(d.fly){e.hover+=.08;e.z=24+Math.sin(e.hover)*3;}
  if(e.state==='windup'){
    if(e.t===16&&!strike(e,d.reach,d.dmg,{kd:d.boss,kb:d.boss?8:4,big:d.boss}))A.noise(.04,.04,3000);
    if(e.t>=28){setS(e,'idle');e.cool=d.cool*rand(.7,1.3);}return;
  }
  if(e.state==='aim'){
    if(e.t===22){
      if(d.ranged==='bullet')fireBullet(e,1,d.dmg,e.z+(d.fly?0:27));
      else{const n=d.ranged==='hex3'?3:1;for(let i=0;i<n;i++)G.projs.push({k:'hex',team:1,x:e.x+e.face*16,y:e.y+(n>1?(i-1)*14:0),z:e.z+30,vx:e.face*2.4,vy:0,dmg:d.dmg,life:170,r:5});sfx.zap();}
    }
    if(e.t>=34){setS(e,'idle');e.cool=d.cool*rand(.7,1.3);}return;
  }
  if(e.state==='charge'){
    e.x+=e.face*d.charge;e.walk+=2;
    if(!e.didHit&&strike(e,22,d.dmg+4,{kd:true,kb:10,big:true}))e.didHit=true;
    if(e.t>48||e.x<G.camX-30||e.x>G.camX+W+30){setS(e,'idle');e.cool=d.cool;e.x=clamp(e.x,G.camX-10,G.camX+W+10);}
    if(G.t%3===0)burst(e.x-e.face*10,e.y,4,'#8a7a9a',1);return;
  }
  if(e.state==='blink'){if(e.t===20){e.x=clamp(p.x+(Math.random()<.5?-1:1)*rand(110,150),G.camX+20,G.camX+W-20);e.y=clamp(p.y+rand(-12,12),FY0+8,FY1);burst(e.x,e.y,30,'#ffc63d',12);}if(e.t>=34)setS(e,'idle');return;}

  e.cool--;
  if(p.state==='dead'){setS(e,'idle');return;}
  const dx=p.x-e.x,dy=p.y-e.y,adx=Math.abs(dx),ady=Math.abs(dy);
  e.face=dx>=0?1:-1;
  let tx,ty=p.y+e.yoff*.4;
  if(d.ranged){
    if(d.teleport&&e.cool<=0&&adx<60&&Math.random()<.04){setS(e,'blink');e.cool=d.cool;sfx.spell();return;}
    if(adx<d.reach+4&&ady<8&&e.cool<=0&&!d.fly){setS(e,'windup');return;}
    if(ady<7&&adx<230&&adx>50&&e.cool<=0){setS(e,'aim');return;}
    tx=clamp(p.x-Math.sign(dx||1)*d.range,G.camX+24,G.camX+W-24);ty=p.y;
  }else{
    if(d.charge&&e.cool<=0&&ady<8&&adx>80&&adx<220&&Math.random()<.03){setS(e,'charge');sfx.heavy();return;}
    if(adx<d.reach+2&&ady<7&&e.cool<=0){setS(e,'windup');return;}
    const near=slot<2||d.boss;
    tx=p.x-Math.sign(dx||1)*(near?d.reach-4:70+slot*14);if(!near)tx=clamp(tx,G.camX+16,G.camX+W-16);ty=near?p.y:p.y+e.yoff*4;
  }
  const s=d.spd;let mx=clamp(tx-e.x,-s,s),my=clamp(ty-e.y,-s*.7,s*.7);
  if(Math.abs(tx-e.x)<1.2)mx=0;if(Math.abs(ty-e.y)<1)my=0;
  e.x+=mx;e.y+=my;e.y=clamp(e.y,FY0+6,FY1);
  if(mx||my){if(e.state!=='walk')setS(e,'walk');e.walk+=1;}else if(e.state!=='idle')setS(e,'idle');
  if(!d.boss&&e.x>G.camX-10&&e.x<G.camX+W+10)e.x=clamp(e.x,G.camX-10,G.camX+W+10);
}

/* ---------- world update ---------- */
function update(){
  G.t++;
  if(G.banner>0)G.banner--;else if(G.banner<0)G.banner++;
  if(G.goT>0&&!G.waveLive)G.goT--;
  upPlayer();
  // melee slots: nearest melee enemies get to engage
  const mel=G.ents.filter(e=>e.team&&e.state!=='dead'&&!e.d.ranged).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x));
  mel.forEach((e,i)=>e.slot=i);
  for(const e of G.ents)if(e.team)upEnemy(e,e.slot||0);
  G.ents=G.ents.filter(e=>!e.gone);

  for(const pr of G.projs){
    pr.x+=pr.vx;pr.life--;
    if(pr.k==='hex'&&P.state!=='dead'){pr.y+=clamp(P.y-pr.y,-.25,.25);if(G.t%3===0)G.parts.push({x:pr.x,y:pr.y,z:pr.z,vx:0,vy:0,vz:.3,life:14,c:'#45d2ff',sz:1.6});}
    if(pr.k==='fire'&&G.t%2===0)G.parts.push({x:pr.x-pr.vx,y:pr.y,z:pr.z+rand(-3,3),vx:-pr.vx*.1,vy:0,vz:rand(.2,.8),life:16,c:Math.random()<.5?'#ff6a3d':'#ffc63d',sz:2});
    if(pr.x<G.camX-30||pr.x>G.camX+W+30)pr.life=0;
    if(pr.life<=0)continue;
    for(const t of G.ents){
      if(t.team===pr.team||t.state==='dead'||t.state==='down'||t.inv>0)continue;
      if(Math.abs(t.y-pr.y)>9||Math.abs(t.x-pr.x)>11)continue;
      const hb=hitbox(t);if(pr.z<hb[0]||pr.z>hb[1])continue;
      if(pr.k==='fire'){explode(pr);}
      else hurt(t,pr.dmg,Math.sign(pr.vx),{kb:5,col:pr.k==='hex'?'#45d2ff':'#ffe28a',kd:pr.k==='hex'});
      pr.life=0;break;
    }
  }
  G.projs=G.projs.filter(p=>p.life>0);

  for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.z+=q.vz;q.vz-=.15;if(q.z<0){q.z=0;q.vz*=-.3;q.vx*=.6;}q.life--;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const tx of G.texts){tx.z+=.5;tx.life--;}
  G.texts=G.texts.filter(t=>t.life>0);

  for(const k of G.picks){k.t++;
    if(P.state!=='dead'&&P.z<12&&Math.abs(k.x-P.x)<13&&Math.abs(k.y-P.y)<10){k.got=true;
      if(k.k==='cred'){P.creds+=k.v;sfx.coin();G.texts.push({x:P.x,y:P.y,z:60,s:'+¥'+k.v,c:'#ffc63d',life:40});}
      if(k.k==='med'){P.hp=Math.min(P.maxHp,P.hp+35);sfx.buy();G.texts.push({x:P.x,y:P.y,z:60,s:'+35 HP',c:'#ff3d8b',life:40});}
      if(k.k==='ammo'){P.ammo+=6;sfx.buy();G.texts.push({x:P.x,y:P.y,z:60,s:'+6 AMMO',c:'#ffe28a',life:40});}
      if(k.k==='mana'){P.mp=Math.min(P.maxMp,P.mp+30);sfx.buy();G.texts.push({x:P.x,y:P.y,z:60,s:'+30 MANA',c:'#45d2ff',life:40});}
    }}
  G.picks=G.picks.filter(k=>!k.got&&k.t<1200);

  for(const r of G.rain){r.y+=r.s;r.x-=1.2;if(r.y>H){r.y=-10;r.x=rand(0,W+40);}}

  waves();camera();
  if(G.shake>0)G.shake*=.85;if(G.shake<.3)G.shake=0;
}
function waves(){
  const S=STAGES[G.stage];
  const foes=G.ents.filter(e=>e.team&&e.state!=='dead').length;
  if(G.waveLive&&foes===0){
    G.waveLive=false;G.lock=null;G.wave++;
    if(G.wave>=S.waves.length){G.exitOpen=true;}
    G.goT=150;
  }
  if(!G.waveLive&&G.wave<S.waves.length){
    const w=S.waves[G.wave];
    if(G.camX>=w.at-1){G.camX=w.at;G.lock=w.at;G.waveLive=true;
      w.spawn.forEach((k,i)=>{const e=spawnEnemy(k,i%2?-1:1);e.x+=(i>>1)*(i%2?-18:18);if(DEF[k].boss){e.x=G.camX+W-40;e.y=(FY0+FY1)/2;e.inv=40;}});
      if(w.boss)G.banner=-120;
    }
  }
  if(G.exitOpen&&P.x>S.len-24&&P.state!=='dead'){stageClear();}
}
function camera(){
  const S=STAGES[G.stage];
  let target=P.x-W*.4;
  const next=S.waves[G.wave];
  let max=S.len-W;
  if(G.lock!=null)max=G.lock;else if(next)max=Math.min(max,next.at);
  target=clamp(target,0,max);
  if(G.lock!=null)target=G.lock;
  if(target>G.camX)G.camX=Math.min(target,G.camX+2.2);
  G.camX=Math.max(0,G.camX);
}
function explode(pr){
  sfx.boom();G.shake=7;burst(pr.x,pr.y,pr.z,'#ff6a3d',18);burst(pr.x,pr.y,pr.z,'#ffc63d',10);
  for(const t of G.ents){if(!t.team||t.state==='dead')continue;
    if(Math.abs(t.x-pr.x)<36&&Math.abs(t.y-pr.y)<16)hurt(t,pr.dmg,t.x>=pr.x?1:-1,{kd:true,kb:8,big:true,col:'#ff6a3d',air:true});}
}
function stageClear(){
  store.set('cs_save',Object.assign(playerSave(),{stage:G.stage+1}));
  if(G.stage>=STAGES.length-1){setMode('win');return;}
  P.hp=Math.min(P.maxHp,P.hp+30);
  setMode('shop');
}

/* ---------- drawing ---------- */
function fillPoly(pts,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fill();}
function limb(a,b,c,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();}
function joint(a,c,bend){const mx=(a[0]+c[0])/2,my=(a[1]+c[1])/2;const dx=c[0]-a[0],dy=c[1]-a[1];const L=Math.hypot(dx,dy)||1;return[mx-dy/L*bend,my+dx/L*bend];}

function drawDrone(e){
  const sx=e.x-G.camX,sy=e.y-e.z;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sx,e.y,10,3,0,0,7);ctx.fill();
  ctx.save();ctx.translate(sx,sy);ctx.scale(e.face,1);
  if(e.state==='dead')ctx.rotate(e.t*.2);
  const blink=e.flash>0&&e.flash%2;
  ctx.strokeStyle='#5d6680';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-12,-6);ctx.lineTo(12,-6);ctx.stroke();
  const rw=8+Math.sin(G.t*1.3)*6;ctx.strokeStyle='rgba(200,220,255,.55)';ctx.beginPath();ctx.moveTo(-12-rw/2,-8);ctx.lineTo(-12+rw/2,-8);ctx.moveTo(12-rw/2,-8);ctx.lineTo(12+rw/2,-8);ctx.stroke();
  fillPoly([-10,-4,10,-4,13,2,6,7,-8,7,-11,2],blink?'#ffffff':'#39405a');
  fillPoly([-10,-4,10,-4,8,-1,-8,-1],'#5d6680');
  ctx.fillStyle=e.state==='aim'&&e.t%6<3?'#ffffff':'#ff3d4a';ctx.beginPath();ctx.arc(7,2,2.2,0,7);ctx.fill();
  ctx.fillStyle='#22263a';ctx.fillRect(2,6,9,2);
  ctx.restore();
}

function drawFig(e){
  if(e.d&&e.d.fly)return drawDrone(e);
  const sc=(e.d&&e.d.scale)||1,pal=e.pal,sx=e.x-G.camX,sy=e.y-e.z;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(sx,e.y,(e.state==='down'||e.state==='dead')&&e.z===0?20*sc:11*sc,3.4*sc,0,0,7);ctx.fill();
  if(e.inv>0&&e.state!=='down'&&(G.t>>2)%2)return;
  if(e.state==='dead'&&e.t>40&&(G.t>>2)%2)return;
  ctx.save();ctx.translate(sx,sy);ctx.scale(e.face*sc,sc);
  const st=e.state,t=e.t,lying=(st==='down'||st==='dead');
  if(lying){if(e.z>0)ctx.rotate(-Math.min(1.5,t*.12));else{ctx.translate(-6,-4);ctx.rotate(-Math.PI/2);}}
  const fl=e.flash>0&&e.flash%2;
  const skin=fl?'#ffffff':pal.skin,coat=fl?'#ffffff':pal.coat,coat2=fl?'#e8e8e8':pal.coat2,pants=fl?'#ffffff':pal.pants;
  // pose
  const ws=Math.sin(e.walk*.2),wc=Math.cos(e.walk*.2);
  let hip=[0,-20],sh=[0,-35],lean=0;
  let ff=[3,0],bf=[-3,0],fh=[7,-25],bh=[-5,-24],fkb=4,bkb=4,gun=false,glow=0,staff=false;
  const breath=Math.sin(G.t*.07+e.x)*.6;
  if(st==='idle'||st==='blink'){sh=[0,-35+breath];fh=[8,-27+breath];bh=[-4,-25+breath];ff=[5,0];bf=[-4,0];}

function drawProj(pr){
  const sx=pr.x-G.camX,sy=pr.y-pr.z;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(sx,pr.y,pr.k==='bullet'?3:6,1.6,0,0,7);ctx.fill();
  if(pr.k==='bullet'){ctx.strokeStyle='#ffe28a';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-Math.sign(pr.vx)*9,sy);ctx.stroke();}
  else{const c=pr.k==='fire'?['255,106,61','#ffe7a8']:['69,210,255','#e6fbff'];const r=pr.r+Math.sin(G.t*.5)*1;
    ctx.fillStyle=`rgba(${c[0]},.25)`;ctx.beginPath();ctx.arc(sx,sy,r*2,0,7);ctx.fill();
    ctx.fillStyle=`rgba(${c[0]},.85)`;ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.fill();

}

function drawBg(){
  const S=STAGES[G.stage],B=G.bg,cx=G.camX;
  let g=ctx.createLinearGradient(0,0,0,FY0);g.addColorStop(0,S.sky[0]);g.addColorStop(1,S.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,FY0);

  if(G.stage===2){ctx.strokeStyle='rgba(255,198,61,.06)';ctx.lineWidth=1;for(let y=20;y<FY0;y+=14){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}
  const base=FY0-14;

  for(const b of B.near){const x=b.x-cx*.55;if(x>W+60||x+b.w<-60)continue;
    ctx.fillStyle=S.near;ctx.fillRect(x,base-b.h,b.w,b.h+2);ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(x,base-b.h,b.w,2);
    ctx.fillStyle=S.win;ctx.globalAlpha=.55;for(const w of b.wins)ctx.fillRect(x+w[0],base-b.h+w[1],3,4);ctx.globalAlpha=1;
    if(b.sign){const s=b.sign,on=!(Math.sin(G.t*.05+b.x)>.96);ctx.font='600 13px Teko, Impact, sans-serif';
      if(s.vert){const ch=s.t.split('');const hgt=ch.length*11+6,sx0=x+s.dx,sy0=base-b.h+s.dy;ctx.fillStyle='#0b0812';ctx.fillRect(sx0,sy0,15,hgt);ctx.strokeStyle=s.c;ctx.globalAlpha=on?1:.3;ctx.lineWidth=1;ctx.strokeRect(sx0+.5,sy0+.5,14,hgt-1);ctx.fillStyle=s.c;ctx.textAlign='center';ch.forEach((c,i)=>ctx.fillText(c,sx0+7.5,sy0+14+i*11));ctx.globalAlpha=1;}
      else{const tw=ctx.measureText(s.t).width+10,sx0=x+s.dx,sy0=base-b.h+s.dy;ctx.fillStyle='#0b0812';ctx.fillRect(sx0,sy0,tw,15);ctx.globalAlpha=on?1:.3;ctx.strokeStyle=s.c;ctx.strokeRect(sx0+.5,sy0+.5,tw-1,14);ctx.fillStyle=s.c;ctx.textAlign='left';ctx.fillText(s.t,sx0+5,sy0+12.5);ctx.globalAlpha=on?.12:0;ctx.fillRect(sx0-6,sy0-6,tw+12,27);ctx.globalAlpha=1;}}
  }
  // wall / sidewalk
  ctx.fillStyle=S.wall;ctx.fillRect(0,base,W,14);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(0,base,W,1);
  g=ctx.createLinearGradient(0,FY0,0,H);g.addColorStop(0,S.ground[0]);g.addColorStop(1,S.ground[1]);ctx.fillStyle=g;ctx.fillRect(0,FY0,W,H-FY0);
  ctx.strokeStyle=S.line;ctx.lineWidth=1;
  const step=64,off=-(cx%step);
  for(let x=off-step*2;x<W+step*2;x+=step){const vx=x+(x-W/2)*.55;ctx.beginPath();ctx.moveTo(x,FY0);ctx.lineTo(vx,H);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(0,FY0+.5);ctx.lineTo(W,FY0+.5);ctx.stroke();
  ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(0,212.5);ctx.lineTo(W,212.5);ctx.stroke();ctx.globalAlpha=1;
  // exit marker
  if(G.exitOpen){const ex=S.len-30-cx;if(ex<W+20){ctx.fillStyle=`rgba(255,61,139,${.25+.2*Math.sin(G.t*.15)})`;ctx.fillRect(ex,FY0,30,H-FY0);}}
}
function drawRain(){if(!G.rain.length)return;ctx.strokeStyle='rgba(170,190,255,.22)';ctx.lineWidth=1;ctx.beginPath();for(const r of G.rain){ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-2,r.y+6);}ctx.stroke();}

function bar(x,y,w,h,v,max,col){ctx.fillStyle='#0b0812';ctx.fillRect(x-1,y-1,w+2,h+2);ctx.fillStyle='#2a2238';ctx.fillRect(x,y,w,h);ctx.fillStyle=col;ctx.fillRect(x,y,Math.max(0,w*v/max),h);ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x,y,Math.max(0,w*v/max),1);}
function txt(s,x,y,size,col,align,stroke){ctx.font=`600 ${size}px Teko, Impact, sans-serif`;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';if(stroke!==false){ctx.lineWidth=3;ctx.strokeStyle='#0b0812';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
function drawHud(){
  txt('RUNNER',10,18,16,'#efe9ff');
  for(let i=0;i<P.lives;i++)fillPoly([58+i*8,12,61+i*8,9,64+i*8,12,61+i*8,15],'#ff3d8b');
  bar(10,22,90,6,P.hp,P.maxHp,'#ff3d8b');
  bar(10,31,90*P.maxMp/60*.8,4,P.mp,P.maxMp,'#45d2ff');
  txt('AMMO '+P.ammo,108,30,13,'#ffe28a');
  txt('¥'+P.creds,108,19,15,'#ffc63d');
  const S=STAGES[G.stage];txt(S.name.toUpperCase(),W-48,18,14,'#a79dc2','right');
  const boss=G.ents.find(e=>e.team&&e.d.boss&&e.state!=='dead');
  if(boss){const bw=200,bx=(W-bw)/2;txt(boss.d.name.toUpperCase(),bx,H-14,14,'#efe9ff');bar(bx,H-11,bw,5,boss.hp,boss.maxHp,'#ffc63d');}

    txt('DISTRICT '+(G.stage+1)+' — '+S.name.toUpperCase(),W/2,122,30,'#efe9ff','center');ctx.font='12px "Chakra Petch", sans-serif';ctx.fillStyle='#a79dc2';ctx.textAlign='center';ctx.fillText(S.sub,W/2,137);ctx.globalAlpha=1;}

function render(){
  const s=SCALE;ctx.setTransform(s,0,0,s,0,0);
  if(!G.bg){G.bg=genBg(0);}
  let shx=0,shy=0;if(G.shake&&!RM){shx=rand(-G.shake,G.shake)*.6;shy=rand(-G.shake,G.shake)*.6;}
  ctx.save();ctx.translate(shx,shy);
  drawBg();
  for(const k of G.picks)drawPick(k);
  const list=G.ents.slice().concat(G.projs.map(p=>({proj:p,y:p.y}))).sort((a,b)=>a.y-b.y);
  for(const o of list){if(o.proj)drawProj(o.proj);else drawFig(o);}
  for(const q of G.parts){ctx.fillStyle=q.c;ctx.globalAlpha=Math.min(1,q.life/10);ctx.fillRect(q.x-G.camX-q.sz/2,q.y-q.z-q.sz/2,q.sz,q.sz);}ctx.globalAlpha=1;
  for(const t of G.texts){ctx.globalAlpha=Math.min(1,t.life/12);txt(t.s,t.x-G.camX,t.y-t.z,t.s.length>6?16:18,t.c,'center');}ctx.globalAlpha=1;
  drawRain();
  ctx.restore();
  if(G.mode!=='title')drawHud();
}

/* ---------- title attract scene ---------- */
function attract(){
  if(!P)P=newPlayer();
  G.stage=0;G.bg=genBg(0);G.camX=0;G.ents=[];G.projs=[];G.parts=[];G.texts=[];G.picks=[];G.lock=null;
  P.x=150;P.y=225;P.face=1;setS(P,'idle');G.ents.push(P);
  const e=spawnEnemy('ganger',1);e.x=300;e.y=222;e.face=-1;const o=spawnEnemy('orc',1);o.x=345;o.y=236;o.face=-1;
  G.rain=[];if(!RM)for(let i=0;i<60;i++)G.rain.push({x:rand(0,W),y:rand(0,H),s:rand(5,8)});
}
function attractStep(){G.t++;for(const r of G.rain){r.y+=r.s;r.x-=1.2;if(r.y>H){r.y=-10;r.x=rand(0,W+40);}}
  for(const e of G.ents){e.t++;if(e.team){e.walk+=.4;if(e.state!=='walk')e.state='walk';}}
  if(G.t%120===0){setS(P,['punch','kick','cast','shoot'][(G.t/120)%4]);}
  if(P.t>24&&P.state!=='idle')setS(P,'idle');P.t++;
  G.camX=Math.sin(G.t*.004)*20+20;
}

/* ---------- modes / overlays ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const keysHtml=`<div class="keys">
<b>Move</b><span>Arrows / WASD</span><b>Punch</b><span>J or Z — three in a row ends in an uppercut</span>
<b>Kick</b><span>K or X</span><b>Jump</b><span>Space, L or C — punch or kick mid-air for a flying kick</span>
<b>Shoot</b><span>U or V — heavy pistol, uses ammo</span><b>Spell</b><span>I or B — fireball, uses mana</span><b>Pause</b><span>P or Esc</span></div>`;
function setMode(m){
  G.mode=m;ov.hidden=(m==='play');
  if(m==='title'){
    const sv=store.get('cs_save');
    ov.innerHTML=`<div class="card"><p class="eyebrow">Seattle-sprawl, 2079 · a brawler</p><h1>Chrome &amp; Sorcery</h1>
    <p>You are a shadowrunner with a cyberarm, a heavy pistol and one good spell. Three districts stand between you and Director Voss. Beat down gangers, orcs, corp security, drones and street shamans, then spend the creds at the street doc.</p>
    <div class="row"><button class="btn" id="bNew">New run</button>${sv&&sv.stage>0&&sv.stage<STAGES.length?`<button class="btn ghost" id="bCont">Continue · District ${sv.stage+1}</button>`:''}<button class="btn ghost" id="bMute">${muted?'Sound off':'Sound on'}</button></div>
    ${keysHtml}</div>`;
    ov.querySelector('#bNew').onclick=()=>{A.unlock();P=newPlayer();startStage(0,true);};
    const c=ov.querySelector('#bCont');if(c)c.onclick=()=>{A.unlock();const s=store.get('cs_save');P=newPlayer();Object.assign(P,{maxHp:s.maxHp,hp:s.hp,mp:s.mp,ammo:s.ammo,creds:s.creds,lives:Math.max(1,s.lives),arm:s.arm,focus:s.focus,plate:s.plate});startStage(s.stage,false);};
    ov.querySelector('#bMute').onclick=e=>{muted=!muted;e.target.textContent=muted?'Sound off':'Sound on';};
    ov.querySelector('#bNew').focus({preventScroll:true});
  }
  if(m==='pause'){
    ov.innerHTML=`<div class="card"><p class="eyebrow">Paused · District ${G.stage+1}</p><h2>Catch your breath</h2>
    <div class="row"><button class="btn" id="bRes">Resume</button><button class="btn ghost" id="bMute">${muted?'Sound off':'Sound on'}</button><button class="btn ghost" id="bQuit">Quit to title</button></div>${keysHtml}</div>`;
    ov.querySelector('#bRes').onclick=()=>setMode('play');
    ov.querySelector('#bMute').onclick=e=>{muted=!muted;e.target.textContent=muted?'Sound off':'Sound on';};
    ov.querySelector('#bQuit').onclick=()=>{attract();setMode('title');};
    ov.querySelector('#bRes').focus({preventScroll:true});
  }
  if(m==='shop')renderShop();
  if(m==='over'){
    ov.innerHTML=`<div class="card"><p class="eyebrow">District ${G.stage+1} · ${esc(STAGES[G.stage].name)}</p><h2 style="color:var(--neon)">Flatlined</h2>
    <p>Your upgrades are kept. You restart this district with full health, three lives and half your creds.</p>
    <div class="row"><button class="btn" id="bRetry">Run it again</button><button class="btn ghost" id="bQuit">Quit to title</button></div></div>`;
    ov.querySelector('#bRetry').onclick=()=>{P.lives=3;P.creds=Math.floor(P.creds/2);P.ammo=Math.max(P.ammo,8);startStage(G.stage,true);};
    ov.querySelector('#bQuit').onclick=()=>{attract();setMode('title');};
    ov.querySelector('#bRetry').focus({preventScroll:true});
  }
  if(m==='win'){
    store.del('cs_save');
    ov.innerHTML=`<div class="card"><p class="eyebrow">Run complete</p><h1>Paid in full</h1>
    <p>Director Voss is down and the arcology's vault is open. You walk out with ¥${P.creds} and a cyberarm that still hums.</p>
    <div class="row"><button class="btn" id="bAgain">New run</button></div></div>`;
    ov.querySelector('#bAgain').onclick=()=>{P=newPlayer();startStage(0,true);};
  }
}
function renderShop(){
  const nxt=STAGES[G.stage+1];
  ov.innerHTML=`<div class="card"><p class="eyebrow">Between runs · next: ${esc(nxt.name)}</p><h2>Doc Kessler's back room</h2>
  <div class="row" style="align-items:baseline;justify-content:space-between"><span class="wallet">¥${P.creds}</span><span style="color:var(--muted);font-size:13px">HP ${P.hp}/${P.maxHp} · Mana ${P.mp}/${P.maxMp} · Ammo ${P.ammo}</span></div>
  <div class="shop">${SHOP.map(it=>{const c=it.cost(P),lv=it.lvl?` · level ${it.lvl(P)}/3`:'';const ok=it.can(P)&&P.creds>=c;const maxed=!it.can(P)&&it.lvl;
    return `<div class="item"><div><div class="nm">${esc(it.name)}<span style="color:var(--muted);font-weight:400">${lv}</span></div><div class="ds">${esc(it.desc)}</div></div><button class="btn${ok?'':' ghost'}" data-buy="${it.id}" ${ok?'':'disabled'}>${maxed?'Maxed':'¥'+c}</button></div>`;}).join('')}</div>
  <div class="row"><button class="btn" id="bGo">Hit the street</button></div></div>`;
  ov.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=SHOP.find(s=>s.id===b.dataset.buy);const c=it.cost(P);if(P.creds>=c&&it.can(P)){P.creds-=c;it.buy(P);sfx.buy();renderShop();}});
  ov.querySelector('#bGo').onclick=()=>startStage(G.stage+1,false);
}
function togglePause(){if(G.mode==='play')setMode('pause');else if(G.mode==='pause')setMode('play');}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')setMode('pause');});

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){
    if(G.mode==='play'){if(G.stop>0)G.stop--;else update();}
    else if(G.mode==='title')attractStep();
    for(const k in pressed)pressed[k]=false;
    acc-=1000/60;
  }
  render();requestAnimationFrame(frame);
}

fit();attract();setMode('title');requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
setTimeout(fit,300);

// Installable when served from your own HTTPS host
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
})();
</script>
