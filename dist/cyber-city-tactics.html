<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyber City Tactics</title>
<meta name="description" content="A vector brawler RPG for one or two players: a five-district campaign, an open-world Sprawl, Arena waves, skill trees, legendaries and secrets. Plays offline.">
<meta name="theme-color" content="#0c0a14">
<meta name="color-scheme" content="dark">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyber City">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>
/* Cyber City Tactics · src/css/game.css — all styles for the page, menus and touch controls. */
/* Layout: one-screen arcade cabinet — canvas fills the stage, touch pad below (portrait) or over the stage (landscape). Single dark look by design. */
:root {
  --ink: #0c0a14;
  --panel: #17121f;
  --panel2: #1f1830;
  --line: #30283f;
  --text: #efe9ff;
  --muted: #a79dc2;
  --neon: #ff3d8b;
  --mana: #45d2ff;
  --gold: #ffc63d;
  --ok: #7dffb0;
  --karma: #b98cff;
  --font-display: 'Teko', Impact, 'Arial Narrow', sans-serif;
  --font-body: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
  --b: 58px;
  --b2: 48px;
  --s: 132px;
  color-scheme: dark;
}
body.size-s {
  --b: 50px;
  --b2: 42px;
  --s: 116px;
}
body.size-l {
  --b: 68px;
  --b2: 56px;
  --s: 152px;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
  overscroll-behavior: none;
}
body {
  -webkit-tap-highlight-color: transparent;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  box-sizing: border-box;
  position: relative;
}
#stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
#game {
  display: block;
  background: #000;
  border-radius: 3px;
  box-shadow: 0 0 0 1px var(--line);
}
#pauseBtn {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  opacity: 0.85;
  border: 1px solid var(--line);
  background: rgba(23, 18, 31, 0.7);
  color: var(--text);
  font: 600 15px var(--font-body);
  cursor: pointer;
  z-index: 4;
}
button:focus-visible {
  outline: 2px solid var(--mana);
  outline-offset: 2px;
}

#ov {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(12, 10, 20, 0.9);
  z-index: 20;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
    env(safe-area-inset-left, 0px);
  box-sizing: border-box;
}
#rotHint {
  position: absolute;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  z-index: 4;
  font: 600 12px var(--font-body);
  letter-spacing: 0.04em;
  color: var(--text);
  background: rgba(23, 18, 31, 0.92);
  border: 1px solid var(--neon);
  border-radius: 20px;
  padding: 8px 14px;
  white-space: nowrap;
  max-width: calc(100% - 16px);
  overflow: hidden;
  text-overflow: ellipsis;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.seg button {
  font: 600 12px var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 9px 12px;
  background: transparent;
  color: var(--muted);
  border: 0;
  border-left: 1px solid var(--line);
  cursor: pointer;
  min-height: 38px;
}
.seg button:first-child {
  border-left: 0;
}
.seg button[aria-pressed='true'] {
  background: var(--neon);
  color: #16040c;
}
.setrow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.setrow > div {
  min-width: 0;
}
.setrow .ds {
  font-size: 12.5px;
  color: var(--muted);
}
@media (pointer: coarse) {
  .btn {
    min-height: 44px;
  }
  .btn.sm {
    min-height: 38px;
    padding: 8px 12px;
  }
  .tab {
    min-height: 40px;
  }
}
.card {
  width: 100%;
  max-width: 640px;
  max-height: 100%;
  overflow: auto;
  box-sizing: border-box;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  animation: cardIn 0.2s ease-out;
}
@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .card {
    animation: none;
  }
}
.card h1 {
  font: 600 clamp(48px, 11vw, 84px)/0.82 var(--font-display);
  margin: 0;
  letter-spacing: 0.01em;
  text-shadow:
    -3px 0 var(--neon),
    3px 0 var(--mana);
  text-wrap: balance;
}
/* The wordmark (brand book: Name and wordmark): CYBER CITY with the pink/cyan chromatic split, TACTICS knocked
   out of a Neon Pink bar. The bar is the brand's signature shape. */
.card h1.wordmark {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.07em;
  text-transform: uppercase;
  text-shadow: none;
}
.wordmark .wm-city {
  text-shadow:
    -3px 0 var(--neon),
    3px 0 var(--mana);
}
.wordmark .wm-bar {
  background: var(--neon);
  color: var(--ink);
  font-size: 0.56em;
  line-height: 1;
  padding: 0.08em 0.24em 0;
  letter-spacing: 0.14em;
}
.card h2 {
  font: 600 clamp(32px, 7vw, 48px)/0.9 var(--font-display);
  margin: 0;
  letter-spacing: 0.02em;
  text-wrap: balance;
}
.card h3 {
  font: 600 22px/1 var(--font-display);
  margin: 4px 0 0;
  letter-spacing: 0.04em;
  color: var(--muted);
  text-transform: uppercase;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}
.card p {
  margin: 0;
  line-height: 1.5;
  color: var(--muted);
  max-width: 62ch;
}
.say {
  border-left: 2px solid var(--neon);
  padding: 4px 0 4px 12px;
  color: var(--text) !important;
  font-size: 15px;
}
.say b {
  color: var(--neon);
  font-weight: 600;
  letter-spacing: 0.06em;
  font-size: 12px;
  display: block;
  text-transform: uppercase;
}
.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  font: 600 13px var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 10px 16px;
  border-radius: 6px;
  border: 1px solid var(--neon);
  background: var(--neon);
  color: #16040c;
  cursor: pointer;
}
.btn.ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--line);
}
.btn.sm {
  padding: 6px 10px;
  font-size: 11.5px;
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
}
.tab {
  font: 600 12px var(--font-body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 8px 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.tab[aria-selected='true'] {
  color: var(--text);
  border-color: var(--line);
  background: var(--panel2);
}
.tab .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  margin-left: 6px;
  vertical-align: middle;
}
.keys {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 14px;
  font-size: 13px;
  color: var(--muted);
}
.keys b {
  color: var(--text);
  font-weight: 600;
}
.cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}
.cols > div {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.item {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}
.item > div {
  min-width: 0;
}
.item .nm {
  font-weight: 600;
}
.item .ds {
  font-size: 12.5px;
  color: var(--muted);
}
.item .acts {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.r0 {
  color: #e6e1f2;
}
.r1 {
  color: var(--mana);
}
.r2 {
  color: var(--gold);
}
.up {
  color: var(--ok);
}
.down {
  color: var(--neon);
}
.wallet {
  font: 600 26px var(--font-display);
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.attrs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px;
}
.attr {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.attr .k {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.attr .v {
  font: 600 30px/1 var(--font-display);
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.attr .h {
  font-size: 11.5px;
  color: var(--muted);
}
.derived {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 4px 14px;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.derived b {
  color: var(--text);
}
.meter {
  height: 6px;
  background: #2a2238;
  border-radius: 3px;
  overflow: hidden;
}
.meter i {
  display: block;
  height: 100%;
  background: var(--karma);
}
.job {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sharebox {
  user-select: text;
  -webkit-user-select: text;
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text);
  background: var(--panel);
  overflow-wrap: anywhere;
}
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 8px;
}
.stats div {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel);
}
.stats b {
  display: block;
  font: 600 26px/1 var(--font-display);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stats span {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.trk {
  position: relative;
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #0b0812;
  overflow: hidden;
  transition: box-shadow 0.1s;
}
.trk .zone {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(125, 255, 176, 0.28);
  border-left: 2px solid var(--ok);
  border-right: 2px solid var(--ok);
}
.trk .cur {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 3px;
  margin-left: -1.5px;
  background: var(--neon);
  box-shadow: 0 0 8px var(--neon);
}
.trk[data-f='ok'] {
  box-shadow: 0 0 0 2px var(--ok);
}
.trk[data-f='bad'] {
  box-shadow: 0 0 0 2px var(--neon);
}
.btn.big {
  padding: 16px 34px;
  font-size: 16px;
  min-width: 150px;
}
.sk-tree {
  display: flex;
  flex-direction: column;
  gap: 0;
  margin-top: 6px;
}
.sk-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}
.sk-link {
  height: 14px;
  width: 2px;
  margin: 0 auto;
  background: linear-gradient(var(--tc), transparent);
  opacity: 0.6;
}
.sk {
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font: inherit;
  cursor: pointer;
  transition:
    transform 0.15s,
    border-color 0.15s,
    box-shadow 0.2s;
}
.sk .sk-n {
  font: 600 15px var(--font-display);
  letter-spacing: 0.02em;
}
.sk .sk-d {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.35;
}
.sk .sk-l {
  font-size: 11.5px;
  color: var(--neon);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.sk.own {
  border-color: var(--tc);
  box-shadow:
    inset 0 0 0 1px var(--tc),
    0 0 14px -6px var(--tc);
}
.sk.own .sk-n {
  color: var(--tc);
}
.sk.can {
  border-color: var(--gold);
  animation: skp 1.6s ease-in-out infinite;
}
.sk.can:hover {
  transform: translateY(-2px);
}
.sk.lock {
  opacity: 0.5;
  cursor: default;
}
.sk.pop {
  animation: skpop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1);
}
@keyframes skp {
  50% {
    box-shadow: 0 0 0 3px rgba(255, 198, 61, 0.18);
  }
}
@keyframes skpop {
  0% {
    transform: scale(0.92);
  }
  60% {
    transform: scale(1.04);
  }
  100% {
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  .sk.can,
  .sk.pop {
    animation: none;
  }
}
.r3 {
  color: #ff8a3d;
}
.swatch {
  width: 26px;
  height: 26px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: linear-gradient(135deg, var(--c1) 55%, var(--c2) 55%);
  cursor: pointer;
  font-size: 11px;
  padding: 0;
  color: #fff;
}
.swatch.on {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
.swatch:disabled {
  opacity: 0.35;
  cursor: default;
}
@media (pointer: coarse) {
  .swatch {
    width: 32px;
    height: 32px;
  }
}
.job .st {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

#pad {
  display: none;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  padding-block: 6px 2px;
}
body.touch #pad {
  display: flex;
}
body.touch.lefty #pad {
  flex-direction: row-reverse;
}
#stick {
  width: calc(var(--s) * 1.25);
  height: calc(var(--s) * 1.12);
  flex: none;
  position: relative;
  touch-action: none;
}
#ring {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  border: 2px solid var(--line);
  background: rgba(23, 18, 31, 0.55);
  pointer-events: none;
}
#knob {
  position: absolute;
  left: 29%;
  top: 29%;
  width: 42%;
  height: 42%;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--muted);
  pointer-events: none;
}
#btns {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-end;
}
body.lefty #btns {
  align-items: flex-start;
}
.urow,
.mrow,
.brow {
  display: flex;
  gap: 8px;
}
.tb {
  width: var(--b2);
  height: var(--b2);
  border-radius: 50%;
  border: 2px solid var(--neon);
  background: rgba(255, 61, 139, 0.14);
  color: var(--text);
  font: 600 10.5px/1.05 var(--font-body);
  letter-spacing: 0.03em;
  touch-action: none;
  padding: 0;
  flex: none;
}
.tb.big {
  width: var(--b);
  height: var(--b);
  font-size: 11.5px;
}
.tb small {
  display: block;
  font-size: 9.5px;
  opacity: 0.85;
  font-variant-numeric: tabular-nums;
}
.tb.on {
  background: rgba(255, 61, 139, 0.45);
}
.tb.dim {
  opacity: 0.4;
}
.urow .tb.spec {
  border-color: var(--gold);
  color: var(--gold);
  min-width: 64px;
}
.urow .tb.spec.ready {
  background: rgba(255, 198, 61, 0.35);
  color: var(--text);
  box-shadow: 0 0 12px rgba(255, 198, 61, 0.5);
}
.tb.gun {
  border-color: var(--gold);
  background: rgba(255, 198, 61, 0.12);
}
.tb.spell {
  border-color: var(--mana);
  background: rgba(69, 210, 255, 0.12);
}
.tb.move {
  border-color: var(--ok);
  background: rgba(125, 255, 176, 0.1);
}
.urow .tb {
  width: auto;
  min-width: var(--b2);
  height: 34px;
  border-radius: 17px;
  padding: 0 10px;
  border-color: var(--muted);
  background: rgba(167, 157, 194, 0.1);
}
@media (orientation: landscape) {
  body.touch #app {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: minmax(0, 1fr);
    column-gap: 10px;
  }
  body.touch #pad {
    display: contents;
  }
  body.touch #stick {
    grid-column: 1;
    grid-row: 1;
    align-self: end;
  }
  body.touch #stage {
    grid-column: 2;
    grid-row: 1;
    min-width: 0;
  }
  body.touch #btns {
    grid-column: 3;
    grid-row: 1;
    align-self: end;
    padding-bottom: 4px;
  }
  body.touch.lefty #stick {
    grid-column: 3;
  }
  body.touch.lefty #btns {
    grid-column: 1;
  }
}
@media (orientation: landscape) and (max-height: 460px) {
  body.touch {
    --b: 50px;
    --b2: 42px;
    --s: 110px;
  }
  body.touch.size-s {
    --b: 44px;
    --b2: 38px;
    --s: 96px;
  }
  body.touch.size-l {
    --b: 56px;
    --b2: 46px;
    --s: 124px;
  }
  .urow .tb {
    height: 30px;
  }
}
@media (orientation: portrait) {
  /* stick zone + 12px gap + three buttons must fit the phone width minus the 32px gutter */
  body.touch {
    --b: 60px;
    --b2: 50px;
    --s: min(128px, calc((100vw - 32px - 12px - 16px) * 0.38));
  }
  body.touch.size-s {
    --b: 52px;
    --b2: 44px;
    --s: min(112px, calc((100vw - 60px) * 0.36));
  }
  body.touch.size-l {
    --b: min(68px, calc((100vw - 60px) * 0.2));
    --b2: min(56px, calc((100vw - 60px) * 0.17));
    --s: min(140px, calc((100vw - 60px) * 0.36));
  }
  body.touch #stick {
    width: var(--s);
    height: calc(var(--s) * 1.15);
  }
  body.touch #stage {
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;

    list = [...navigator.getGamepads()].filter(Boolean);
  } catch (e) {
    return;
  }
  const now = performance.now();
  list.forEach((gp, n) => {
    if (n > 1) return;
    let who = G.coop ? (list.length >= 2 ? n : 1) : n === 0 ? 0 : -1;

      spell: b(3),
      dodge: b(4),
      gun: b(5),
      item: b(6),
      swap: b(7),
      sheet: b(8),

    }
    if (e.t >= 40) setS(e, 'idle');
    return;
  }
  if (e.state === 'blink' && p) {
    if (e.t === 10 && e.d.ice) burst(e.x, e.y, e.z, '#45d2ff', 10);

      e.x = clamp(p.x + (Math.random() < 0.5 ? -1 : 1) * rand(110, 150), G.camX + 20, G.camX + W - 20);

  if (!p) {
    if (e.state !== 'idle') setS(e, 'idle');

  }

    dy = p.y - e.y,
    adx = Math.abs(dx),
    ady = Math.abs(dy);

        e.cool = cd;

      }

      setS(e, 'windup');
      if (d.stealth) {
        e.cloaked = false;
        e.recloakT = 90;

  let mx = clamp(tx - e.x, -s, s),

  e.y += my;
  e.y = clamp(e.y, FY0 + 6, FY1);

    if (e.state !== 'walk') setS(e, 'walk');
    e.walk += 1;

}

function enrage(e) {

    if (G.outro < 30) G.fade = Math.min(1, G.fade + 0.04);
    if (G.outro === 0 && G.afterOutro) {

}
function collect(k, p) {

    say(p, '+¥' + k.v, '#ffc63d');
  }

    if (PARTY.med >= 5 && p.hp >= p.maxHp) return;
    if (PARTY.med < 5) {
      PARTY.med++;
      say(p, '+1 MEDKIT', '#7dffb0');
    } else {
      p.hp = Math.min(p.maxHp, p.hp + 25);
      say(p, '+25 HP', '#7dffb0');
    }
    sfx.buy();
  }
  if (k.k === 'ammo') {
    const n = gmodOf(p) === 'mag' ? 12 : 8;

    say(p, '+' + n + ' AMMO', '#ffe28a');
  }

    p.mp = Math.min(p.maxMp, p.mp + 30);

    say(p, '+30 MANA', '#45d2ff');
  }
  if (k.k === 'chip') {
    contractTick('chip');
    sfx.loot();
    say(p, 'DATA CHIP', '#7dffb0');

    say(p, '+1 ICEBREAKER', '#45d2ff');

  if (k.k === 'gear') {

function waves() {

    dir: 1,

    maxMiss: 2 + (anyHas('spare') ? 1 : 0),
    w:
      clamp(0.1 + hak * 0.03 - b.tier * 0.02, 0.06, 0.32) *

}
function newZone() {

  } while (Math.abs(z - h.pos) < 0.15);

}
function hackPress() {
  const h = G.hack;

    h.miss++;

function hackHit() {

  sfx.coin();
  buzz(12);
  h.flash = 14;
  h.flashCol = 'ok';

  }

}
function useIce() {

    if (anyHas('icecraft') && Math.random() < 0.3) {

    el.innerHTML = `Nodes ${'<b style="color:var(--ok)">●</b> '.repeat(h.hits)}${'○ '.repeat(h.need - h.hits)} · Misses left ${'<b style="color:var(--neon)">♦</b> '.repeat(h.maxMiss + 1 - h.miss)}`;

function hackStep() {

  h.pos += (h.dir * h.speed) / 60;
  if (h.pos > 1) {
    h.pos = 1;
    h.dir = -1;
  }
  if (h.pos < 0) {
    h.pos = 0;
    h.dir = 1;

/* ===== src/js/render/figures.js ===== */
/* Cyber City Tactics · src/js/render/figures.js
 * Drawing every character, drone, spirit, prop, projectile, pickup and effect. All vector, no sprites.
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */
/* ================= drawing ================= */
function fillPoly(pts, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function limb(a, b, c, col, w) {
  ctx.strokeStyle = col;
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]);
  ctx.lineTo(b[0], b[1]);
  ctx.lineTo(c[0], c[1]);
  ctx.stroke();
}
function joint(a, c, bend) {
  const mx = (a[0] + c[0]) / 2,
    my = (a[1] + c[1]) / 2;
  const dx = c[0] - a[0],
    dy = c[1] - a[1];
  const L = Math.hypot(dx, dy) || 1;
  return [mx - (dy / L) * bend, my + (dx / L) * bend];
}
function shadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,.33)';
  ctx.beginPath();
  ctx.ellipse(x, y, w, w * 0.3, 0, 0, 7);
  ctx.fill();
}
function drawDrone(e) {
  const sx = e.x - G.camX,
    sy = e.y - e.z;
  shadow(sx, e.y, 10);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(e.face, 1);
  if (e.state === 'dead') ctx.rotate(e.t * 0.2);
  const blink = e.flash > 0 && e.flash % 2;
  ctx.strokeStyle = '#5d6680';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-12, -6);
  ctx.lineTo(12, -6);
  ctx.stroke();
  const rw = 8 + Math.sin(G.t * 1.3) * 6;
  ctx.strokeStyle = 'rgba(200,220,255,.55)';
  ctx.beginPath();
  ctx.moveTo(-12 - rw / 2, -8);
  ctx.lineTo(-12 + rw / 2, -8);
  ctx.moveTo(12 - rw / 2, -8);
  ctx.lineTo(12 + rw / 2, -8);
  ctx.stroke();
  fillPoly([-10, -4, 10, -4, 13, 2, 6, 7, -8, 7, -11, 2], blink ? '#ffffff' : '#39405a');
  fillPoly([-10, -4, 10, -4, 8, -1, -8, -1], '#5d6680');
  ctx.fillStyle = e.state === 'aim' && e.t % 6 < 3 ? '#ffffff' : '#ff3d4a';
  ctx.beginPath();
  ctx.arc(7, 2, 2.2, 0, 7);
  ctx.fill();
  ctx.fillStyle = '#22263a';
  ctx.fillRect(2, 6, 9, 2);
  ctx.restore();
}
// Hellhound: a low, four-legged figure with a burning mane and tail
function drawHound(e) {
  const sc = e.mini ? 0.75 : 1,
    sx = e.x - G.camX,
    sy = e.y - e.z,
    st = e.state,
    lying = st === 'down' || st === 'dead';
  shadow(sx, e.y, 13 * sc);
  if (e.inv > 0 && !lying && (G.t >> 2) % 2) return;
  if (st === 'dead' && e.t > 40 && (G.t >> 2) % 2) return;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(e.face * sc, sc);
  if (lying) {
    ctx.translate(0, -2);
    ctx.rotate(e.z > 0 ? -0.6 : Math.PI * 0.08);
  }
  const fl = e.flash > 0 && e.flash % 2,
    body = fl ? '#ffffff' : '#2a1a1e',
    body2 = fl ? '#e8e8e8' : '#3d2328',
    run = st === 'walk' || st === 'lunge',

    leap = st === 'lunge' && e.z > 0;

  G.t++;

    r.y += r.s;
    r.x -= 1.2;
    if (r.y > H) {
      r.y = -10;
      r.x = rand(0, W + 40);
    }

        sfx.loot();
      }
      rerender();
      break;
    }
    case 'hire': {
      const A = ALLIES[arg],
        ac = A ? Math.round(A.cost * buyMul()) : 0;
      if (A && PARTY.creds >= ac && !(PARTY.ally && PARTY.ally.type === arg)) {
        PARTY.creds -= ac;
        PARTY.ally = null;
        spawnAlly(arg);
        sfx.buy();
      }
      rerender();
      break;
    }
    case 'dismiss':
      PARTY.ally = null;
      G.ents = G.ents.filter(e => e.kind !== 'ally');
      rerender();
      break;
    case 'learn': {
      const s = SPELLS[arg];
      if (!p.spells.includes(arg) && p.D.a.mag >= s.req && PARTY.creds >= s.price) {
        PARTY.creds -= s.price;
        p.spells.push(arg);
        sfx.level();
      }
      rerender();
      break;
    }
  }
  if (keep) {
    const c2 = ov.querySelector('.card');
    if (c2) c2.scrollTop = top;
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (G.mode === 'play' || G.mode === 'den')) togglePause();
});

/* ===== src/js/pwa.js ===== */
/* Cyber City Tactics · src/js/pwa.js
 * Everything that makes the game behave like an installed app:
 *  - registers the service worker (sw.js) and shows an "update ready" bar when a new version has downloaded
 *  - captures the browser's install prompt so Settings and the title screen can offer "Install app"
 *  - asks the browser to keep saves from being evicted (persistent storage)
 *  - save backups: export every save to a JSON file and import it on another device
 *  - app shortcuts: ?go=daily, ?go=arena, ?go=sprawl or ?go=codex open that screen on launch
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */

const PWA = {
  deferred: null, // the saved beforeinstallprompt event
  waiting: null, // a new service worker that has installed and is waiting to take over
  installed:
    matchMedia('(display-mode: standalone)').matches ||
    matchMedia('(display-mode: fullscreen)').matches ||
    navigator.standalone === true,
  // No service worker inside the claude.ai preview, and none on localhost unless ?sw=1 (so edits show up
  // instantly while developing). GitHub Pages and other https hosts always get it.
  canSW:
    typeof BUNDLED === 'undefined' &&
    'serviceWorker' in navigator &&
    !/claude\.ai|claudeusercontent/.test(location.hostname) &&
    (location.protocol === 'https:' ||
      (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]sw=1/.test(location.search)))
};
const isIOS = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ---------- install ---------- */
addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  PWA.deferred = e;
  if (['title', 'settings'].includes(G.mode)) renderOv();
});
addEventListener('appinstalled', () => {
  PWA.deferred = null;
  PWA.installed = true;
  if (['title', 'settings'].includes(G.mode)) renderOv();
});
async function pwaInstall() {
  const e = PWA.deferred;
  if (!e) return;
  PWA.deferred = null;
  try {
    e.prompt();
    await e.userChoice;
  } catch (err) {}
  renderOv();
}
/** The install part of the Settings screen. */
function pwaSettingsRows(row) {
  let install;
  if (PWA.installed)
    install = row(
      'App',
      'Installed. It works offline and saves stay on this device.',
      '<span class="ds">✓ Installed</span>'
    );
  else if (PWA.deferred)
    install = row(
      'Install the app',
      'Full screen, its own icon, and it works offline',
      '<button class="btn sm" data-a="install">Install</button>'
    );
  else if (isIOS())
    install = row(
      'Install the app',
      'In Safari, tap Share, then “Add to Home Screen”.',
      '<span class="ds">Safari</span>'
    );
  else
    install = row(
      'Install the app',
      'Use your browser menu: “Install app” or “Add to Home screen”.',
      '<span class="ds">Browser menu</span>'
    );
  const imp = G.importData
    ? `<div class="job" style="border-color:var(--gold)"><b>Replace your saves with this backup?</b><span style="color:var(--muted);font-size:13px">Backup from ${esc(G.importData.date || 'an unknown date')} · ${Object.keys(G.importData.data).length} save slots. Everything on this device is replaced and the game restarts.</span>
      <div class="row"><button class="btn sm" data-a="importok">Replace and restart</button><button class="btn sm ghost" data-a="importno">Cancel</button></div></div>`
    : G.importErr
      ? `<p class="say"><b>Import failed</b>${esc(G.importErr)}</p>`
      : '';
  // The claude.ai preview can't download or pick files, so backups are only offered on the real site.
  if (/claude\.ai|claudeusercontent/.test(location.hostname)) return install;
  return (
    install +
    row(
      'Save backup',
      'Download every save (campaign, Sprawl, Arena scores, your legend) as a file, or load one from another device',
      '<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ghost" data-a="export">Export</button><button class="btn sm ghost" data-a="import">Import</button></span>'
    ) +
    imp +
    `<p class="ds" style="margin-top:8px">Version ${esc(typeof APP_VERSION !== 'undefined' ? APP_VERSION : 'dev')}${PWA.waiting ? ' · update ready' : ''}</p>`
  );
}

/* ---------- service worker and updates ---------- */
const updBar = document.getElementById('updBar');
function pwaRegister() {
  if (!PWA.canSW) return;
  navigator.serviceWorker
    .register('sw.js')
    .then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) PWA.waiting = reg.waiting;
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w)
          w.addEventListener('statechange', () => {
            // Only prompt when an older version is already in charge; the very first install needs no reload.
            if (w.state === 'installed' && navigator.serviceWorker.controller) PWA.waiting = w;
          });
      });
      const check = () => reg.update().catch(() => {});
      setInterval(check, 30 * 60 * 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) check();
      });
    })
    .catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || !PWA.applying) return;
    reloading = true;
    location.reload();
  });
}
/** Save what can be saved, then let the waiting worker take over (which reloads the page). */
function pwaApplyUpdate() {
  try {
    saveLeg();
    if (G.world && G.wd) saveWorld();
  } catch (err) {}
  PWA.applying = true;
  if (PWA.waiting) PWA.waiting.postMessage({ type: 'SKIP_WAITING' });
  else location.reload();
}
// Show the update bar only between fights, never in the middle of one.
setInterval(() => {
  if (!updBar) return;
  const show = !!PWA.waiting && G.mode !== 'play' && G.mode !== 'den' && G.mode !== 'hack';
  if (updBar.hidden === show) updBar.hidden = !show;
}, 500);
if (updBar)
  updBar.addEventListener('click', e => {
    const a = e.target.closest('[data-u]');
    if (!a) return;
    if (a.dataset.u === 'go') pwaApplyUpdate();
    else {
      PWA.waiting = null;
      updBar.hidden = true;
    }
  });

/* ---------- storage ---------- */
// Ask once, after the player has done something, for storage the browser won't clear under pressure.
addEventListener(
  'pointerdown',
  () => {
    try {
      if (navigator.storage && navigator.storage.persist)
        navigator.storage.persisted().then(p => {
          if (!p) navigator.storage.persist();
        });
    } catch (err) {}
  },
  { once: true }
);

/* ---------- save backups ---------- */
const SAVE_PREFIX = 'cs_';
function pwaExport() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(SAVE_PREFIX)) data[k] = localStorage.getItem(k);
    }
  } catch (err) {}
  const date = new Date().toISOString().slice(0, 10);
  const blob = new Blob([JSON.stringify({ app: 'cyber-city-tactics', v: 1, date, data }, null, 1)], {
    type: 'application/json'
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `cyber-city-tactics-save-${date}.json`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(a.href);
    a.remove();
  }, 1000);
}
function pwaImportPick() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    f.text().then(t => pwaImportText(t));
  };
  inp.click();
}
/** Validate a backup file's text; on success the Settings screen asks for confirmation. */
function pwaImportText(t) {
  G.importData = null;
  G.importErr = null;
  try {
    const o = JSON.parse(t);
    if (!o || o.app !== 'cyber-city-tactics' || !o.data || typeof o.data !== 'object')
      throw new Error('not a backup');
    const keys = Object.keys(o.data).filter(k => k.startsWith(SAVE_PREFIX) && typeof o.data[k] === 'string');
    if (!keys.length) throw new Error('empty');
    for (const k of keys) JSON.parse(o.data[k]); // every slot must be valid JSON
    G.importData = { date: o.date, data: Object.fromEntries(keys.map(k => [k, o.data[k]])) };
  } catch (err) {
    G.importErr = "That file isn't a Cyber City Tactics save backup.";
  }
  if (G.mode === 'settings') renderOv();
}
function pwaImportApply() {
  const d = G.importData;
  if (!d) return;
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(SAVE_PREFIX)) localStorage.removeItem(k);
    }
    for (const k in d.data) localStorage.setItem(k, d.data[k]);
  } catch (err) {}
  location.reload();
}

/* ---------- app shortcuts ---------- */
function pwaShortcut() {
  const go = new URLSearchParams(location.search).get('go');
  const to = { daily: 'arenapick', arena: 'arenapick', sprawl: 'worldpick', codex: 'codex' }[go];
  if (!to) return;
  if (to === 'codex') G.cxTab = 'feats';
  setMode(to);
  try {
    history.replaceState(null, '', location.pathname);
  } catch (err) {}
}

/* ===== src/js/main.js ===== */
/* Cyber City Tactics · src/js/main.js
 * The fixed-timestep game loop and boot.
 * Loaded as a classic script: every file shares one global scope, in the order listed in index.html. */
/* ================= loop ================= */
let last = performance.now(),
  acc = 0,
  tick = 0;
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  pollPads();
  while (acc >= 1000 / 60) {
    tick++;
    let ran = true;
    if (G.mode === 'play' || G.mode === 'den') {
      if (G.stop > 0) {
        G.stop--;
        ran = false;
      } else if (G.slow > 0) {
        G.slow--;
        if (tick % 3 === 0) update();
        else ran = false;
      } else {
        update();
        if (tick % 4 === 0 && modOn('turbo') && G.mode === 'play') update();
      }
    } else if (G.mode === 'title') attractStep();
    else if (G.mode === 'hack') hackStep();
    // keep presses made during hit-stop or slow-mo frames until a frame actually processes them
    if (ran) for (const s of INP) for (const k in s.pressed) s.pressed[k] = false;
    acc -= 1000 / 60;
  }
  render();
  if (tick % 6 === 0) updateTouchUI();
  requestAnimationFrame(frame);
}
applyPrefs();
fit();
attract();
setMode('title');
musicPlay('title');
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
setTimeout(fit, 300);
pwaRegister();
pwaShortcut();

})();
</script>
