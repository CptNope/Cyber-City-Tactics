<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>html, body { margin: 0; background: var(--ink); }</style>
</head>
<body>
<div class="cct-preview">
<div class="card" style="padding:0;max-width:none;overflow:visible">
  <h1 class="wordmark" aria-label="Cyber City Tactics"><span class="wm-city">Cyber City</span><span class="wm-bar">Tactics</span></h1>
</div>
<div style="display:flex;align-items:center;gap:14px;margin-top:22px;font:600 34px/0.82 var(--font-display);text-transform:uppercase">
  <span class="wordmark" style="display:flex;align-items:center;gap:12px"><span class="wm-city">Cyber City</span><span class="wm-bar" style="font-size:.62em">Tactics</span></span>
  <span style="font:11px var(--font-body);letter-spacing:.18em;color:var(--muted)">HORIZONTAL LOCKUP</span>
</div>
</div>
</body>
</html>
