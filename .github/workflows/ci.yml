name: CI

# Every push and pull request: the build must be up to date, the headless tests (including the bot
# playthroughs) must pass, and the game must load and play in a real browser.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: CI checks the code and never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # exact versions from package.json, and no install scripts from any package
      - name: Install dev tools
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build is up to date
        run: npm run check

      - name: Formatting
        # on a failure, show exactly what Prettier would change (a different local Prettier can disagree)
        run: |
          npx prettier --check "src/**/*.{js,css}" "tests/**/*.js" "tools/**/*.mjs" sw.js || {
            npx prettier --write "src/**/*.{js,css}" "tests/**/*.js" "tools/**/*.mjs" sw.js > /dev/null
            git --no-pager diff
            exit 1
          }

      - name: Headless tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:browser
        env:
          # the 3D check saves a picture of every district and place, to look over on each change
          SHOTS_DIR: ${{ runner.temp }}/shots-3d

      - name: Keep the 3D screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shots-3d
          path: ${{ runner.temp }}/shots-3d
          retention-days: 14
          if-no-files-found: ignore
