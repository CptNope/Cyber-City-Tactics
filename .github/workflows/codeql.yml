name: CodeQL

# GitHub's code scanner reads the game's JavaScript (and the lobby Worker) for security problems on every pull
# request, on main, and once a week. Findings show up in the Security tab and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned to a commit)
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3 (pinned to a commit)
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - dist
              - tests
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
