<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one-screen arcade cabinet — canvas fills the stage, touch pad below (portrait) or over the stage (landscape). Single dark look by design. */
:root{
  --ink:#0c0a14; --panel:#17121f; --panel2:#1f1830; --line:#30283f; --text:#efe9ff; --muted:#a79dc2;
  --neon:#ff3d8b; --mana:#45d2ff; --gold:#ffc63d; --ok:#7dffb0;
  --font-d:'Teko',Impact,'Arial Narrow',sans-serif;
  --font-b:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--font-b);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;position:relative}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#game{display:block;background:#000;border-radius:3px;box-shadow:0 0 0 1px var(--line)}
#pauseBtn{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:rgba(23,18,31,.7);color:var(--text);font:600 15px var(--font-b);cursor:pointer}
button:focus-visible{outline:2px solid var(--mana);outline-offset:2px}

#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(12,10,20,.9);z-index:5}
.card{width:100%;max-width:620px;max-height:100%;overflow:auto;box-sizing:border-box;padding:16px 18px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card h1{font:600 clamp(48px,11vw,84px)/.82 var(--font-d);margin:0;letter-spacing:.01em;text-shadow:-3px 0 var(--neon),3px 0 var(--mana);text-wrap:balance}
.card h2{font:600 clamp(32px,7vw,48px)/.9 var(--font-d);margin:0;letter-spacing:.02em;text-wrap:balance}
.card h3{font:600 22px/1 var(--font-d);margin:4px 0 0;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
.card p{margin:0;line-height:1.5;color:var(--muted);max-width:62ch}
.say{border-left:2px solid var(--neon);padding:4px 0 4px 12px;color:var(--text)!important;font-size:15px}
.say b{color:var(--neon);font-weight:600;letter-spacing:.06em;font-size:12px;display:block;text-transform:uppercase}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 13px var(--font-b);letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;border-radius:6px;border:1px solid var(--neon);background:var(--neon);color:#16040c;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.sm{padding:6px 10px;font-size:11.5px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.tab{font:600 12px var(--font-b);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--line);background:var(--panel2)}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;color:var(--muted)}
.keys b{color:var(--text);font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.item>div{min-width:0}
.item .nm{font-weight:600}
.item .ds{font-size:12.5px;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.r0{color:#e6e1f2}.r1{color:var(--mana)}.r2{color:var(--gold)}
.up{color:var(--ok)}.down{color:var(--neon)}
.wallet{font:600 26px var(--font-d);color:var(--gold);font-variant-numeric:tabular-nums}
.attrs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.attr{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px}
.attr .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.attr .v{font:600 30px/1 var(--font-d);font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:space-between;gap:6px}
.attr .h{font-size:11.5px;color:var(--muted)}
.derived{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.derived b{color:var(--text)}
.meter{height:6px;background:#2a2238;border-radius:3px;overflow:hidden}.meter i{display:block;height:100%;background:#b98cff}
.job{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.job .st{font-size:11px;letter-spacing:.14em;text-transform:uppercase}

#pad{display:none;justify-content:space-between;align-items:center;gap:12px;padding-block:8px 4px}
body.touch #pad{display:flex}
#stick{width:128px;height:128px;flex:none;border-radius:50%;border:2px solid var(--line);background:rgba(23,18,31,.6);position:relative;touch-action:none}
#knob{width:54px;height:54px;border-radius:50%;background:var(--panel);border:2px solid var(--muted);position:absolute;left:35px;top:35px;pointer-events:none}
#btns{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:8px}
.tb{border-radius:50%;border:2px solid var(--neon);background:rgba(255,61,139,.14);color:var(--text);font:600 10.5px var(--font-b);letter-spacing:.03em;touch-action:none;padding:0}
.tb.on{background:rgba(255,61,139,.45)}
.tb.gun{border-color:var(--gold);background:rgba(255,198,61,.12)}
.tb.spell{border-color:var(--mana);background:rgba(69,210,255,.12)}
.tb.util{border-color:var(--muted);background:rgba(167,157,194,.1);border-radius:14px}
.tb.jump{border-color:var(--muted);background:rgba(167,157,194,.12)}
@media (orientation:landscape){
  body.touch #pad{position:absolute;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px));pointer-events:none;opacity:.82}
  body.touch #pad>*{pointer-events:auto}
  #btns{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:6px}
}
@media (max-width:380px){#btns{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:6px}#stick{width:112px;height:112px}#knob{left:27px;top:27px}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Chrome and Sorcery game screen"></canvas>
    <button id="pauseBtn" aria-label="Pause">II</button>
    <div id="ov"></div>
  </div>
  <div id="pad" aria-hidden="true">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button class="tb util" data-act="item">MEDKIT</button>
      <button class="tb util" data-act="swap">SWAP</button>
      <button class="tb util" data-act="sheet">CHAR</button>
      <button class="tb gun" data-act="gun">GUN</button>
      <button class="tb spell" data-act="spell">SPELL</button>
      <button class="tb jump" data-act="jump">JUMP</button>
      <button class="tb" data-act="punch">PUNCH</button>
      <button class="tb" data-act="kick">KICK</button>
      <button class="tb util" data-act="pause">||</button>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=480,H=270,FY0=170,FY1=262;
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const ov=document.getElementById('ov');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let SCALE=1;
function fit(){
  const r=document.getElementById('stage').getBoundingClientRect();
  let w=r.width,h=w*H/W; if(h>r.height){h=r.height;w=h*W/H;}
  w=Math.max(120,Math.floor(w));h=Math.max(68,Math.floor(h));
  cvs.style.width=w+'px';cvs.style.height=h+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cvs.width=Math.round(w*dpr);cvs.height=Math.round(h*dpr);SCALE=cvs.width/W;
}
addEventListener('resize',fit);

/* ---------- utils ---------- */
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function srng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- audio ---------- */
let muted=false;
const A={ac:null,
  unlock(){if(!this.ac){try{this.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(this.ac&&this.ac.state==='suspended')this.ac.resume();},
  tone(f,d,type,v,slide){const a=this.ac;if(!a||muted)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);},
  noise(d,v,cut){const a=this.ac;if(!a||muted)return;const t=a.currentTime,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut||2400;g.gain.value=v||.12;s.connect(f).connect(g).connect(a.destination);s.start(t);}
};
const sfx={
  hit(){A.noise(.07,.18,1800);A.tone(160,.08,'square',.05,-80)},
  heavy(){A.noise(.14,.25,900);A.tone(110,.15,'square',.07,-60)},
  whiff(){A.noise(.05,.05,4000)},
  shot(){A.noise(.13,.22,3200);A.tone(520,.07,'square',.04,-420)},
  click(){A.tone(1400,.03,'square',.03)},
  spell(){A.tone(260,.35,'sawtooth',.05,700);A.tone(390,.35,'triangle',.04,900)},
  heal(){A.tone(523,.2,'triangle',.05);setTimeout(()=>A.tone(784,.3,'triangle',.05),120)},
  boom(){A.noise(.35,.3,700);A.tone(90,.3,'sawtooth',.06,-50)},
  coin(){A.tone(988,.06,'square',.04);setTimeout(()=>A.tone(1480,.1,'square',.04),55)},
  jump(){A.tone(300,.12,'triangle',.05,250)},
  hurt(){A.tone(220,.18,'sawtooth',.06,-140)},
  zap(){A.tone(880,.12,'sawtooth',.035,-600)},
  buy(){A.tone(660,.07,'square',.04);setTimeout(()=>A.tone(990,.12,'square',.04),70)},
  loot(){A.tone(740,.08,'triangle',.05);setTimeout(()=>A.tone(1110,.08,'triangle',.05),80);setTimeout(()=>A.tone(1480,.14,'triangle',.05),160)},
  level(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>A.tone(f,.18,'square',.05),i*90))}
};

/* ---------- input ---------- */
const held={},pressed={};
const KEY={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  KeyJ:'punch',KeyZ:'punch',KeyK:'kick',KeyX:'kick',Space:'jump',KeyL:'jump',KeyC:'sheet',Tab:'sheet',KeyU:'gun',KeyV:'gun',KeyI:'spell',KeyB:'spell',
  KeyQ:'swap',KeyH:'item',Escape:'pause',KeyP:'pause'};
function press(a){if(!held[a])pressed[a]=true;held[a]=true;A.unlock();
  if(a==='pause')togglePause();
  if(a==='sheet'){if(G.mode==='play')setMode('sheet');else if(G.mode==='sheet')setMode('play');}}
function release(a){held[a]=false;}
addEventListener('keydown',e=>{const a=KEY[e.code];if(!a)return;if(G.mode!=='play'&&a!=='pause'&&a!=='sheet')return;e.preventDefault();if(e.repeat)return;press(a);});
addEventListener('keyup',e=>{const a=KEY[e.code];if(a)release(a);});
addEventListener('blur',()=>{for(const k in held)held[k]=false;});
if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
addEventListener('touchstart',()=>{document.body.classList.add('touch');fit();},{once:true,passive:true});

const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null,sc={x:0,y:0};
function stickSet(dx,dy){const R=40,m=Math.hypot(dx,dy);if(m>R){dx=dx/m*R;dy=dy/m*R;}knob.style.transform=`translate(${dx}px,${dy}px)`;const dz=11;
  held.left=dx<-dz;held.right=dx>dz;held.up=dy<-dz;held.down=dy>dz;}
stick.addEventListener('pointerdown',e=>{e.preventDefault();A.unlock();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);const r=stick.getBoundingClientRect();sc={x:r.left+r.width/2,y:r.top+r.height/2};stickSet(e.clientX-sc.x,e.clientY-sc.y);});
stick.addEventListener('pointermove',e=>{if(e.pointerId!==stickId)return;stickSet(e.clientX-sc.x,e.clientY-sc.y);});
const stickEnd=e=>{if(e.pointerId!==stickId)return;stickId=null;stickSet(0,0);};
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
document.querySelectorAll('.tb').forEach(b=>{const a=b.dataset.act;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');press(a);});
  const up=()=>{b.classList.remove('on');release(a);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.getElementById('pauseBtn').addEventListener('click',()=>togglePause());

/* ---------- content ---------- */
const PAL={player:{skin:'#e0b08f',coat:'#1f4a52',coat2:'#163a40',pants:'#262033',hair:'#191420',acc:'#ff3d8b',boot:'#0e0b14',cyber:'#9fe9ff'}};
const DEF={
  ganger:{name:'Ganger',hp:28,spd:.85,dmg:6,reach:22,cool:72,scale:1,creds:[6,14],karma:10,style:'mohawk',pal:{skin:'#c98a6b',coat:'#3d2f52',coat2:'#2c2240',pants:'#22324a',hair:'#ff3d8b',acc:'#ffc63d',boot:'#141018'}},
  orc:{name:'Orc bruiser',hp:56,spd:.7,dmg:10,reach:24,cool:86,scale:1.15,creds:[12,22],karma:18,style:'tusks',pal:{skin:'#7d9a5a',coat:'#5a3030',coat2:'#432222',pants:'#2b2b2b',hair:'#141414',acc:'#ece4c6',boot:'#141010'}},
  sec:{name:'Corp security',hp:34,spd:.8,dmg:9,reach:22,cool:115,scale:1,ranged:'bullet',range:135,creds:[14,24],karma:16,style:'helmet',pal:{skin:'#d6a37f',coat:'#2b4a7a',coat2:'#1f3860',pants:'#1c2a44',hair:'#a9dcff',acc:'#a9dcff',boot:'#10141e'}},
  shaman:{name:'Street shaman',hp:30,spd:.75,dmg:11,reach:20,cool:150,scale:1,ranged:'hex',range:150,creds:[16,26],karma:20,style:'feathers',pal:{skin:'#b58b6e',coat:'#5b2f7a',coat2:'#46225f',pants:'#3a1f4f',hair:'#ece4c6',acc:'#45d2ff',boot:'#1a1020'}},
  drone:{name:'Drone',hp:18,spd:1.1,dmg:7,reach:0,cool:125,scale:1,ranged:'bullet',range:120,fly:true,creds:[10,18],karma:12},
  troll:{name:'Gutter King',hp:220,spd:.75,dmg:15,reach:30,cool:80,scale:1.45,boss:true,charge:3.2,creds:[90,120],karma:90,style:'horns',pal:{skin:'#8a7ea6',coat:'#5a3a2a',coat2:'#432a1e',pants:'#2a2420',hair:'#ece4c6',acc:'#ff6a3d',boot:'#16110e'}},
  blade:{name:'Razor Mei',hp:200,spd:1.15,dmg:13,reach:26,cool:55,scale:1.08,boss:true,charge:4.4,creds:[110,140],karma:120,style:'blade',pal:{skin:'#e3b896',coat:'#2a2a33',coat2:'#1c1c24',pants:'#15151b',hair:'#f2f2f7',acc:'#ff3d8b',boot:'#0b0b10'}},
  archmage:{name:'Director Voss',hp:270,spd:.8,dmg:13,reach:24,cool:100,scale:1.12,boss:true,ranged:'hex3',range:160,teleport:true,creds:[0,0],karma:0,style:'mage',pal:{skin:'#d9c2b0',coat:'#e9e4f2',coat2:'#bdb4d0',pants:'#2b2540',hair:'#4a3d6b',acc:'#ffc63d',boot:'#1a1426'}}
};
const STAGES=[
  {name:'Rustline Barrens',sub:'Gang turf under the dead monorail',len:1500,sky:['#1d1033','#4a1a3a'],moon:'#ff9f6b',far:'#241838',near:'#2f2140',win:'#ffb36b',wall:'#1d1626',ground:['#2a2134','#17121f'],line:'#3a2d48',rain:true,
    signs:[['NOODLE','#ff3d8b'],['PAWN','#ffc63d'],['24H','#45d2ff'],['SOYCAF','#ff6a3d'],['TALISMAN','#b98cff']],
    waves:[{at:110,spawn:['ganger','ganger']},{at:400,spawn:['ganger','orc','ganger']},{at:700,spawn:['shaman','ganger','ganger']},{at:960,spawn:['orc','ganger','orc','ganger']},{at:1020,boss:true,spawn:['troll','ganger']}]},
  {name:'Neon Market',sub:'Black clinics and street docs, three levels deep',len:1700,sky:['#071a2a','#123a4a'],moon:'#9ff0ff',far:'#0e2434',near:'#15303f',win:'#6cf2ff',wall:'#0f1c26',ground:['#152733','#0b141b'],line:'#203a48',rain:true,
    signs:[['CYBERDOC','#45d2ff'],['RAMEN','#ff3d8b'],['CHIPS','#ffc63d'],['MOJO','#b98cff'],['GUNS','#ff6a3d']],
    waves:[{at:120,spawn:['ganger','sec']},{at:420,spawn:['drone','sec','orc']},{at:740,spawn:['sec','sec','ganger']},{at:1000,spawn:['shaman','sec','drone']},{at:1220,boss:true,spawn:['blade','drone']}]},
  {name:'Kagemori Arcology',sub:'Top floor. The Director is waiting.',len:1700,sky:['#120e1c','#2a2440'],moon:'#ffc63d',far:'#1b1730',near:'#262040',win:'#ffe2a0',wall:'#1a1626',ground:['#2a2536','#14111d'],line:'#3a3350',rain:false,
    signs:[['KAGEMORI','#ffc63d'],['SECURE','#45d2ff'],['LAB 7','#ff3d8b'],['AUTHORIZED','#ffc63d']],
    waves:[{at:120,spawn:['sec','sec','drone']},{at:430,spawn:['shaman','sec','orc']},{at:760,spawn:['drone','drone','sec','orc']},{at:1040,spawn:['shaman','shaman','sec']},{at:1220,boss:true,spawn:['archmage','sec']}]}
];

/* ---------- RPG data ---------- */
const ATTRS={bod:{name:'Body',hint:'Max HP and armor'},str:{name:'Strength',hint:'Punch and kick damage'},agi:{name:'Agility',hint:'Speed, gun damage, crits'},mag:{name:'Magic',hint:'Mana, spell power, regen'}};
const BASES={
  weapon:{pipe:{name:'Lead pipe',dmg:3,reach:2,price:40,look:'pipe'},baton:{name:'Shock baton',dmg:5,reach:4,price:90,look:'baton'},katana:{name:'Katana',dmg:8,reach:8,price:180,look:'blade'},whip:{name:'Monowhip',dmg:11,reach:14,price:320,look:'whip'}},
  gun:{light:{name:'Streetline pistol',dmg:11,fire:'single',price:50},heavy:{name:'Heavy pistol',dmg:17,fire:'single',price:120},smg:{name:'Machine pistol',dmg:8,fire:'burst',price:170},shot:{name:'Sawed-off shotgun',dmg:22,fire:'spread',price:220}},
  armor:{coat:{name:'Lined coat',arm:3,price:40},jacket:{name:'Armor jacket',arm:6,price:110},weave:{name:'Form-fit weave',arm:4,price:130,bonus:{agi:1}},vest:{name:'Riot vest',arm:9,price:200}}
};
const FIRE={single:'single shot',burst:'3-round burst',spread:'close-range spread'};
const RAR=[{n:'Street',m:1},{n:'Tuned',m:1.25},{n:'Prototype',m:1.55}];
const SPELLS={
  fire:{name:'Fireball',cost:20,desc:'Explodes on contact and knocks down everything nearby.',req:0,price:0},
  bolt:{name:'Manabolt',cost:10,desc:'A fast bolt of raw mana. Cheap and hard-hitting, one target.',req:3,price:140},

function genBg(si){
  const S=STAGES[si],r=srng(1000+si*77);const far=[],near=[];
  let x=-40;while(x<S.len*.25+W+60){const w=24+r()*46,h=50+r()*95;const wins=[];for(let wy=8;wy<h-6;wy+=9)for(let wx=5;wx<w-6;wx+=8)if(r()<.22)wins.push([wx,wy]);far.push({x,w,h,wins});x+=w+2+r()*6;}
  x=-60;let si2=0;while(x<S.len*.55+W+80){const w=56+r()*70,h=70+r()*80;const wins=[];for(let wy=10;wy<h-8;wy+=12)for(let wx=7;wx<w-8;wx+=11)if(r()<.3)wins.push([wx,wy]);
    const b={x,w,h,wins};if(r()<.7){const sg=S.signs[si2++%S.signs.length];b.sign={t:sg[0],c:sg[1],vert:r()<.35,dx:6+r()*(w-50),dy:12+r()*(h*.4)};}near.push(b);x+=w+10+r()*30;}
  return{far,near};
}

/* ---------- combat ---------- */
function setS(e,s){e.state=s;e.t=0;e.didHit=false;}
function hurt(t,dmg,dir,o){
  o=o||{};
  if(t.state==='dead'||t.inv>0)return false;
  if(t.state==='down'&&!o.air)return false;
  if(t===P)dmg=dmg*20/(20+P.D.armor);
  else if(o.fromP&&Math.random()<P.D.crit){dmg*=1.8;o.crit=true;}
  dmg=Math.max(1,Math.round(dmg));
  t.hp-=dmg;t.flash=8;t.x+=dir*(o.kb||3);t.face=-dir;
  if(G.t-t.lastHit>50)t.hits=0;t.lastHit=G.t;t.hits++;
  burst(t.x,t.y,t.z+(t.d&&t.d.fly?0:28),o.col||'#fff3c4',o.big||o.crit?14:7);
  G.texts.push({x:t.x+rand(-4,4),y:t.y,z:t.z+50,s:(o.crit?'CRIT ':'')+dmg,c:t===P?'#ff3d8b':o.crit?'#ffc63d':(o.col||'#efe9ff'),life:34,big:o.crit});
  G.stop=o.big||o.crit?5:3;G.shake=Math.max(G.shake,o.big?6:o.crit?4:2);
  (o.big||o.crit?sfx.heavy:sfx.hit)();
  if(t.hp<=0){kill(t,dir);return true;}
  const boss=t.d&&t.d.boss;
  if(boss){if(o.kd&&Math.random()<.35){setS(t,'down');t.vz=2.2;t.vx=dir*1.6;t.hits=0;}return true;}
  if(t.d&&t.d.fly){t.x+=dir*6;return true;}
  if(o.kd||t.hits>=3){setS(t,'down');t.vz=2.8;t.vx=dir*2.2;t.hits=0;if(t===P)sfx.hurt();}
  else{setS(t,'hurt');if(t===P)sfx.hurt();}
  return true;
}
function drop(k,x,y,extra){G.picks.push(Object.assign({k,x:clamp(x,G.camX+18,G.camX+W-18),y:clamp(y,FY0+4,FY1),t:0},extra||{}));}
function kill(t,dir){
  setS(t,'dead');t.vz=3.2;t.vx=dir*2.6;t.hp=0;
  if(t===P){P.dead=true;return;}
  const d=t.d;
  if(d.boss)G.texts.push({x:t.x,y:t.y,z:t.z+64,s:'FLATLINED',c:'#efe9ff',life:60});
  gainKarma(Math.round(d.karma*(1+G.stage*.3)));
  contractTick(t.kind);
  const c=ri(d.creds[0],d.creds[1]);if(c>0)drop('cred',t.x,t.y,{v:c});
  const C=P.contract;
  if(t.kind==='sec'&&C&&C.key==='chip'&&!C.done&&Math.random()<.6)drop('chip',t.x-8,t.y-4);
  if(d.boss)drop('gear',t.x+14,t.y+2,{item:randItem(G.stage,true)});
  else if(Math.random()<.09)drop('gear',t.x+12,t.y+2,{item:randItem(G.stage,false)});
  const r=Math.random();
  if(r<.12)drop('med',t.x+10,t.y+4);
  else if(r<.25)drop('ammo',t.x-10,t.y+4);
  else if(r<.35)drop('mana',t.x+6,t.y-4);
  if(d.boss){G.shake=10;burst(t.x,t.y,30,'#ffc63d',30);}
}
function inZ(att,t){const tz=t.d&&t.d.fly?t.z-12:t.z;return tz<=att.z+14&&tz>=att.z-30;}
function strike(att,reach,dmg,o){
  let hit=false;o=o||{};if(att===P)o.fromP=true;
  for(const t of G.ents){
    if(t.team===att.team||t.state==='dead')continue;
    if(t.state==='down'&&!o.air)continue;
    const sc=(t.d&&t.d.scale)||1;const dx=(t.x-att.x)*att.face;
    if(dx<-6||dx>reach+6*sc)continue;
    if(Math.abs(t.y-att.y)>9*sc)continue;
    if(!inZ(att,t))continue;
    if(hurt(t,dmg,att.face,Object.assign({},o)))hit=true;
  }
  return hit;
}
function hitbox(t){const sc=(t.d&&t.d.scale)||1;if(t.d&&t.d.fly)return[t.z-10,t.z+12];return[t.z+2,t.z+46*sc];}
function burst(x,y,z,col,n){if(RM)n=Math.ceil(n/2);for(let i=0;i<n;i++)G.parts.push({x,y,z,vx:rand(-2,2),vy:rand(-.4,.4),vz:rand(.5,3),life:ri(14,26),c:col,sz:rand(1,2.4)});}

/* ---------- player ---------- */
function physics(e){
  const fly=e.d&&e.d.fly&&e.state!=='dead';
  if(fly)return;
  if(e.z>0||e.vz!==0){e.vz-=.28;e.z+=e.vz;e.x+=e.vx;if(e.z<=0){e.z=0;e.vz=0;e.vx=0;}}
}
function useItem(){
  if(P.med>0&&P.hp<P.maxHp){P.med--;const n=Math.round(P.maxHp*.45);P.hp=Math.min(P.maxHp,P.hp+n);sfx.heal();burst(P.x,P.y,30,'#7dffb0',12);G.texts.push({x:P.x,y:P.y,z:60,s:'+'+n+' HP',c:'#7dffb0',life:40});}
  else{sfx.click();G.texts.push({x:P.x,y:P.y,z:60,s:P.med?'HP FULL':'NO MEDKITS',c:'#a79dc2',life:40,sm:true});}
}
function upPlayer(){
  const p=P,D=p.D;p.t++;if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;
  const wasAir=p.z>0;
  physics(p);
  if(p.mp<p.maxMp&&G.t%D.regen===0)p.mp++;
  if(p.state==='dead'){if(p.t>100)respawn();return;}
  if(p.state==='down'){if(p.t>50){setS(p,'idle');p.inv=60;}return;}
  if(p.state==='hurt'){if(p.t>15)setS(p,'idle');return;}
  if((p.state==='jump'||p.state==='jkick')&&wasAir&&p.z===0)setS(p,'idle');
  if(pressed.item)useItem();
  if(pressed.swap&&p.spells.length>1){p.spell=(p.spell+1)%p.spells.length;sfx.click();G.texts.push({x:p.x,y:p.y,z:60,s:SPELLS[p.spells[p.spell]].name.toUpperCase(),c:'#45d2ff',life:40,sm:true});}
  const busy={punch:13,upper:20,kick:20,shoot:13,cast:24};
  if(busy[p.state]){
    const t=p.t,m=D.melee,R=D.reach;
    if(p.state==='punch'&&t===4){if(!strike(p,22+R,4+m*.65))sfx.whiff();}
    if(p.state==='upper'&&t===6){if(!strike(p,24+R,8+m*.9,{kd:true,kb:6}))sfx.whiff();}
    if(p.state==='kick'&&t===7){if(!strike(p,30+R*.6,6+m*.8,{kb:7}))sfx.whiff();}
    if(p.state==='shoot'){const g=p.eq.gun;if(g){if(g.fire==='burst'){if(t===2||t===6||t===10)fireBullet(p,D.gun,p.z+27);}else if(t===3)fireBullet(p,D.gun,p.z+27,g.fire==='spread');}}
    if(p.state==='cast'&&t===10)castSpell(p);
    if(t>=busy[p.state])setS(p,'idle');
    return;
  }
  let dx=(held.right?1:0)-(held.left?1:0),dy=(held.down?1:0)-(held.up?1:0);
  const air=p.z>0||p.vz>0;
  p.x+=dx*(air?D.spd+.15:D.spd);p.y+=dy*(air?.6:D.spd*.63);
  if(dx)p.face=dx;
  if(p.state==='jkick'&&!p.didHit){if(strike(p,26+D.reach*.5,7+D.melee*.9,{kd:true,air:true,kb:6}))p.didHit=true;}
  if(!air){
    if(pressed.jump){p.vz=4.7;setS(p,'jump');sfx.jump();}
    else if(pressed.punch){if(G.t-p.lastPunch<30)p.combo++;else p.combo=1;p.lastPunch=G.t;if(p.combo>=3){p.combo=0;setS(p,'upper');}else setS(p,'punch');}
    else if(pressed.kick){setS(p,'kick');}
    else if(pressed.gun){if(!p.eq.gun){sfx.click();G.texts.push({x:p.x,y:p.y,z:56,s:'NO GUN',c:'#ffc63d',life:40,sm:true});}else if(p.ammo>0){setS(p,'shoot');}else{sfx.click();G.texts.push({x:p.x,y:p.y,z:56,s:'NO AMMO',c:'#ffc63d',life:40,sm:true});}}
    else if(pressed.spell){const sp=SPELLS[p.spells[p.spell]];if(p.mp>=sp.cost){p.mp-=sp.cost;setS(p,'cast');sfx.spell();}else{sfx.click();G.texts.push({x:p.x,y:p.y,z:56,s:'NO MANA',c:'#45d2ff',life:40,sm:true});}}
    else{const mv=dx||dy;if(mv){if(p.state!=='walk')setS(p,'walk');p.walk+=D.spd/1.75;}else if(p.state!=='idle')setS(p,'idle');}
  }else if(p.state==='jump'&&(pressed.punch||pressed.kick)){p.state='jkick';p.didHit=false;}
  p.y=clamp(p.y,FY0+6,FY1);p.x=clamp(p.x,G.camX+10,G.camX+W-10);
}
function respawn(){
  P.lives--;
  if(P.contract&&P.contract.key==='ghost'&&!P.contract.done)P.contract.failed=true;
  P.lostLife=true;
  if(P.lives<0){P.lives=0;setMode('over');return;}
  P.hp=P.maxHp;P.mp=Math.max(P.mp,Math.round(P.maxMp/2));setS(P,'idle');P.dead=false;P.inv=120;P.z=30;P.vz=0;P.vx=0;
  for(const e of G.ents)if(e.team&&e.state!=='dead'&&Math.abs(e.x-P.x)<70)hurt(e,4,e.x>P.x?1:-1,{kd:true,kb:16});
  G.texts.push({x:P.x,y:P.y,z:70,s:'BACK IN',c:'#45d2ff',life:60});
}
function fireBullet(src,dmg,z,spread){
  if(src===P){if(P.ammo<=0)return;P.ammo--;sfx.shot();}else sfx.zap();
  if(spread){for(let i=-1;i<=1;i++)G.projs.push({k:'bullet',team:src.team,x:src.x+src.face*18,y:src.y+i*5,z,vx:src.face*6.5,dmg:dmg*.55,life:20});}
  else G.projs.push({k:'bullet',team:src.team,x:src.x+src.face*18,y:src.y,z,vx:src.face*6.2,dmg,life:90});
  burst(src.x+src.face*20,src.y,z,'#ffe28a',4);
}
function castSpell(p){
  const id=p.spells[p.spell],pw=p.D.spell;
  if(id==='fire')G.projs.push({k:'fire',team:0,x:p.x+p.face*16,y:p.y,z:p.z+28,vx:p.face*3.8,dmg:14+pw,life:130,r:6});
  if(id==='bolt')G.projs.push({k:'bolt',team:0,x:p.x+p.face*16,y:p.y,z:p.z+28,vx:p.face*7,dmg:10+pw*1.25,life:80,r:4});
  if(id==='heal'){const n=Math.round(20+pw*1.6);p.hp=Math.min(p.maxHp,p.hp+n);sfx.heal();burst(p.x,p.y,30,'#7dffb0',16);G.texts.push({x:p.x,y:p.y,z:64,s:'+'+n+' HP',c:'#7dffb0',life:44});}
}

/* ---------- enemies ---------- */
function upEnemy(e,slot){
  e.t++;if(e.flash>0)e.flash--;
  physics(e);
  if(e.state==='dead'){if(e.d.fly&&e.z<=0)e.z=0;if(e.t>70)e.gone=true;return;}
  if(e.state==='down'){if(e.t>58){setS(e,'idle');e.inv=24;}return;}
  if(e.state==='hurt'){if(e.t>14)setS(e,'idle');return;}
  if(e.inv>0)e.inv--;
  const d=e.d,p=P;
  if(d.fly){e.hover+=.08;e.z=24+Math.sin(e.hover)*3;}
  if(e.state==='windup'){
    if(e.t===16&&!strike(e,d.reach,e.dmg,{kd:d.boss,kb:d.boss?8:4,big:d.boss}))A.noise(.04,.04,3000);
    if(e.t>=28){setS(e,'idle');e.cool=d.cool*rand(.7,1.3);}return;
  }
  if(e.state==='aim'){
    if(e.t===22){
      if(d.ranged==='bullet')fireBullet(e,e.dmg,e.z+(d.fly?0:27));
      else{const n=d.ranged==='hex3'?3:1;for(let i=0;i<n;i++)G.projs.push({k:'hex',team:1,x:e.x+e.face*16,y:e.y+(n>1?(i-1)*14:0),z:e.z+30,vx:e.face*2.4,dmg:e.dmg,life:170,r:5});sfx.zap();}
    }
    if(e.t>=34){setS(e,'idle');e.cool=d.cool*rand(.7,1.3);}return;
  }
  if(e.state==='charge'){
    e.x+=e.face*d.charge;e.walk+=2;
    if(!e.didHit&&strike(e,22,e.dmg+4,{kd:true,kb:10,big:true}))e.didHit=true;
    if(e.t>48||e.x<G.camX-30||e.x>G.camX+W+30){setS(e,'idle');e.cool=d.cool;e.x=clamp(e.x,G.camX-10,G.camX+W+10);}
    if(G.t%3===0)burst(e.x-e.face*10,e.y,4,'#8a7a9a',1);return;
  }
  if(e.state==='blink'){if(e.t===20){e.x=clamp(p.x+(Math.random()<.5?-1:1)*rand(110,150),G.camX+20,G.camX+W-20);e.y=clamp(p.y+rand(-12,12),FY0+8,FY1);burst(e.x,e.y,30,'#ffc63d',12);}if(e.t>=34)setS(e,'idle');return;}
  e.cool--;
  if(p.state==='dead'){setS(e,'idle');return;}
  const dx=p.x-e.x,dy=p.y-e.y,adx=Math.abs(dx),ady=Math.abs(dy);
  e.face=dx>=0?1:-1;
  let tx,ty=p.y;
  if(d.ranged){
    if(d.teleport&&e.cool<=0&&adx<60&&Math.random()<.04){setS(e,'blink');e.cool=d.cool;sfx.spell();return;}
    if(adx<d.reach+4&&ady<8&&e.cool<=0&&!d.fly){setS(e,'windup');return;}
    if(ady<7&&adx<230&&adx>50&&e.cool<=0){setS(e,'aim');return;}
    tx=clamp(p.x-Math.sign(dx||1)*d.range,G.camX+24,G.camX+W-24);
  }else{
    if(d.charge&&e.cool<=0&&ady<8&&adx>80&&adx<220&&Math.random()<.03){setS(e,'charge');sfx.heavy();return;}
    if(adx<d.reach+2&&ady<7&&e.cool<=0){setS(e,'windup');return;}
    const near=slot<2||d.boss;
    tx=p.x-Math.sign(dx||1)*(near?d.reach-4:70+slot*14);if(!near)tx=clamp(tx,G.camX+16,G.camX+W-16);
    ty=near?p.y:p.y+e.yoff*4;
  }
  const s=d.spd;let mx=clamp(tx-e.x,-s,s),my=clamp(ty-e.y,-s*.7,s*.7);
  if(Math.abs(tx-e.x)<1.2)mx=0;if(Math.abs(ty-e.y)<1)my=0;
  e.x+=mx;e.y+=my;e.y=clamp(e.y,FY0+6,FY1);
  if(mx||my){if(e.state!=='walk')setS(e,'walk');e.walk+=1;}else if(e.state!=='idle')setS(e,'idle');
}

/* ---------- world update ---------- */
function update(){
  G.t++;
  if(G.banner>0)G.banner--;else if(G.banner<0)G.banner++;
  if(G.goT>0&&!G.waveLive)G.goT--;
  upPlayer();
  const mel=G.ents.filter(e=>e.team&&e.state!=='dead'&&!e.d.ranged).sort((a,b)=>Math.abs(a.x-P.x)-Math.abs(b.x-P.x));
  mel.forEach((e,i)=>e.slot=i);
  for(const e of G.ents)if(e.team)upEnemy(e,e.slot||0);
  G.ents=G.ents.filter(e=>!e.gone);
  for(const pr of G.projs){
    pr.x+=pr.vx;pr.life--;
    if(pr.k==='hex'&&P.state!=='dead'){pr.y+=clamp(P.y-pr.y,-.25,.25);if(G.t%3===0)G.parts.push({x:pr.x,y:pr.y,z:pr.z,vx:0,vy:0,vz:.3,life:14,c:'#45d2ff',sz:1.6});}
    if(pr.k==='fire'&&G.t%2===0)G.parts.push({x:pr.x-pr.vx,y:pr.y,z:pr.z+rand(-3,3),vx:-pr.vx*.1,vy:0,vz:rand(.2,.8),life:16,c:Math.random()<.5?'#ff6a3d':'#ffc63d',sz:2});
    if(pr.k==='bolt')G.parts.push({x:pr.x-pr.vx*.5,y:pr.y,z:pr.z,vx:0,vy:0,vz:0,life:8,c:'#b98cff',sz:2});
    if(pr.x<G.camX-30||pr.x>G.camX+W+30)pr.life=0;
    if(pr.life<=0)continue;
    for(const t of G.ents){
      if(t.team===pr.team||t.state==='dead'||t.state==='down'||t.inv>0)continue;
      if(Math.abs(t.y-pr.y)>9||Math.abs(t.x-pr.x)>11)continue;
      const hb=hitbox(t);if(pr.z<hb[0]||pr.z>hb[1])continue;
      if(pr.k==='fire')explode(pr);
      else hurt(t,pr.dmg,Math.sign(pr.vx),{kb:5,col:pr.k==='hex'?'#45d2ff':pr.k==='bolt'?'#b98cff':'#ffe28a',kd:pr.k==='hex',fromP:pr.team===0});
      pr.life=0;break;
    }
  }
  G.projs=G.projs.filter(p=>p.life>0);
  for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.z+=q.vz;q.vz-=.15;if(q.z<0){q.z=0;q.vz*=-.3;q.vx*=.6;}q.life--;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const tx of G.texts){tx.z+=.5;tx.life--;}
  G.texts=G.texts.filter(t=>t.life>0);
  for(const k of G.picks){k.t++;if(P.state!=='dead'&&P.z<12&&Math.abs(k.x-P.x)<13&&Math.abs(k.y-P.y)<10)collect(k);}
  G.picks=G.picks.filter(k=>!k.got&&(k.t<1200||k.k==='gear'||k.k==='chip'));
  for(const r of G.rain){r.y+=r.s;r.x-=1.2;if(r.y>H){r.y=-10;r.x=rand(0,W+40);}}
  waves();camera();
  if(G.shake>0)G.shake*=.85;if(G.shake<.3)G.shake=0;
}
function collect(k){
  const say=(s,c)=>G.texts.push({x:P.x,y:P.y,z:62,s,c,life:46,sm:s.length>10});
  if(k.k==='cred'){P.creds+=k.v;sfx.coin();say('+¥'+k.v,'#ffc63d');}
  if(k.k==='med'){if(P.med>=5&&P.hp>=P.maxHp)return;if(P.med<5){P.med++;say('+1 MEDKIT','#7dffb0');}else{P.hp=Math.min(P.maxHp,P.hp+25);say('+25 HP','#7dffb0');}sfx.buy();}
  if(k.k==='ammo'){P.ammo+=8;sfx.buy();say('+8 AMMO','#ffe28a');}
  if(k.k==='mana'){P.mp=Math.min(P.maxMp,P.mp+30);sfx.buy();say('+30 MANA','#45d2ff');}
  if(k.k==='chip'){contractTick('chip');sfx.loot();say('DATA CHIP','#7dffb0');}
  if(k.k==='gear'){if(P.bag.length>=10){if(k.t%60===1)say('BAG FULL','#a79dc2');return;}P.bag.push(k.item);sfx.loot();say(k.item.name.toUpperCase(),['#efe9ff','#45d2ff','#ffc63d'][k.item.rar]);}
  k.got=true;
}
function waves(){
  const S=STAGES[G.stage];
  const foes=G.ents.filter(e=>e.team&&e.state!=='dead').length;
  if(G.waveLive&&foes===0){G.waveLive=false;G.lock=null;G.wave++;if(G.wave>=S.waves.length)G.exitOpen=true;G.goT=150;}
  if(!G.waveLive&&G.wave<S.waves.length){
    const w=S.waves[G.wave];
    if(G.camX>=w.at-1){G.camX=w.at;G.lock=w.at;G.waveLive=true;
      w.spawn.forEach((k,i)=>{const e=spawnEnemy(k,i%2?-1:1);e.x+=(i>>1)*(i%2?-18:18);if(DEF[k].boss){e.x=G.camX+W-40;e.y=(FY0+FY1)/2;e.inv=40;}});
      if(w.boss){G.banner=-120;if(P.contract&&P.contract.key==='ghost'&&!P.lostLife)contractTick('ghost');}
    }
  }
  if(G.exitOpen&&P.x>S.len-24&&P.state!=='dead')stageClear();
}
function camera(){
  const S=STAGES[G.stage];
  let target=P.x-W*.4;const next=S.waves[G.wave];let max=S.len-W;
  if(G.lock!=null)max=G.lock;else if(next)max=Math.min(max,next.at);
  target=clamp(target,0,max);if(G.lock!=null)target=G.lock;
  if(target>G.camX)G.camX=Math.min(target,G.camX+2.2);
  G.camX=Math.max(0,G.camX);
}
function explode(pr){
  sfx.boom();G.shake=7;burst(pr.x,pr.y,pr.z,'#ff6a3d',18);burst(pr.x,pr.y,pr.z,'#ffc63d',10);
  for(const t of G.ents){if(!t.team||t.state==='dead')continue;
    if(Math.abs(t.x-pr.x)<36&&Math.abs(t.y-pr.y)<16)hurt(t,pr.dmg,t.x>=pr.x?1:-1,{kd:true,kb:8,big:true,col:'#ff6a3d',air:true,fromP:true});}
}
function stageClear(){
  const C=P.contract,def=CONTRACTS[G.stage];
  const deb={stage:G.stage,title:C?C.title:'the job',done:!!(C&&C.done),creds:0,karma:0,prize:null,levels:0};
  if(deb.done){deb.creds=def.creds;deb.karma=def.karma;P.creds+=def.creds;if(def.prize){deb.prize=randItem(3,true);}}
  P.contract=null;
  const lvl0=P.lvl;if(deb.karma){P.karma+=deb.karma;while(P.karma>=karmaNext(P.lvl)){P.karma-=karmaNext(P.lvl);P.lvl++;P.pts+=2;}refresh(P);}
  deb.levels=P.lvl-lvl0;
  if(deb.prize){const pz=deb.prize;pz.rar=2;pz.name='Prototype '+BASES[pz.slot][pz.base].name;if(P.bag.length<10)P.bag.push(pz);}
  G.debrief=deb;
  if(G.stage>=STAGES.length-1){store.del('cs_save2');setMode('win');return;}
  P.hp=Math.min(P.maxHp,P.hp+Math.round(P.maxHp*.4));P.mp=P.maxMp;
  G.stock=[randItem(G.stage+1,false),randItem(G.stage+1,false),randItem(G.stage+1,true),randItem(G.stage,false)];
  G.hubTab='job';
  save('hub');
  setMode('hub');
}
function save(phase){store.set('cs_save2',Object.assign(playerSave(G.stage),{phase,stock:G.stock,debrief:G.debrief}));}

function fillPoly(pts,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);ctx.closePath();ctx.fill();}

  const rw=8+Math.sin(G.t*1.3)*6;ctx.strokeStyle='rgba(200,220,255,.55)';ctx.beginPath();ctx.moveTo(-12-rw/2,-8);ctx.lineTo(-12+rw/2,-8);ctx.moveTo(12-rw/2,-8);ctx.lineTo(12+rw/2,-8);ctx.stroke();
  fillPoly([-10,-4,10,-4,13,2,6,7,-8,7,-11,2],blink?'#ffffff':'#39405a');
  fillPoly([-10,-4,10,-4,8,-1,-8,-1],'#5d6680');

  if(m==='pause'){
    h=`<div class="card"><p class="eyebrow">Paused · District ${G.stage+1}</p><h2>Catch your breath</h2>${jobHtml(P.contract)}
    <div class="row"><button class="btn" data-a="resume">Resume</button><button class="btn ghost" data-a="sheet">Character${P.pts?` (${P.pts} pts)`:''}</button><button class="btn ghost" data-a="mute">${muted?'Sound off':'Sound on'}</button><button class="btn ghost" data-a="quit">Quit to title</button></div>${keysHtml}</div>`;
  }
  if(m==='hub')h=hubHtml();
  if(m==='over'){
    h=`<div class="card"><p class="eyebrow">District ${G.stage+1} · ${esc(STAGES[G.stage].name)}</p><h2 style="color:var(--neon)">Flatlined</h2>
    <p>You keep your level, karma, gear and cyberware. You restart this district with full health, three lives and half your creds. The contract resets.</p>
    <div class="row"><button class="btn" data-a="retry">Run it again</button><button class="btn ghost" data-a="quit">Quit to title</button></div></div>`;
  }
  if(m==='win'){
    const d=G.debrief||{};
    h=`<div class="card"><p class="eyebrow">Run complete · level ${P.lvl}</p><h1>Paid in full</h1>
    <p class="say"><b>Juno · fixer</b>${d.done?"Clean as a whistle. Nobody's going to believe a runner walked out of Kagemori without a scratch. Keep the prototype. You earned it.":"Voss is down and the vault is open. Messy, but paid is paid."}</p>
    <p>You walk out with ¥${P.creds}, ${P.bag.length} item${P.bag.length===1?'':'s'} in your bag and a cyberarm that still hums.</p>
    <div class="row"><button class="btn" data-a="new">New run</button></div></div>`;
  }
  ov.innerHTML=h;
  if(m==='title'||m==='pause'||m==='over'||m==='win'||m==='brief'){const f=ov.querySelector('.btn');if(f)f.focus({preventScroll:true});}
}
function hubHtml(){
  const d=G.debrief||{done:false,title:'the job'},nxt=STAGES[G.stage+1],tab=G.hubTab;
  const tabs=[['job','Fixer'],['doc','Street doc'],['fence','Fence'],['talis','Talismonger'],['char','Character']];
  const tabsH=`<div class="tabs" role="tablist">${tabs.map(([k,n])=>`<button class="tab" role="tab" aria-selected="${tab===k}" data-a="tab:${k}">${n}${k==='char'&&P.pts?'<span class="dot"></span>':''}</button>`).join('')}</div>`;
  let body='';
  if(tab==='job'){
    body=`<p class="say"><b>Juno · fixer</b>${d.done?`${esc(d.title)}: done. Here's your cut.`:`You didn't finish ${esc(d.title)}. No bonus this time, but you're still breathing.`}</p>
    <div class="job"><div class="row" style="justify-content:space-between"><b>Debrief</b><span class="st ${d.done?'up':'down'}">${d.done?'Paid':'No bonus'}</span></div>
    <span style="color:var(--muted);font-size:13px">${d.done?`+¥${d.creds} · +${d.karma} karma${d.levels?` · <span class="up">level up ×${d.levels}</span>`:''}`:'Contract rewards withheld.'}</span></div>
    <p>Next: <b style="color:var(--text)">${esc(nxt.name)}</b>. ${esc(nxt.sub)}.</p>`;
  }
  if(tab==='doc'){
    const cons=[{k:'med',n:'Medkit',ds:`Carry up to 5, use with H. Heals 45% HP. You have ${P.med}.`,c:30,ok:P.med<5},{k:'ammo',n:'Ammo box',ds:`+16 rounds. You have ${P.ammo}.`,c:30,ok:true}];
    body=`<p class="say"><b>Doc Kessler · street doc</b>Chrome costs essence, kid. Every piece I put in you is mana you won't get back.</p>
    <div class="list">${cons.map(c=>{const ok=c.ok&&P.creds>=c.c;return `<div class="item"><div><div class="nm">${c.n}</div><div class="ds">${c.ds}</div></div><div class="acts"><button class="btn sm${ok?'':' ghost'}" data-a="buy:${c.k}" ${ok?'':'disabled'}>¥${c.c}</button></div></div>`;}).join('')}
    ${Object.keys(CYBER).map(k=>{const cy=CYBER[k],l=P.cy[k],c=cy.cost(l),ok=l<3&&P.creds>=c;return `<div class="item"><div><div class="nm">${cy.name} <span style="color:var(--muted);font-weight:400">· ${l}/3</span></div><div class="ds">${cy.desc} Costs 6 max mana.</div></div><div class="acts"><button class="btn sm${ok?'':' ghost'}" data-a="cyber:${k}" ${ok?'':'disabled'}>${l>=3?'Maxed':'¥'+c}</button></div></div>`;}).join('')}</div>`;
  }
  if(tab==='fence'){
    body=`<p class="say"><b>Ratchet · fence</b>No receipts, no refunds, no questions. Selling? I pay forty cents on the nuyen.</p>
    <h3>For sale</h3><div class="list">${G.stock.length?G.stock.map(it=>{const ok=P.creds>=it.price&&P.bag.length<10;return `<div class="item"><div><div class="nm r${it.rar}">${esc(it.name)}</div><div class="ds">${SLOTN[it.slot]} · ${itemLine(it)} · ${cmp(it)}</div></div><div class="acts"><button class="btn sm${ok?'':' ghost'}" data-a="fbuy:${it.uid}" ${ok?'':'disabled'}>¥${it.price}</button></div></div>`;}).join(''):'<p>Sold out.</p>'}</div>
    <h3>Your bag</h3><div class="list">${P.bag.length?P.bag.map(it=>`<div class="item"><div><div class="nm r${it.rar}">${esc(it.name)}</div><div class="ds">${itemLine(it)}</div></div><div class="acts"><button class="btn sm ghost" data-a="sell:${it.uid}">Sell ¥${Math.round(it.price*.4)}</button></div></div>`).join(''):'<p>Nothing to sell.</p>'}</div>`;
  }
  if(tab==='talis'){
    body=`<p class="say"><b>Old Wen · talismonger</b>Magic isn't bought, it's earned. But I can sell you the formula. Whether you can hold it is your business.</p>
    <div class="list">${Object.keys(SPELLS).map(id=>{const s=SPELLS[id],have=P.spells.includes(id),okM=P.D.a.mag>=s.req,ok=!have&&okM&&P.creds>=s.price;
      return `<div class="item"><div><div class="nm">${s.name} <span style="color:var(--muted);font-weight:400">· ${s.cost} mana</span></div><div class="ds">${s.desc}${s.req?` Needs Magic ${s.req}.`:''}</div></div><div class="acts"><button class="btn sm${ok?'':' ghost'}" data-a="learn:${id}" ${ok?'':'disabled'}>${have?'Known':!okM?'Magic '+s.req:'¥'+s.price}</button></div></div>`;}).join('')}</div>`;
  }
  if(tab==='char')body=charHtml(true);
  return `<div class="card"><p class="eyebrow">Between jobs · Level ${P.lvl}</p><div class="row" style="justify-content:space-between;align-items:baseline"><h2>The Den</h2><span class="wallet">¥${P.creds}</span></div>
  ${tabsH}${body}<div class="row"><button class="btn" data-a="next">Next job: ${esc(nxt.name)}</button><button class="btn ghost" data-a="mute">${muted?'Sound off':'Sound on'}</button></div></div>`;
}
function findBag(uid){return P.bag.findIndex(i=>i.uid===uid);}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;A.unlock();
  const parts=b.dataset.a.split(':'),a=parts[0],arg=parts[1];
  const card=ov.querySelector('.card'),top=card?card.scrollTop:0;
  let keep=true;
  const rerender=()=>{renderOv();if(G.mode==='hub')save('hub');};
  switch(a){
    case 'new':P=newPlayer();briefing(0);keep=false;break;
    case 'cont':{const s=store.get('cs_save2');if(!s)break;loadPlayer(s);G.stage=s.stage;
      if(s.phase==='hub'){G.stock=s.stock||[];G.debrief=s.debrief||{done:false,title:'the job'};G.hubTab='job';setMode('hub');}
      else if(s.phase==='brief'){G.bg=genBg(s.stage);setMode('brief');}
      else startStage(s.stage);keep=false;break;}
    case 'mute':muted=!muted;renderOv();break;
    case 'go':startStage(G.stage);break;
    case 'resume':case 'close':setMode('play');break;
    case 'sheet':setMode(G.mode==='brief'?'briefsheet':'sheet');keep=false;break;
    case 'back':setMode('brief');break;
    case 'quit':attract();setMode('title');break;
    case 'retry':P.lives=3;P.creds=Math.floor(P.creds/2);P.ammo=Math.max(P.ammo,12);refresh(P);P.hp=P.maxHp;P.mp=P.maxMp;briefing(G.stage);break;
    case 'next':briefing(G.stage+1);keep=false;break;
    case 'tab':G.hubTab=arg;renderOv();keep=false;break;
    case 'attr':if(P.pts>0&&P.attr[arg]<10){P.attr[arg]++;P.pts--;const oh=P.maxHp,om=P.maxMp;refresh(P);P.hp+=Math.max(0,P.maxHp-oh);P.mp+=Math.max(0,P.maxMp-om);sfx.buy();}rerender();break;
    case 'equip':{const i=findBag(arg);if(i<0)break;const it=P.bag[i];const cur=P.eq[it.slot];P.bag.splice(i,1);if(cur)P.bag.push(cur);P.eq[it.slot]=it;refresh(P);sfx.click();rerender();break;}
    case 'unequip':{const it=P.eq[arg];if(it&&P.bag.length<10){P.bag.push(it);P.eq[arg]=null;refresh(P);sfx.click();}rerender();break;}
    case 'drop':{const i=findBag(arg);if(i>=0)P.bag.splice(i,1);rerender();break;}
    case 'sell':{const i=findBag(arg);if(i>=0){P.creds+=Math.round(P.bag[i].price*.4);P.bag.splice(i,1);sfx.coin();}rerender();break;}
    case 'spell':P.spell=+arg;rerender();break;
    case 'buy':if(arg==='med'&&P.creds>=30&&P.med<5){P.creds-=30;P.med++;sfx.buy();}if(arg==='ammo'&&P.creds>=30){P.creds-=30;P.ammo+=16;sfx.buy();}rerender();break;
    case 'cyber':{const l=P.cy[arg],c=CYBER[arg].cost(l);if(l<3&&P.creds>=c){P.creds-=c;P.cy[arg]++;refresh(P);sfx.buy();}rerender();break;}
    case 'fbuy':{const i=G.stock.findIndex(x=>x.uid===arg);if(i>=0&&P.creds>=G.stock[i].price&&P.bag.length<10){P.creds-=G.stock[i].price;P.bag.push(G.stock[i]);G.stock.splice(i,1);sfx.loot();}rerender();break;}
    case 'learn':{const s=SPELLS[arg];if(!P.spells.includes(arg)&&P.D.a.mag>=s.req&&P.creds>=s.price){P.creds-=s.price;P.spells.push(arg);sfx.level();}rerender();break;}
  }
  if(keep){const c2=ov.querySelector('.card');if(c2)c2.scrollTop=top;}
});
function togglePause(){if(G.mode==='play')setMode('pause');else if(G.mode==='pause'||G.mode==='sheet')setMode('play');}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play')setMode('pause');});

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){
    if(G.mode==='play'){if(G.stop>0)G.stop--;else update();}
    else if(G.mode==='title')attractStep();
    for(const k in pressed)pressed[k]=false;
    acc-=1000/60;
  }
  render();requestAnimationFrame(frame);
}
fit();attract();setMode('title');requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
setTimeout(fit,300);
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
})();
</script>
