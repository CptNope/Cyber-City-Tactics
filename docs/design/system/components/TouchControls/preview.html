<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TouchControls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>html, body { margin: 0; background: var(--ink); } .tb { --b: 58px; --b2: 48px; }</style>
</head>
<body>
<div class="cct-preview">
<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;gap:8px"><button class="tb">MED</button><button class="tb spec">★</button><button class="tb">CHAR</button></div>
    <div style="display:flex;gap:8px"><button class="tb gun">GUN<small>24</small></button><button class="tb spell">FIRE<small>20</small></button><button class="tb move">DODGE</button></div>
  </div>
  <div style="display:flex;gap:8px"><button class="tb big">PUNCH</button><button class="tb big">KICK</button><button class="tb big move">JUMP</button></div>
</div>
</div>
</body>
</html>
