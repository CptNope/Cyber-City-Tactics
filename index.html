<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyber City Tactics</title>
<meta name="description" content="A vector brawler RPG for one or two players: a five-district campaign, an open-world Sprawl, Arena waves, skill trees, legendaries and secrets. Plays offline.">
<meta name="theme-color" content="#0c0a14">
<meta name="color-scheme" content="dark">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyber City">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<link rel="stylesheet" href="src/css/game.css">
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Cyber City Tactics game screen"></canvas>
    <button id="pauseBtn" aria-label="Pause">II</button>
    <button id="rotHint" hidden>Turn your phone sideways for a bigger screen · ✕</button>
    <div id="ov"></div>
    <div id="updBar" role="status" hidden><span>A new version is ready.</span><button data-u="go">Update now</button><button data-u="later" aria-label="Later">Later</button></div>
  </div>
  <div id="pad" aria-hidden="true">
    <div id="stick"><div id="ring"><div id="knob"></div></div></div>
    <div id="btns">
      <div class="urow"><button class="tb" data-act="item">MED</button><button class="tb spec" data-act="special">★</button><button class="tb" data-act="sheet">CHAR</button></div>
      <div class="mrow"><button class="tb gun" data-act="gun">GUN</button><button class="tb spell" data-act="spell">SPELL</button><button class="tb move" data-act="dodge">DODGE</button></div>
      <div class="brow"><button class="tb big" data-act="punch">PUNCH</button><button class="tb big" data-act="kick">KICK</button><button class="tb big move" data-act="jump">JUMP</button></div>
    </div>
  </div>
</div>

<noscript><p style="color:#efe9ff;font:16px sans-serif;padding:24px">Cyber City Tactics needs JavaScript to run.</p></noscript>

<!-- Game scripts. They are classic scripts that share one global scope, so the order matters:
     each file may only use, at load time, things defined in files above it.
     tools/build.mjs reads this list to build the single-file version in dist/. -->
<!-- BUILD:SCRIPTS -->
<script src="src/js/version.js"></script>
<script src="src/js/core/canvas.js"></script>
<script src="src/js/core/utils.js"></script>
<script src="src/js/core/audio.js"></script>
<script src="src/js/core/music.js"></script>
<script src="src/js/core/input.js"></script>
<script src="src/js/data/content.js"></script>
<script src="src/js/data/gear.js"></script>
<script src="src/js/data/world.js"></script>
<script src="src/js/data/legend-data.js"></script>
<script src="src/js/systems/legend.js"></script>
<script src="src/js/systems/skills.js"></script>
<script src="src/js/game/state.js"></script>
<script src="src/js/game/flow.js"></script>
<script src="src/js/game/combat.js"></script>
<script src="src/js/game/props.js"></script>
<script src="src/js/game/runners.js"></script>
<script src="src/js/game/allies.js"></script>
<script src="src/js/game/enemies.js"></script>
<script src="src/js/game/update.js"></script>
<script src="src/js/modes/sprawl.js"></script>
<script src="src/js/modes/dungeons.js"></script>
<script src="src/js/modes/hacking.js"></script>
<script src="src/js/modes/training.js"></script>
<script src="src/js/modes/arena.js"></script>
<script src="src/js/render/figures.js"></script>
<script src="src/js/render/atmos.js"></script>
<script src="src/js/render/looks.js"></script>
<script src="src/js/render/world.js"></script>
<script src="src/js/render/sprawl.js"></script>
<script src="src/js/render/hud.js"></script>
<script src="src/js/ui/attract.js"></script>
<script src="src/js/ui/screens.js"></script>
<script src="src/js/ui/overlay.js"></script>
<script src="src/js/ui/actions.js"></script>
<script src="src/js/pwa.js"></script>
<script src="src/js/main.js"></script>
<!-- /BUILD:SCRIPTS -->
</body>
</html>
