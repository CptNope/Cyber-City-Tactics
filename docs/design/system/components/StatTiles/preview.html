<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatTiles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Teko:wght@500;600&display=swap">
<style>html, body { margin: 0; background: var(--ink); }</style>
</head>
<body>
<div class="cct-preview">
<div class="attrs">
  <div class="attr"><span class="k">Strength</span><span class="v"><span>6</span><button class="btn sm">+1</button></span><span class="h">Punch, kick, grab and throw damage</span></div>
  <div class="attr"><span class="k">Agility</span><span class="v"><span>4</span></span><span class="h">Speed, gun damage, crits</span></div>
  <div class="attr"><span class="k">Hacking</span><span class="v"><span>3</span></span><span class="h">Wider windows when cracking locks</span></div>
</div>
<div class="stats" style="margin-top:10px">
  <div><b>128</b><span>Takedowns</span></div><div><b>14</b><span>Elites</span></div><div><b>29</b><span>Best combo</span></div>
</div>
</div>
</body>
</html>
